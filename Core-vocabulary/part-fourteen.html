<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 核心词汇 · 听写工坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Georgia', 'Times New Roman', serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f7faff 0%, #d6e6f5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 40px 36px;
            box-shadow: 0 30px 80px rgba(0, 20, 60, 0.18), 0 8px 24px rgba(0,0,0,0.03);
            border: 2px solid rgba(255, 215, 0, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 3px double #c5d9ec;
            padding-bottom: 14px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a3f6a;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 6px rgba(255, 215, 0, 0.2);
        }
        .header h1 small {
            font-size: 18px;
            font-weight: 400;
            color: #4f7295;
            margin-left: 12px;
        }
        .flag-icon {
            font-size: 36px;
        }

        .progress-area {
            display: flex;
            align-items: center;
            background: #eaf2fa;
            border-radius: 40px;
            padding: 6px 18px 6px 22px;
            margin-bottom: 28px;
            border: 1px solid #b7cfe5;
            gap: 10px;
        }
        .progress-text {
            font-size: 18px;
            font-weight: 600;
            color: #1d4570;
        }
        .progress-bar-bg {
            flex: 1;
            height: 10px;
            background: #c7d9ec;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f7d44a, #f0b34b);
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .progress-count {
            font-size: 17px;
            font-weight: 600;
            color: #1d4570;
            min-width: 70px;
            text-align: right;
        }

        .question-card {
            background: #ffffff;
            border-radius: 36px;
            padding: 32px 28px 30px;
            box-shadow: inset 0 1px 6px rgba(0,0,0,0.02), 0 8px 26px rgba(20, 50, 90, 0.08);
            border: 1px solid #e5eef9;
            margin-bottom: 20px;
        }

        .chinese-hint {
            font-size: 44px;
            font-weight: 700;
            color: #0a294a;
            text-align: center;
            letter-spacing: 1px;
            padding: 10px 0 6px;
            word-break: break-word;
            line-height: 1.3;
        }

        .word-detail {
            text-align: center;
            font-size: 18px;
            color: #4d6f8f;
            margin-top: 4px;
            min-height: 32px;
        }
        .word-detail span {
            background: #eef6fd;
            padding: 4px 18px;
            border-radius: 30px;
            display: inline-block;
        }

        .input-area {
            margin: 28px 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-area input {
            padding: 18px 24px;
            font-size: 24px;
            border: 2.5px solid #c7dcee;
            border-radius: 60px;
            outline: none;
            background: #f9fcff;
            transition: all 0.25s;
            letter-spacing: 0.5px;
            color: #0a2a4a;
        }
        .input-area input:focus {
            border-color: #f7b731;
            box-shadow: 0 0 0 5px rgba(247, 183, 49, 0.25);
            background: #ffffff;
        }
        .input-area input::placeholder {
            color: #a0bcd6;
            font-size: 18px;
            font-style: italic;
        }
        .input-area input:disabled {
            background: #f0f4f8;
            color: #3a5a7a;
            opacity: 0.8;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0 14px;
        }
        .nav-buttons .btn {
            flex: 0 1 auto;
            min-width: 80px;
            padding: 10px 20px;
            font-size: 16px;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            background: white;
            color: #1a3a5a;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 20, 50, 0.08);
            transition: all 0.15s ease;
            border: 1.5px solid #b7d0e8;
            flex: 1 1 auto;
            min-width: 110px;
            letter-spacing: 0.5px;
            background: linear-gradient(0deg, #f5faff, #ffffff);
        }
        .btn-primary {
            background: #1a4f8a;
            border-color: #1a4f8a;
            color: white;
            box-shadow: 0 6px 18px rgba(26, 79, 138, 0.30);
        }
        .btn-primary:hover { background: #0f3d6b; transform: scale(1.02); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-success {
            background: #2a7a4a;
            border-color: #2a7a4a;
            color: white;
            box-shadow: 0 6px 18px rgba(42, 122, 74, 0.25);
        }
        .btn-success:hover { background: #1d5f38; }
        .btn-warning {
            background: #e8a72b;
            border-color: #d99a1f;
            color: #1a2a3a;
        }
        .btn-warning:hover { background: #d6961b; }
        .btn-outline {
            background: transparent;
            border: 2px solid #8eb0d0;
            color: #1f4a7a;
        }
        .btn-outline:hover { background: #e3effa; }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .feedback {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            background: #f2f8ff;
            border: 2px solid #cfe0ef;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            line-height: 1.4;
            flex-wrap: wrap;
        }
        .feedback .tag {
            display: inline-block;
            margin: 0 4px;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 700;
        }
        .tag.correct { background: #7bc47f; color: white; }
        .tag.wrong { background: #f7a8a8; color: white; }

        .stats-panel {
            margin-top: 22px;
            background: #f0f7fe;
            border-radius: 28px;
            padding: 20px 22px;
            border: 1px solid #cfe0ef;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            font-size: 17px;
            color: #1d3d5d;
        }
        .stats-row strong { color: #0a2a4a; }
        .extra-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
        }
        .extra-buttons .btn {
            font-size: 15px;
            padding: 10px 20px;
            min-width: 90px;
            flex: 0 1 auto;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 20, 40, 0.5);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            max-width: 720px;
            width: 100%;
            max-height: 80vh;
            border-radius: 48px;
            padding: 32px 32px 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            overflow-y: auto;
            border: 2px solid #f7d44a;
        }
        .modal-box h2 {
            font-size: 26px;
            color: #183b66;
            border-bottom: 2px solid #dce8f2;
            padding-bottom: 14px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-box h2 button {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #6a8aaa;
            padding: 0 12px;
            transition: color 0.2s;
        }
        .modal-box h2 button:hover { color: #c0392b; }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 16px;
        }
        .word-item {
            display: flex;
            flex-wrap: wrap;
            padding: 8px 14px;
            background: #f5faff;
            border-radius: 30px;
            align-items: baseline;
            border: 1px solid #e3eef9;
            gap: 4px 10px;
        }
        .word-item .en { font-weight: 700; color: #0a2a4a; min-width: 110px; }
        .word-item .phon { color: #5f7f9f; font-size: 14px; }
        .word-item .pos { color: #4f6f8f; font-style: italic; }
        .word-item .zh { color: #1a4a7a; flex: 1; }
        .close-btn { margin-top: 22px; text-align: center; }

        @media (max-width: 550px) {
            .container { padding: 20px 16px; }
            .chinese-hint { font-size: 30px; }
            .input-area input { font-size: 20px; padding: 14px 18px; }
            .btn { font-size: 15px; padding: 10px 14px; min-width: 70px; }
            .header h1 { font-size: 22px; }
            .progress-text { font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1>📖 听写 <small>核心词汇</small></h1>
        <div class="flag-icon">🇬🇧</div>
    </div>

    <!-- 进度 -->
    <div class="progress-area">
        <span class="progress-text">📌 进度</span>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <span class="progress-count" id="progressCount">0 / 30</span>
    </div>

    <!-- 题目卡片 -->
    <div class="question-card">
        <div class="chinese-hint" id="chineseHint">加载中…</div>
        <div class="word-detail" id="wordDetail"><span>📘 输入英文</span></div>

        <div class="input-area">
            <input type="text" id="answerInput" placeholder="请输入英文单词…" autocomplete="off" />
        </div>

        <!-- 导航按钮（上一题/下一题） -->
        <div class="nav-buttons">
            <button class="btn btn-outline" id="prevBtn">◀ 上一题</button>
            <button class="btn btn-outline" id="nextBtn">下一题 ▶</button>
        </div>

        <div class="action-buttons">
            <button class="btn btn-success" id="submitAllBtn">✔ 提交全部</button>
            <button class="btn btn-outline" id="reshuffleBtn">🔄 重新随机</button>
        </div>

        <div class="feedback" id="feedback">✏️ 填写答案后点击“提交全部”</div>
    </div>

    <!-- 统计与功能 -->
    <div class="stats-panel">
        <div class="stats-row">
            <span>✅ 正确：<strong id="correctCount">0</strong></span>
            <span>❌ 错误：<strong id="wrongCount">0</strong></span>
            <span>📊 正确率：<strong id="rateDisplay">0%</strong></span>
        </div>
        <div class="stats-row" style="margin-top:6px; font-size:15px; color:#4a6a8a;">
            <span>🏆 历史最高：<strong id="highestDisplay">—</strong></span>
            <span>📈 本次对比：<strong id="compareDisplay">—</strong></span>
        </div>
        <div class="extra-buttons">
            <button class="btn btn-outline" id="showWrongBtn">📕 查看错题</button>
            <button class="btn btn-outline" id="showHistoryBtn">📜 历史分数</button>
            <button class="btn btn-outline" id="showBankBtn">📚 题库</button>
        </div>
    </div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h2><span id="modalTitle">标题</span><button id="modalCloseBtn">✕</button></h2>
        <div id="modalContent" class="word-list"></div>
        <div class="close-btn"><button class="btn btn-primary" id="modalCloseBtn2">关闭</button></div>
    </div>
</div>

<script>
    // ================================================================
    //  1. 完整题库（58词）
    // ================================================================
    const FULL_WORDS = [
        { en: "define", phon: "/dɪˈfaɪn/", pos: "v.", zh: "定义；明确" },
        { en: "definite", phon: "/ˈdefɪnət/", pos: "adj.", zh: "明确的；肯定的" },
        { en: "definition", phon: "/ˌdefɪˈnɪʃn/", pos: "n.", zh: "定义；清晰度" },
        { en: "infinite", phon: "/ˈɪnfɪnət/", pos: "adj.", zh: "无限的；无穷的" },
        { en: "finance", phon: "/ˈfaɪnæns; faɪˈnæns/", pos: "n./v.", zh: "财政，金融；资助" },
        { en: "financial", phon: "/faɪˈnænʃl/", pos: "adj.", zh: "金融的；财政的" },
        { en: "influence", phon: "/ˈɪnfluəns/", pos: "n./v.", zh: "影响；势力" },
        { en: "inherit", phon: "/ɪnˈherɪt/", pos: "v.", zh: "继承" },
        { en: "result", phon: "/rɪˈzʌlt/", pos: "n./v.", zh: "结果；导致" },
        { en: "cope", phon: "/kəʊp/", pos: "v.", zh: "应付；处理" },
        { en: "emergent", phon: "/iˈmɜːdʒənt/", pos: "adj.", zh: "紧急的；新兴的" },
        { en: "emergency", phon: "/iˈmɜːdʒənsi/", pos: "n.", zh: "紧急情况" },
        { en: "emphasis", phon: "/ˈemfəsɪs/", pos: "n.", zh: "强调；重点" },
        { en: "emphasize", phon: "/ˈemfəsaɪz/", pos: "v.", zh: "强调" },
        { en: "sweet", phon: "/swiːt/", pos: "adj.", zh: "甜的；可爱的" },
        { en: "brief", phon: "/briːf/", pos: "adj./n./v.", zh: "简短的；摘要；向…介绍情况" },
        { en: "in", phon: "/ɪn/", pos: "prep./adv./adj.", zh: "在…里；进入；流行的" },
        { en: "bright", phon: "/braɪt/", pos: "adj.", zh: "明亮的；聪明的" },
        { en: "brilliant", phon: "/ˈbrɪliənt/", pos: "adj.", zh: "灿烂的；杰出的" },
        { en: "bring", phon: "/brɪŋ/", pos: "v.", zh: "带来；导致" },
        { en: "final", phon: "/ˈfaɪnl/", pos: "adj./n.", zh: "最终的；决赛" },
        { en: "flexible", phon: "/ˈfleksəbl/", pos: "adj.", zh: "灵活的；柔韧的" },
        { en: "reflect", phon: "/rɪˈflekt/", pos: "v.", zh: "反射；反映；思考" },
        { en: "reflection", phon: "/rɪˈflekʃn/", pos: "n.", zh: "反射；反映；思考" },
        { en: "flight", phon: "/flaɪt/", pos: "n.", zh: "飞行；航班" },
        { en: "flood", phon: "/flʌd/", pos: "n./v.", zh: "洪水；淹没" },
        { en: "trick", phon: "/trɪk/", pos: "n./v.", zh: "把戏；欺骗" },
        { en: "play", phon: "/pleɪ/", pos: "v./n.", zh: "玩；演奏；戏剧" },
        { en: "trip", phon: "/trɪp/", pos: "n./v.", zh: "旅行；绊倒" },
        { en: "estimate", phon: "/ˈestɪmət; ˈestɪmeɪt/", pos: "n./v.", zh: "估计" },
        { en: "force", phon: "/fɔːs/", pos: "n./v.", zh: "力量；强迫" },
        { en: "frank", phon: "/fræŋk/", pos: "adj.", zh: "坦白的；直率的" },
        { en: "free", phon: "/friː/", pos: "adj./v./adv.", zh: "自由的；释放；免费地" },
        { en: "emerge", phon: "/iˈmɜːdʒ/", pos: "v.", zh: "出现；浮现" },
        { en: "healthy", phon: "/ˈhelθi/", pos: "adj.", zh: "健康的；有益健康的" },
        { en: "disturb", phon: "/dɪˈstɜːb/", pos: "v.", zh: "打扰；扰乱" },
        { en: "scarce", phon: "/skeəs/", pos: "adj.", zh: "稀少的；缺乏的" },
        { en: "scarcely", phon: "/ˈskeəsli/", pos: "adv.", zh: "几乎不；刚刚" },
        { en: "rarely", phon: "/ˈreəli/", pos: "adv.", zh: "很少；难得" },
        { en: "hard", phon: "/hɑːd/", pos: "adj./adv.", zh: "坚硬的；困难的；努力地" },
        { en: "hardly", phon: "/ˈhɑːdli/", pos: "adv.", zh: "几乎不" },
        { en: "merely", phon: "/ˈmɪəli/", pos: "adv.", zh: "仅仅；只不过" },
        { en: "nearly", phon: "/ˈnɪəli/", pos: "adv.", zh: "几乎；差不多" },
        { en: "trend", phon: "/trend/", pos: "n.", zh: "趋势；倾向" },
        { en: "trust", phon: "/trʌst/", pos: "n./v.", zh: "信任；相信" },
        { en: "truth", phon: "/truːθ/", pos: "n.", zh: "真理；事实" },
        { en: "flat", phon: "/flæt/", pos: "adj./n./adv.", zh: "平的；公寓；平直地" },
        { en: "try", phon: "/traɪ/", pos: "v./n.", zh: "尝试；努力" },
        { en: "calm", phon: "/kɑːm/", pos: "adj./v./n.", zh: "冷静的；使平静；平静" },
        { en: "several", phon: "/ˈsevrəl/", pos: "adj./pron.", zh: "几个；若干" },
        { en: "severe", phon: "/sɪˈvɪə(r)/", pos: "adj.", zh: "严重的；严厉的" },
        { en: "focus", phon: "/ˈfəʊkəs/", pos: "n./v.", zh: "焦点；集中" },
        { en: "follow", phon: "/ˈfɒləʊ/", pos: "v.", zh: "跟随；遵循；理解" },
        { en: "following", phon: "/ˈfɒləʊɪŋ/", pos: "prep./adj./n.", zh: "在…之后；接着的；追随者" },
        { en: "fellow", phon: "/ˈfeləʊ/", pos: "n./adj.", zh: "家伙；同伴的" },
        { en: "altogether", phon: "/ˌɔːltəˈɡeðə(r)/", pos: "adv.", zh: "总共；完全；总之" },
        { en: "fond", phon: "/fɒnd/", pos: "adj.", zh: "喜欢的；深情的" },
        { en: "health", phon: "/helθ/", pos: "n.", zh: "健康；健康状况" }
    ];

    // ================================================================
    //  2. 应用状态
    // ================================================================
    let currentQuestions = [];          // 当前30题
    let currentIndex = 0;              // 当前显示的题号（0~29）
    let userAnswers = [];              // 存储每道题的输入字符串 (长度30)
    let results = [];                 // 存储每道题的对错 (true/false) 或 null（未提交）
    let isSubmitted = false;          // 是否已提交全部

    // DOM 引用
    const chineseHint = document.getElementById('chineseHint');
    const wordDetail = document.getElementById('wordDetail');
    const answerInput = document.getElementById('answerInput');
    const submitAllBtn = document.getElementById('submitAllBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const reshuffleBtn = document.getElementById('reshuffleBtn');
    const feedback = document.getElementById('feedback');
    const progressFill = document.getElementById('progressFill');
    const progressCount = document.getElementById('progressCount');
    const correctCountEl = document.getElementById('correctCount');
    const wrongCountEl = document.getElementById('wrongCount');
    const rateDisplay = document.getElementById('rateDisplay');
    const highestDisplay = document.getElementById('highestDisplay');
    const compareDisplay = document.getElementById('compareDisplay');

    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalCloseBtn2 = document.getElementById('modalCloseBtn2');

    // ================================================================
    //  3. 辅助函数
    // ================================================================
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function pickRandomQuestions(count = 30) {
        const shuffled = shuffleArray([...FULL_WORDS]);
        return shuffled.slice(0, count);
    }

    // 保存当前输入到 userAnswers
    function saveCurrentAnswer() {
        if (currentIndex >= 0 && currentIndex < userAnswers.length) {
            userAnswers[currentIndex] = answerInput.value;
        }
    }

    // 加载指定题目的答案到输入框
    function loadAnswer(index) {
        if (index >= 0 && index < userAnswers.length) {
            answerInput.value = userAnswers[index] || '';
        }
    }

    // 更新进度条（已作答数量：userAnswers 中非空的数量）
    function updateProgress() {
        const total = currentQuestions.length;
        const answeredCount = userAnswers.filter(a => a && a.trim() !== '').length;
        const pct = total > 0 ? (answeredCount / total) * 100 : 0;
        progressFill.style.width = pct + '%';
        progressCount.textContent = `${answeredCount} / ${total}`;
    }

    // 更新统计显示（基于 results）
    function updateStats() {
        const total = results.length;
        const correct = results.filter(r => r === true).length;
        const wrong = results.filter(r => r === false).length;
        const rate = total > 0 ? Math.round((correct / total) * 100) : 0;

        correctCountEl.textContent = correct;
        wrongCountEl.textContent = wrong;
        rateDisplay.textContent = rate + '%';

        const highest = getHighestScore();
        highestDisplay.textContent = highest !== null ? highest + '%' : '—';

        if (isSubmitted) {
            if (highest !== null) {
                if (rate > highest) {
                    compareDisplay.textContent = '🎉 上升！新纪录！';
                    compareDisplay.style.color = '#1d6b2a';
                } else if (rate < highest) {
                    compareDisplay.textContent = '📉 下降，继续加油';
                    compareDisplay.style.color = '#a13030';
                } else {
                    compareDisplay.textContent = '➖ 持平';
                    compareDisplay.style.color = '#4f6f8f';
                }
            } else {
                compareDisplay.textContent = '🌟 首次完成';
                compareDisplay.style.color = '#1f4a7a';
            }
        } else {
            compareDisplay.textContent = '—';
            compareDisplay.style.color = '#4a6a8a';
        }
    }

    // ================================================================
    //  4. localStorage 操作
    // ================================================================
    function getHistoryScores() {
        try {
            const data = localStorage.getItem('wordQuiz_history');
            return data ? JSON.parse(data) : [];
        } catch { return []; }
    }

    function saveHistoryScore(score) {
        const history = getHistoryScores();
        history.push(score);
        localStorage.setItem('wordQuiz_history', JSON.stringify(history));
    }

    function getHighestScore() {
        const history = getHistoryScores();
        if (history.length === 0) return null;
        return Math.max(...history);
    }

    function saveWrongWord(wordObj) {
        let wrongs = [];
        try {
            const data = localStorage.getItem('wordQuiz_wrongs');
            wrongs = data ? JSON.parse(data) : [];
        } catch { wrongs = []; }
        wrongs.push({ ...wordObj, timestamp: Date.now() });
        localStorage.setItem('wordQuiz_wrongs', JSON.stringify(wrongs));
    }

    function getWrongWords() {
        try {
            const data = localStorage.getItem('wordQuiz_wrongs');
            return data ? JSON.parse(data) : [];
        } catch { return []; }
    }

    // ================================================================
    //  5. 核心渲染与交互
    // ================================================================
    function renderQuestion() {
        if (currentQuestions.length === 0) return;
        const q = currentQuestions[currentIndex];
        chineseHint.textContent = q.zh;
        wordDetail.innerHTML = `<span>${q.pos} · ${q.phon}</span>`;
        // 加载已保存的答案
        loadAnswer(currentIndex);
        // 更新进度
        updateProgress();
        // 如果已提交，禁用输入框并显示对错标记
        if (isSubmitted) {
            answerInput.disabled = true;
            const isCorrect = results[currentIndex];
            if (isCorrect === true) {
                feedback.className = 'feedback correct';
                feedback.innerHTML = `✅ 正确！答案：${q.en}`;
            } else if (isCorrect === false) {
                feedback.className = 'feedback wrong';
                feedback.innerHTML = `❌ 错误。正确答案：${q.en}，你的答案：${userAnswers[currentIndex] || '(空)'}`;
            } else {
                // 未判定（一般不会出现）
                feedback.className = 'feedback';
                feedback.textContent = '⏳ 尚未判定';
            }
        } else {
            answerInput.disabled = false;
            feedback.className = 'feedback';
            feedback.textContent = '✏️ 输入答案，完成后点击“提交全部”';
        }
        // 导航按钮状态
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = (currentIndex === currentQuestions.length - 1);
        // 聚焦输入框
        if (!answerInput.disabled) answerInput.focus();
    }

    // 切换题目
    function goToPrev() {
        if (currentIndex > 0) {
            saveCurrentAnswer();
            currentIndex--;
            renderQuestion();
        }
    }

    function goToNext() {
        if (currentIndex < currentQuestions.length - 1) {
            saveCurrentAnswer();
            currentIndex++;
            renderQuestion();
        }
    }

    // ---------- 提交全部 ----------
    function handleSubmitAll() {
        // 保存当前输入
        saveCurrentAnswer();

        // 如果已经提交过，可以重新提交（覆盖），所以重置结果
        results = new Array(currentQuestions.length).fill(null);
        isSubmitted = false; // 先重置，以便后续更新

        // 遍历所有题目，判断对错
        let correctCount = 0;
        let wrongCount = 0;
        currentQuestions.forEach((q, idx) => {
            const userAns = (userAnswers[idx] || '').trim();
            const isCorrect = userAns.toLowerCase() === q.en.toLowerCase();
            results[idx] = isCorrect;
            if (isCorrect) correctCount++;
            else {
                wrongCount++;
                // 记录错题（仅当用户有输入或未输入都算错，但未输入也记录为错题）
                saveWrongWord(q);
            }
        });

        // 计算正确率
        const rate = Math.round((correctCount / currentQuestions.length) * 100);
        // 保存分数
        saveHistoryScore(rate);
        isSubmitted = true;

        // 更新界面
        renderQuestion(); // 会显示当前题目的对错
        updateStats();
        // 反馈信息
        feedback.className = 'feedback';
        feedback.innerHTML = `🏁 已提交全部！正确 ${correctCount} 题，错误 ${wrongCount} 题，正确率 ${rate}%。<br>${wrongCount > 0 ? '错题已保存，可点击“查看错题”复习。' : '🎉 全部正确，太棒了！'}`;
        // 禁用输入框（所有题均不可编辑）
        answerInput.disabled = true;
        // 进度条显示完成
        updateProgress();
    }

    // ---------- 重新随机 ----------
    function reshuffle() {
        // 重置所有状态
        currentQuestions = pickRandomQuestions(30);
        currentIndex = 0;
        userAnswers = new Array(30).fill('');
        results = new Array(30).fill(null);
        isSubmitted = false;
        // 清空错题？一般不清除历史错题，只重置当前测验
        // 但也可以选择保留历史错题，不影响
        feedback.className = 'feedback';
        feedback.textContent = '🔄 已重新随机，开始作答！';
        renderQuestion();
        updateStats();
        // 启用输入框
        answerInput.disabled = false;
    }

    // ================================================================
    //  6. 模态框
    // ================================================================
    function showModal(title, contentHTML) {
        modalTitle.textContent = title;
        modalContent.innerHTML = contentHTML;
        modalOverlay.classList.add('active');
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
    }

    function showWrongWords() {
        const wrongs = getWrongWords();
        if (wrongs.length === 0) {
            showModal('📕 错题本', '<p style="text-align:center; font-size:18px; color:#4f6f8f;">🎉 暂无错题记录，继续保持！</p>');
            return;
        }
        const sorted = [...wrongs].reverse();
        let html = '';
        sorted.forEach(w => {
            html += `<div class="word-item">
                <span class="en">${w.en}</span>
                <span class="phon">${w.phon || ''}</span>
                <span class="pos">${w.pos || ''}</span>
                <span class="zh">${w.zh}</span>
            </div>`;
        });
        showModal(`📕 错题本 (共${wrongs.length}条)`, html);
    }

    function showHistory() {
        const history = getHistoryScores();
        if (history.length === 0) {
            showModal('📜 历史分数', '<p style="text-align:center; font-size:18px; color:#4f6f8f;">暂无历史记录</p>');
            return;
        }
        let html = '<div style="font-size:16px; margin-bottom:12px;">历次正确率 (%):</div>';
        history.forEach((score, idx) => {
            html += `<div style="display:flex; justify-content:space-between; padding:6px 14px; background:#f5faff; border-radius:20px; margin-bottom:5px;">
                <span>第 ${idx+1} 次</span>
                <span><strong>${score}%</strong></span>
            </div>`;
        });
        const highest = getHighestScore();
        if (highest !== null) {
            html += `<div style="margin-top:14px; font-weight:700; color:#1a4f8a;">🏆 最高分：${highest}%</div>`;
        }
        showModal('📜 历史分数', html);
    }

    function showBank() {
        let html = '';
        FULL_WORDS.forEach(w => {
            html += `<div class="word-item">
                <span class="en">${w.en}</span>
                <span class="phon">${w.phon}</span>
                <span class="pos">${w.pos}</span>
                <span class="zh">${w.zh}</span>
            </div>`;
        });
        showModal(`📚 完整题库 (${FULL_WORDS.length}词)`, html);
    }

    // ================================================================
    //  7. 初始化
    // ================================================================
    function init() {
        currentQuestions = pickRandomQuestions(30);
        userAnswers = new Array(30).fill('');
        results = new Array(30).fill(null);
        currentIndex = 0;
        isSubmitted = false;
        renderQuestion();
        updateStats();

        // 事件绑定
        submitAllBtn.addEventListener('click', handleSubmitAll);
        prevBtn.addEventListener('click', goToPrev);
        nextBtn.addEventListener('click', goToNext);
        reshuffleBtn.addEventListener('click', reshuffle);
        document.getElementById('showWrongBtn').addEventListener('click', showWrongWords);
        document.getElementById('showHistoryBtn').addEventListener('click', showHistory);
        document.getElementById('showBankBtn').addEventListener('click', showBank);

        modalCloseBtn.addEventListener('click', closeModal);
        modalCloseBtn2.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // 当输入框失去焦点时保存答案
        answerInput.addEventListener('blur', saveCurrentAnswer);
        // 按回车时保存并跳转下一题（方便连续输入）
        answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveCurrentAnswer();
                // 如果当前不是最后一题，自动跳转到下一题
                if (currentIndex < currentQuestions.length - 1) {
                    goToNext();
                } else {
                    // 如果是最后一题，可以提示或直接提交？这里不自动提交，让用户点击提交全部
                    feedback.textContent = '📌 已保存，请点击“提交全部”完成测验';
                    feedback.className = 'feedback';
                }
            }
        });
    }

    init();
</script>
</body>
