<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>核心词汇 · 汉译英听写</title>
<style>
/* ===================== 基础 ===================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  --indigo:#6366f1;
  --violet:#8b5cf6;
  --pink:#ec4899;
  --green:#10b981;
  --red:#f43f5e;
  --ink:#1e293b;
  --muted:#64748b;
  --line:#e6ebf5;
}

html,body{height:100%;}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:26px 16px;
  background:
    radial-gradient(circle at 10% 15%, rgba(99,102,241,.16), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(236,72,153,.13), transparent 42%),
    radial-gradient(circle at 80% 90%, rgba(16,185,129,.15), transparent 45%),
    linear-gradient(135deg,#f1f5ff 0%,#fbf5ff 50%,#effff9 100%);
  position:relative;
  overflow-x:hidden;
}

/* 背景光斑 */
body::before,body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;
}
body::before{width:440px;height:440px;background:rgba(99,102,241,.20);top:-140px;left:-140px;}
body::after{width:480px;height:480px;background:rgba(236,72,153,.15);bottom:-180px;right:-160px;}

/* ===================== 布局 ===================== */
.page{
  position:relative;z-index:1;
  width:min(700px,100%);
  display:flex;flex-direction:column;
  animation:fadeUp .5s cubic-bezier(.2,.8,.3,1);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:16px;
}

.brand{display:flex;align-items:center;gap:12px;}
.logo{
  width:48px;height:48px;border-radius:15px;flex-shrink:0;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  color:#fff;display:grid;place-items:center;
  font-family:Georgia,"Times New Roman",serif;font-size:23px;font-weight:700;
  box-shadow:0 12px 24px -10px rgba(99,102,241,.95);
  letter-spacing:-1px;
}
.brand-text h1{font-size:17.5px;font-weight:800;color:#312e81;letter-spacing:.3px;}
.brand-text p{font-size:11px;color:#94a3b8;letter-spacing:.8px;text-transform:uppercase;margin-top:3px;font-weight:600;}

.tools{display:flex;gap:8px;flex-wrap:wrap;}
.tool-btn{
  border:1px solid var(--line);background:#fff;color:#475569;
  font-family:inherit;font-size:13px;font-weight:700;
  padding:9px 14px;border-radius:12px;cursor:pointer;
  transition:all .2s;box-shadow:0 3px 10px -6px rgba(15,23,42,.25);
  display:flex;align-items:center;gap:5px;
}
.tool-btn:hover:not(:disabled){border-color:#c7d2fe;color:#4f46e5;background:#eef2ff;transform:translateY(-2px);}
.tool-btn:disabled{opacity:.42;cursor:not-allowed;}

/* ===================== 卡片 ===================== */
.card{
  position:relative;
  width:100%;
  min-height:480px;
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:28px;
  border:1px solid rgba(255,255,255,.95);
  box-shadow:
    0 34px 70px -30px rgba(79,70,229,.45),
    0 10px 26px -16px rgba(15,23,42,.18),
    0 0 0 1px rgba(99,102,241,.07);
  padding:28px 30px 24px;
  overflow:hidden;
  display:flex;flex-direction:column;
}

.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899,#f59e0b,#10b981,#6366f1);
  background-size:250% 100%;
  animation:slideGradient 7s linear infinite;
}
@keyframes slideGradient{to{background-position:250% 0;}}

.view{display:flex;flex-direction:column;flex:1;animation:fadeIn .28s ease;}
.view.hidden{display:none;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===================== 进度 ===================== */
.progress-wrap{margin-bottom:6px;}
.progress-info{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:9px;
}
.q-counter{color:#4f46e5;}
.progress-track{height:8px;background:#eef1f8;border-radius:99px;overflow:hidden;}
.progress-fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899);
  transition:width .4s cubic-bezier(.4,0,.2,1);
}

/* ===================== 题目 ===================== */
.question{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;padding:16px 0 20px;text-align:center;
}
.pos-tag{
  font-size:12px;font-weight:800;letter-spacing:.6px;
  color:#7c3aed;background:#f3e8ff;border:1px solid #e9d5ff;
  padding:4px 14px;border-radius:99px;
}
.cn-text{
  font-size:31px;font-weight:800;color:#1e293b;line-height:1.35;
  letter-spacing:.5px;
  text-shadow:0 3px 14px rgba(99,102,241,.14);
}
.tip{font-size:12.5px;color:#94a3b8;font-weight:500;}

.answer-input{
  width:100%;max-width:440px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:29px;font-weight:600;letter-spacing:.6px;
  text-align:center;padding:16px 18px;
  border:2px solid #e2e8f0;border-radius:18px;
  background:#fbfcff;outline:none;color:#0f172a;
  transition:all .25s;
}
.answer-input::placeholder{color:#c3cbdc;font-size:19px;font-weight:400;letter-spacing:0;}
.answer-input:focus{
  border-color:#6366f1;background:#fff;
  box-shadow:0 0 0 6px rgba(99,102,241,.13);
  transform:translateY(-1px);
}
.answer-input.correct{border-color:#10b981;background:#ecfdf5;color:#047857;}
.answer-input.wrong{border-color:#f43f5e;background:#fff1f2;color:#be123c;}

.feedback{
  min-height:24px;font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  gap:6px;flex-wrap:wrap;line-height:1.6;
}
.feedback.ok{color:#047857;}
.feedback.no{color:#be123c;}
.feedback b{font-family:Georgia,serif;font-size:16px;}
.feedback .ph{color:#94a3b8;font-weight:500;font-size:12.5px;}
.feedback s{opacity:.65;}

/* ===================== 按钮 ===================== */
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{
  border:none;cursor:pointer;font-family:inherit;
  font-size:14.5px;font-weight:700;
  padding:13px 22px;border-radius:14px;transition:all .2s;
}
.btn.primary{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  box-shadow:0 12px 24px -12px rgba(99,102,241,.95);
  margin-left:auto;
}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 18px 30px -14px rgba(99,102,241,.95);}
.btn.primary:active{transform:translateY(0);}
.btn.ghost{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;}
.btn.ghost:hover:not(:disabled){background:#e8eefb;color:#4f46e5;border-color:#c7d2fe;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* ===================== 结果页 ===================== */
.result-head{display:flex;gap:26px;align-items:center;padding:8px 0 20px;flex-wrap:wrap;}

.score-ring{
  width:142px;height:142px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;
  background:conic-gradient(from -90deg,#6366f1 0deg,#a855f7 0deg,#e9eef8 0deg 360deg);
  transition:background .8s cubic-bezier(.4,0,.2,1);
  box-shadow:0 14px 30px -18px rgba(99,102,241,.9);
}
.score-inner{
  width:112px;height:112px;border-radius:50%;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 3px 12px rgba(99,102,241,.12);
}
.score-num{font-family:Georgia,serif;font-size:38px;font-weight:900;color:#4338ca;line-height:1;}
.score-unit{font-size:12px;font-weight:800;color:#94a3b8;margin-top:3px;letter-spacing:1px;}

.result-meta{flex:1;min-width:210px;}
.result-meta h2{font-size:23px;color:#312e81;font-weight:900;margin-bottom:6px;}
.result-meta p{font-size:13.5px;color:var(--muted);font-weight:600;}

.cmp{margin-top:12px;font-size:13.5px;font-weight:700;padding:11px 15px;border-radius:13px;line-height:1.55;}
.cmp.up{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;}
.cmp.down{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;}
.cmp.same{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;}
.cmp.first{background:#fefce8;color:#a16207;border:1px solid #fde68a;}

.advice{
  background:linear-gradient(135deg,#f5f3ff,#eff6ff);
  border:1px solid #e0e7ff;border-radius:18px;
  padding:17px 19px;margin-bottom:18px;
}
.advice-title{font-size:14.5px;font-weight:900;color:#4338ca;margin-bottom:7px;}
.advice-text{font-size:13.5px;color:#475569;line-height:1.75;}
.advice-extra{
  margin-top:10px;font-size:12.5px;color:#b45309;font-weight:600;
  background:#fffbeb;border-radius:9px;padding:7px 11px;border:1px solid #fde68a;
}
.result-nav{margin-top:auto;}
.result-nav .btn{margin-left:0;}
.result-nav .btn.primary{margin-left:auto;}

/* ===================== 弹窗 ===================== */
.modal{
  position:fixed;inset:0;z-index:100;
  background:rgba(30,41,59,.38);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;visibility:hidden;transition:all .25s;
}
.modal.open{opacity:1;visibility:visible;}
.modal-box{
  width:min(740px,100%);max-height:84vh;
  background:#fff;border-radius:24px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 50px 90px -35px rgba(15,23,42,.55);
  transform:translateY(16px) scale(.97);
  transition:transform .3s cubic-bezier(.34,1.4,.64,1);
}
.modal.open .modal-box{transform:translateY(0) scale(1);}

.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,#f8faff,#f5f3ff);
}
.modal-head h3{font-size:16px;color:#312e81;display:flex;align-items:center;gap:9px;font-weight:900;}
.badge{
  background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;
  font-size:11.5px;padding:2px 10px;border-radius:99px;font-weight:800;
}
.modal-close{
  width:34px;height:34px;border-radius:11px;border:none;background:#fff;
  color:#64748b;font-size:15px;cursor:pointer;transition:.2s;
  box-shadow:0 3px 8px -3px rgba(15,23,42,.25);
}
.modal-close:hover{background:#fee2e2;color:#dc2626;transform:rotate(90deg);}
.modal-body{padding:18px 22px 24px;overflow-y:auto;}

.search-input{
  width:100%;padding:12px 16px;border-radius:14px;
  border:1px solid var(--line);font-family:inherit;font-size:14px;
  outline:none;background:#f9fafc;transition:.2s;margin-bottom:14px;
}
.search-input:focus{border-color:#a5b4fc;background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12);}

.bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;}
.bank-item{
  border:1px solid var(--line);border-radius:14px;padding:11px 13px;
  background:#fcfdff;transition:.2s;
}
.bank-item:hover{border-color:#c7d2fe;background:#f5f7ff;transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(99,102,241,.9);}
.bank-en{font-family:Georgia,serif;font-size:16.5px;font-weight:800;color:#312e81;}
.bank-ph{font-size:11.5px;color:#94a3b8;margin-top:2px;}
.bank-pos{
  display:inline-block;font-size:10.5px;font-weight:800;color:#7c3aed;
  background:#f3e8ff;padding:2px 8px;border-radius:99px;margin-top:6px;
}
.bank-cn{font-size:12.5px;color:#475569;margin-top:6px;line-height:1.55;}

.hist-summary{
  background:linear-gradient(135deg,#eef2ff,#f5f3ff);
  border:1px solid #e0e7ff;border-radius:16px;
  padding:14px 18px;margin-bottom:16px;
  display:flex;gap:26px;flex-wrap:wrap;
}
.hist-summary div{display:flex;flex-direction:column;gap:3px;}
.hist-summary span{font-size:11.5px;color:#64748b;font-weight:700;letter-spacing:.4px;}
.hist-summary strong{font-family:Georgia,serif;font-size:22px;color:#4338ca;font-weight:900;}

.hist-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;border-radius:14px;border:1px solid var(--line);
  margin-bottom:9px;background:#fcfdff;transition:.2s;
}
.hist-item.best{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a;}
.hist-left{display:flex;align-items:center;gap:10px;}
.hist-score{font-family:Georgia,serif;font-size:24px;font-weight:900;color:#4338ca;}
.hist-score small{font-size:12px;color:#94a3b8;margin-left:2px;font-family:inherit;font-weight:700;}
.crown{font-size:11px;font-weight:800;color:#b45309;background:#fef3c7;border:1px solid #fde68a;padding:2px 8px;border-radius:99px;}
.hist-right{text-align:right;}
.hist-detail{font-size:13px;font-weight:700;color:#475569;}
.hist-time{font-size:11.5px;color:#94a3b8;margin-top:3px;}

.wrong-item{
  border:1px solid #fee2e2;border-left:4px solid #f43f5e;
  background:#fff8f8;border-radius:13px;padding:13px 15px;margin-bottom:10px;
  animation:fadeIn .3s ease;
}
.wrong-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.wrong-no{
  width:21px;height:21px;border-radius:50%;background:#f43f5e;color:#fff;
  font-size:11px;font-weight:800;display:grid;place-items:center;flex-shrink:0;
}
.wrong-en{font-family:Georgia,serif;font-size:19px;font-weight:900;color:#be123c;}
.wrong-ph{font-size:12px;color:#94a3b8;}
.wrong-pos{font-size:10.5px;font-weight:800;color:#7c3aed;background:#f3e8ff;padding:2px 8px;border-radius:99px;}
.wrong-cn{font-size:13px;color:#475569;margin-top:7px;line-height:1.6;}
.wrong-ans{font-size:12.5px;color:#64748b;margin-top:5px;}
.wrong-ans .ua{color:#be123c;text-decoration:line-through;font-weight:800;}

.empty{text-align:center;color:#94a3b8;font-size:14px;padding:34px 10px;font-weight:600;}

.btn.danger-ghost{
  margin-top:14px;width:100%;background:#fff5f5;color:#dc2626;
  border:1px solid #fecaca;font-size:13.5px;padding:11px;
}
.btn.danger-ghost:hover{background:#fee2e2;}

/* ===================== 响应式 ===================== */
@media (max-width:560px){
  body{padding:16px 10px;}
  .card{padding:22px 18px 18px;border-radius:24px;min-height:440px;}
  .cn-text{font-size:25px;}
  .answer-input{font-size:24px;padding:14px;}
  .answer-input::placeholder{font-size:16px;}
  .btn{padding:12px 16px;font-size:13.5px;}
  .nav{gap:8px;}
  .btn.primary{margin-left:0;flex:1;order:3;min-width:100%;}
  .brand-text p{display:none;}
  .tool-btn span{display:none;}
  .tool-btn{padding:9px 12px;font-size:15px;}
  .result-head{gap:18px;justify-content:center;text-align:center;}
  .result-meta{text-align:center;}
  .score-ring{width:126px;height:126px;}
  .score-inner{width:98px;height:98px;}
  .score-num{font-size:32px;}
  .result-nav .btn.primary{margin-left:0;min-width:100%;}
  .bank-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div class="page">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">Aa</div>
      <div class="brand-text">
        <h1>核心词汇 · 汉译英</h1>
        <p>Vocabulary Dictation · Random 30</p>
      </div>
    </div>
    <div class="tools">
      <button class="tool-btn" id="btnBank" title="查看完整题库">📚<span>题库</span></button>
      <button class="tool-btn" id="btnHistory" title="查看历史成绩">🏆<span>历史</span></button>
      <button class="tool-btn" id="btnWrong" title="查看本次错题" disabled>❌<span>错题</span></button>
    </div>
  </header>

  <!-- 主卡片 -->
  <main class="card">

    <!-- ============ 答题视图 ============ -->
    <section id="quizView" class="view">
      <div class="progress-wrap">
        <div class="progress-info">
          <span class="q-counter" id="qCounter">第 1 / 30 题</span>
          <span id="answeredInfo">已作答 0 / 30</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="question">
        <div class="pos-tag" id="posTag">adj./adv.</div>
        <div class="cn-text" id="cnText">独自的；单独地</div>
        <div class="tip">✍️ 请写出对应的英文单词</div>
        <input id="answerInput" class="answer-input" type="text"
               placeholder="Type the English word..."
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="nav">
        <button class="btn ghost" id="btnPrev">← 上一题</button>
        <button class="btn ghost" id="btnNext">下一题 →</button>
        <button class="btn primary" id="btnSubmit">提交答卷</button>
      </div>
    </section>

    <!-- ============ 结果视图 ============ -->
    <section id="resultView" class="view hidden">
      <div class="result-head">
        <div class="score-ring" id="scoreRing">
          <div class="score-inner">
            <span class="score-num" id="scoreNum">0</span>
            <span class="score-unit">分</span>
          </div>
        </div>
        <div class="result-meta">
          <h2 id="resultTitle">🎉 测试完成</h2>
          <p id="resultDetail">正确 0 / 30 题 · 正确率 0%</p>
          <div class="cmp first" id="compareBox"></div>
        </div>
      </div>

      <div class="advice" id="adviceBox"></div>

      <div class="nav result-nav">
        <button class="btn ghost" id="btnReviewWrong">❌ 查看错题</button>
        <button class="btn ghost" id="btnHist2">🏆 历史成绩</button>
        <button class="btn primary" id="btnRestart">🔄 重新随机一组</button>
      </div>
    </section>

  </main>
</div>

<!-- ============ 题库弹窗 ============ -->
<div class="modal" id="bankModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>📚 完整题库 <span class="badge" id="bankCount">63</span></h3>
      <button class="modal-close" data-close="bankModal">✕</button>
    </div>
    <div class="modal-body">
      <input class="search-input" id="bankSearch" placeholder="🔍 搜索单词或中文释义...">
      <div class="bank-grid" id="bankGrid"></div>
    </div>
  </div>
</div>

<!-- ============ 历史成绩弹窗 ============ -->
<div class="modal" id="historyModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>🏆 历史成绩</h3>
      <button class="modal-close" data-close="historyModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="hist-summary" id="histSummary"></div>
      <div id="historyList"></div>
      <button class="btn danger-ghost" id="btnClearHistory">🗑️ 清空历史成绩</button>
    </div>
  </div>
</div>

<!-- ============ 错题弹窗 ============ -->
<div class="modal" id="wrongModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>❌ 本次错题回顾</h3>
      <button class="modal-close" data-close="wrongModal">✕</button>
    </div>
    <div class="modal-body">
      <div id="wrongList"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   一、词库（63 词）
   ========================================================= */
const WORDS = [
  {en:'alone',         ph:'/əˈloʊn/',        pos:'adj./adv.', cn:'独自的；单独地'},
  {en:'be',            ph:'/biː/',           pos:'v.',        cn:'是，存在'},
  {en:'by',            ph:'/baɪ/',           pos:'prep.',     cn:'通过，被，在……旁边'},
  {en:'crime',         ph:'/kraɪm/',         pos:'n.',        cn:'犯罪，罪行'},
  {en:'criminal',      ph:'/ˈkrɪmɪnl/',      pos:'n./adj.',   cn:'罪犯；犯罪的'},

/* =========================================================
   二、工具函数
   ========================================================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(a){
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function norm(s){
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}
function isCorrect(user, ans){
  const u = norm(user);
  return u !== '' && u === norm(ans);
}

/* =========================================================
   三、状态
   ========================================================= */
const TOTAL = 30;
const HISTORY_KEY = 'vocab_dictation_history_v1';

let quiz = [];
let answers = [];
let idx = 0;
let submitted = false;
let wrongItems = [];

/* =========================================================
   四、出题与渲染
   ========================================================= */
function newQuiz(){
  quiz = shuffle(WORDS).slice(0, TOTAL);       // 不重复随机 30 题
  answers = new Array(quiz.length).fill('');
  idx = 0;
  submitted = false;
  wrongItems = [];

  $('btnWrong').disabled = true;
  $('quizView').classList.remove('hidden');
  $('resultView').classList.add('hidden');

  renderQuestion();
}

function renderQuestion(){
  const q = quiz[idx];

  $('qCounter').textContent = `第 ${idx + 1} / ${quiz.length} 题`;
  $('posTag').textContent = q.pos;
  $('cnText').textContent = q.cn;

  const inp = $('answerInput');
  inp.value = answers[idx] || '';
  inp.readOnly = false;
  inp.classList.remove('correct', 'wrong');

  const fb = $('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';

  $('btnPrev').disabled = (idx === 0);
  $('btnNext').disabled = (idx === quiz.length - 1);

  updateProgress();
  setTimeout(() => { try { inp.focus({preventScroll:true}); } catch(e){} }, 40);
}

function updateProgress(){
  const answered = answers.filter(a => (a || '').trim() !== '').length;
  $('progressFill').style.width = ((idx + 1) / quiz.length * 100) + '%';
  $('answeredInfo').textContent = `已作答 ${answered} / ${quiz.length}`;
}

/* =========================================================
   五、交互事件
   ========================================================= */
$('answerInput').addEventListener('input', e => {
  if (submitted) return;
  answers[idx] = e.target.value;
  updateProgress();
});

$('answerInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (submitted) return;
  if (idx < quiz.length - 1) {
    idx++;
    renderQuestion();
  } else {
    submitQuiz();
  }
});

$('btnPrev').onclick = () => { if (idx > 0) { idx--; renderQuestion(); } };
$('btnNext').onclick = () => { if (idx < quiz.length - 1) { idx++; renderQuestion(); } };
$('btnSubmit').onclick = () => { if (!submitted) submitQuiz(); };

/* =========================================================
   六、提交与评分
   ========================================================= */
function submitQuiz(){
  if (submitted) return;
  submitted = true;

  let correctCount = 0;
  wrongItems = [];

  quiz.forEach((q, i) => {
    if (isCorrect(answers[i], q.en)) {
      correctCount++;
    } else {
      wrongItems.push({ q, user: (answers[i] || '').trim() });
    }
  });

  const rate = correctCount / quiz.length * 100;
  const score = Math.round(rate);

  // ---- 历史记录 ----
  const history = getHistory();
  const prevBest = history.length ? Math.max(...history.map(r => r.score)) : null;

  history.push({
    score,
    correct: correctCount,
    total: quiz.length,
    date: new Date().toISOString()
  });
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e){}

  $('btnWrong').disabled = false;

  showResult(score, correctCount, rate, prevBest);
}

function getAdvice(rate){
  if (rate >= 95) return {icon:'🏅', title:'卓越',
    text:'几乎全对！你的词汇掌握非常扎实。可以尝试用这些词造句，或做英译汉反向训练，进一步巩固语感。'};
  if (rate >= 85) return {icon:'🌟', title:'优秀',
    text:'大部分单词已经熟练，建议把错题整理成小卡片，利用碎片时间回顾，特别注意易混词的拼写细节。'};
  if (rate >= 70) return {icon:'👍', title:'良好',
    text:'基础不错，但仍有漏洞。建议对错题进行 2-3 遍默写，并结合例句记忆，避免"会认不会写"。'};
  if (rate >= 60) return {icon:'💪', title:'及格',
    text:'部分单词记忆不牢。建议用词根词缀 + 联想记忆法，每天分批记忆 15-20 个单词，第二天及时复习。'};
  return {icon:'🔥', title:'需要加强',
    text:'词汇基础较薄弱，建议先攻克高频词，每天学习 10-15 个，配合拼写练习，一周后重测本组题。'};
}

function animateNumber(el, target){
  clearInterval(el._timer);
  let cur = 0;
  const step = Math.max(1, Math.ceil(target / 26));
  if (target === 0) { el.textContent = '0'; return; }
  el._timer = setInterval(() => {
    cur += step;
    if (cur >= target) { cur = target; clearInterval(el._timer); }
    el.textContent = cur;
  }, 28);
}

function showResult(score, correctCount, rate, prevBest){
  $('quizView').classList.add('hidden');
  $('resultView').classList.remove('hidden');

  // 环形进度
  const deg = Math.max(0, Math.min(360, rate * 3.6));
  $('scoreRing').style.background =
    `conic-gradient(from -90deg, #6366f1 0deg, #a855f7 ${deg}deg, #e9eef8 ${deg}deg 360deg)`;

  animateNumber($('scoreNum'), score);

  $('resultTitle').textContent = score >= 85 ? '🎉 表现出色！' :
                                 score >= 60 ? '✅ 测试完成' : '📖 继续加油';
  $('resultDetail').textContent =
    `正确 ${correctCount} / ${quiz.length} 题 · 正确率 ${rate.toFixed(1)}%`;

  // 与历史最高分对比
  const cb = $('compareBox');
  if (prevBest === null) {
    cb.className = 'cmp first';
    cb.innerHTML = '🎊 首次测试完成，已记录你的基准成绩！';
  } else if (score > prevBest) {
    cb.className = 'cmp up';
    cb.innerHTML = `📈 历史最高分 <b>${prevBest}</b> 分 → 本次 <b>${score}</b> 分，<b>上升 ${score - prevBest} 分</b>！`;
  } else if (score === prevBest) {
    cb.className = 'cmp same';
    cb.innerHTML = `🤝 与历史最高分 <b>${prevBest}</b> 分持平，继续加油！`;
  } else {
    cb.className = 'cmp down';
    cb.innerHTML = `📉 历史最高分 <b>${prevBest}</b> 分 → 本次 <b>${score}</b> 分，<b>下降 ${prevBest - score} 分</b>，建议重点复习错题。`;
  }

  // 学习建议
  const adv = getAdvice(rate);
  const unanswered = answers.filter(a => !(a || '').trim()).length;
  $('adviceBox').innerHTML = `
    <div class="advice-title">${adv.icon} 学习建议 · ${adv.title}</div>
    <div class="advice-text">${adv.text}</div>
    ${unanswered ? `<div class="advice-extra">⚠️ 本次有 <b>${unanswered}</b> 题未作答，未作答按错误计算。</div>` : ''}
  `;

  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* =========================================================
   七、历史成绩
   ========================================================= */
function getHistory(){
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e) { return []; }
}

function renderHistory(){
  const history = getHistory();
  const list = $('historyList');
  const sum = $('histSummary');

  if (!history.length) {
    sum.innerHTML = '';
    list.innerHTML = '<p class="empty">暂无历史成绩，快去完成一次测试吧！</p>';
    return;
  }

  const best = Math.max(...history.map(r => r.score));
  const avg = history.reduce((s, r) => s + r.score, 0) / history.length;

  sum.innerHTML = `
    <div><span>测试次数</span><strong>${history.length}</strong></div>
    <div><span>历史最高分</span><strong>${best}</strong></div>
    <div><span>平均分</span><strong>${avg.toFixed(1)}</strong></div>
  `;

  list.innerHTML = history.slice().reverse().map(r => {
    const isBest = r.score === best;
    const d = new Date(r.date);
    const time = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return `
      <div class="hist-item ${isBest ? 'best' : ''}">
        <div class="hist-left">
          <span class="hist-score">${r.score}<small>分</small></span>
          ${isBest ? '<span class="crown">👑 最高</span>' : ''}
        </div>
        <div class="hist-right">
          <div class="hist-detail">正确 ${r.correct} / ${r.total}</div>
          <div class="hist-time">${time}</div>
        </div>
      </div>`;
  }).join('');
}

/* =========================================================
   八、题库
   ========================================================= */
function renderBank(filter){
  const f = (filter || '').trim().toLowerCase();
  const list = WORDS.filter(w =>
    !f || w.en.toLowerCase().includes(f) || w.cn.includes(f)
  );

  $('bankCount').textContent = list.length;
  $('bankGrid').innerHTML = list.length ? list.map(w => `
    <div class="bank-item">
      <div class="bank-en">${w.en}</div>
      <div class="bank-ph">${w.ph}</div>
      <div class="bank-pos">${w.pos}</div>
      <div class="bank-cn">${w.cn}</div>
    </div>`).join('') : '<p class="empty">没有找到匹配的单词</p>';
}

/* =========================================================
   九、错题
   ========================================================= */
function renderWrong(){
  const box = $('wrongList');
  if (!wrongItems.length) {
    box.innerHTML = '<p class="empty">🎉 本次全部答对，没有错题！</p>';
    return;
  }
  box.innerHTML = wrongItems.map((it, i) => `
    <div class="wrong-item">
      <div class="wrong-head">
        <span class="wrong-no">${i + 1}</span>
        <span class="wrong-en">${it.q.en}</span>
        <span class="wrong-ph">${it.q.ph}</span>
        <span class="wrong-pos">${it.q.pos}</span>
      </div>
      <div class="wrong-cn">${it.q.cn}</div>
      <div class="wrong-ans">你的答案：<span class="ua">${it.user ? esc(it.user) : '（未作答）'}</span></div>
    </div>`).join('');
}

/* =========================================================
   十、弹窗控制
   ========================================================= */
function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.onclick = () => closeModal(btn.dataset.close);
});
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open'));
});

/* =========================================================
   十一、按钮绑定
   ========================================================= */
$('btnBank').onclick = () => { renderBank(''); $('bankSearch').value = ''; openModal('bankModal'); };
$('btnHistory').onclick = () => { renderHistory(); openModal('historyModal'); };
$('btnWrong').onclick = () => { renderWrong(); openModal('wrongModal'); };

$('btnReviewWrong').onclick = () => { renderWrong(); openModal('wrongModal'); };
$('btnHist2').onclick = () => { renderHistory(); openModal('historyModal'); };
$('btnRestart').onclick = () => { newQuiz(); };

$('bankSearch').addEventListener('input', e => renderBank(e.target.value));

$('btnClearHistory').onclick = () => {
  if (confirm('确定要清空所有历史成绩吗？此操作不可撤销。')) {
    try { localStorage.removeItem(HISTORY_KEY); } catch(e){}
    renderHistory();
  }
};

/* =========================================================
   十二、启动
   ========================================================= */
newQuiz();
</script>
