<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核心词汇16 · 单词听写</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Poppins","Segoe UI",-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#e0f2fe 0%,#e0e7ff 30%,#fae8ff 62%,#fef9c3 100%);
  background-attachment:fixed;
  color:#1e1b4b;
  padding:16px;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}

/* ---------- 背景漂浮字母 ---------- */
.bg-deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.bg-deco span{
  position:absolute;font-weight:900;font-family:Georgia,"Times New Roman",serif;
  opacity:.14;animation:floatUp linear infinite;will-change:transform;
}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0deg);}
  100%{transform:translateY(-25vh) rotate(360deg);}
}

/* ---------- 布局 ---------- */
.app{position:relative;z-index:2;width:min(680px,100%);display:flex;flex-direction:column;}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;color:#3730a3;}
.brand .logo{
  font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:12px;
  background:linear-gradient(135deg,#818cf8,#22d3ee);
  box-shadow:0 6px 16px rgba(99,102,241,.35);
}
.header-actions{display:flex;gap:8px;}
.icon-btn{
  border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.8);
  color:#4338ca;font-weight:700;font-size:.82rem;font-family:inherit;
  padding:9px 14px;border-radius:999px;cursor:pointer;
  box-shadow:0 6px 16px rgba(99,102,241,.16);transition:.22s;
  backdrop-filter:blur(8px);
}
.icon-btn:hover{transform:translateY(-2px);background:#fff;box-shadow:0 10px 22px rgba(99,102,241,.28);}

.card{
  position:relative;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.95);
  border-radius:28px;
  box-shadow:0 24px 60px rgba(79,70,229,.15),0 1px 0 rgba(255,255,255,.9) inset;
  padding:24px;
  min-height:480px;
  display:flex;flex-direction:column;
}

.view{display:none;flex-direction:column;flex:1;animation:fadeIn .35s ease;}
.view.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ---------- 开始页 ---------- */
#view-start{align-items:center;justify-content:center;text-align:center;gap:14px;}
.start-emoji{font-size:3.4rem;line-height:1;filter:drop-shadow(0 8px 16px rgba(99,102,241,.3));animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.start-title{
  font-size:1.9rem;font-weight:900;letter-spacing:.02em;
  background:linear-gradient(100deg,#4f46e5,#06b6d4 45%,#f59e0b);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.start-sub{color:#4b5563;font-size:.95rem;}
.start-sub b{color:#4f46e5;}
.start-tips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px;}
.start-tips span{
  background:#eef2ff;color:#4338ca;font-size:.78rem;font-weight:600;
  padding:6px 12px;border-radius:999px;border:1px solid #e0e7ff;
}

/* ---------- 按钮 ---------- */
.btn-primary{
  border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#6366f1,#22d3ee);
  color:#fff;font-size:1.02rem;font-weight:800;letter-spacing:.03em;
  padding:15px 34px;border-radius:999px;
  box-shadow:0 12px 28px rgba(99,102,241,.4);transition:.22s;
}
.btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 18px 36px rgba(99,102,241,.5);}
.btn-primary:active{transform:translateY(-1px) scale(.99);}

.btn-ghost{
  flex:1;font-family:inherit;cursor:pointer;
  padding:12px 14px;border-radius:16px;
  border:2px solid #e0e7ff;background:#fff;color:#4f46e5;
  font-weight:700;font-size:.88rem;transition:.2s;
}
.btn-ghost:hover:not(:disabled){background:#eef2ff;border-color:#c7d2fe;transform:translateY(-2px);}
.btn-ghost:disabled{opacity:.42;cursor:not-allowed;}

.btn-submit{
  flex:1.2;font-family:inherit;cursor:pointer;
  padding:12px 14px;border-radius:16px;border:none;
  background:linear-gradient(135deg,#f59e0b,#f43f5e);
  color:#fff;font-weight:800;font-size:.9rem;letter-spacing:.04em;
  box-shadow:0 10px 24px rgba(244,63,94,.32);transition:.2s;
}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(244,63,94,.42);}

/* ---------- 答题页 ---------- */
#view-quiz{gap:14px;}
.q-head{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:700;color:#6b7280;}
.q-head b{color:#4f46e5;font-size:1rem;}
.q-answered b{color:#06b6d4;}
.progress{height:10px;background:#e0e7ff;border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#6366f1,#22d3ee);transition:width .4s cubic-bezier(.4,0,.2,1);}
.q-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px 0;text-align:center;}
.q-pos{
  display:inline-block;padding:6px 16px;border-radius:999px;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  color:#b45309;font-weight:800;font-size:.82rem;letter-spacing:.08em;
  box-shadow:0 4px 12px rgba(245,158,11,.22);
}
.q-cn{font-size:1.85rem;font-weight:900;line-height:1.4;color:#1e1b4b;max-width:92%;word-break:break-word;}
.q-hint{font-size:.8rem;color:#9ca3af;letter-spacing:.05em;}
.q-input{
  width:min(420px,100%);
  font-family:inherit;font-size:1.6rem;font-weight:800;
  text-align:center;letter-spacing:.06em;
  padding:14px 18px;border-radius:18px;
  border:2.5px solid #c7d2fe;background:#fff;color:#312e81;
  outline:none;transition:.2s;
  box-shadow:0 6px 18px rgba(99,102,241,.1);
}
.q-input::placeholder{color:#c7d2fe;font-weight:600;letter-spacing:0;font-size:1rem;}
.q-input:focus{border-color:#6366f1;box-shadow:0 0 0 6px rgba(99,102,241,.15),0 8px 22px rgba(99,102,241,.18);}
.q-foot{display:flex;gap:10px;align-items:center;}
.q-extra{display:flex;justify-content:center;margin-top:2px;}
.link-btn{
  background:none;border:none;cursor:pointer;font-family:inherit;
  color:#8b5cf6;font-size:.8rem;font-weight:600;
  text-decoration:underline;text-underline-offset:3px;opacity:.85;
}
.link-btn:hover{opacity:1;}

/* ---------- 结果页 ---------- */
#view-result{gap:14px;}
.ring-wrap{position:relative;width:150px;height:150px;margin:0 auto;flex-shrink:0;}
.ring-wrap svg{width:150px;height:150px;transform:rotate(-90deg);}
.ring-wrap circle{fill:none;stroke-width:13;stroke-linecap:round;}
.ring-bg{stroke:#e0e7ff;}
.ring-fill{stroke:#10b981;transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1);}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.ring-score{font-size:1.7rem;font-weight:900;color:#1e1b4b;line-height:1;}
.ring-score i{font-style:normal;color:#c7d2fe;font-size:1.1rem;margin:0 1px;}
.ring-label{font-size:.82rem;font-weight:800;color:#10b981;letter-spacing:.05em;}

.compare{text-align:center;font-size:.88rem;font-weight:700;padding:12px 16px;border-radius:16px;line-height:1.55;}
.compare b{font-size:1rem;}
.compare.up{background:linear-gradient(135deg,#d1fae5,#ecfdf5);color:#047857;border:1px solid #a7f3d0;}
.compare.down{background:linear-gradient(135deg,#ffe4e6,#fff1f2);color:#be123c;border:1px solid #fecdd3;}
.compare.same{background:linear-gradient(135deg,#e0f2fe,#f0f9ff);color:#0369a1;border:1px solid #bae6fd;}

.advice{background:linear-gradient(135deg,#eef2ff,#faf5ff);border:1px solid #e0e7ff;border-radius:18px;padding:14px 16px;}
.adv-title{font-weight:800;color:#4338ca;font-size:.95rem;margin-bottom:5px;}
.adv-text{font-size:.83rem;color:#4b5563;line-height:1.65;}

.wrong-title{display:flex;align-items:center;gap:4px;font-weight:800;font-size:.9rem;color:#be123c;margin-bottom:10px;}
.wrong-title span{font-weight:700;font-size:.78rem;color:#9ca3af;}
.wrong-list{display:flex;flex-direction:column;gap:10px;max-height:270px;overflow-y:auto;padding-right:4px;}
.wrong-list::-webkit-scrollbar{width:6px;}
.wrong-list::-webkit-scrollbar-thumb{background:#fecdd3;border-radius:6px;}
.wrong-item{
  background:#fff;border:1px solid #ffe4e6;border-left:4px solid #f43f5e;
  border-radius:14px;padding:11px 14px;box-shadow:0 4px 12px rgba(244,63,94,.07);
}
.wi-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.wi-word{font-weight:900;color:#be123c;font-size:1.05rem;letter-spacing:.02em;}
.wi-phon{color:#9ca3af;font-size:.78rem;}
.wi-cn{font-size:.82rem;color:#374151;margin-top:4px;line-height:1.55;}
.tag{
  display:inline-block;background:#eef2ff;color:#4338ca;
  font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px;
}
.tag.sm{font-size:.65rem;padding:1px 6px;}
.wi-your{font-size:.8rem;color:#6b7280;margin-top:6px;}
.wi-your .bad{color:#e11d48;font-weight:800;text-decoration:line-through;}
.all-right{text-align:center;padding:22px;color:#059669;font-weight:800;background:#ecfdf5;border-radius:16px;border:1px dashed #a7f3d0;}

.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
.result-actions .btn-primary{grid-column:1/-1;padding:14px;font-size:.95rem;}

/* ---------- 弹窗 ---------- */
.modal-mask{
  position:fixed;inset:0;z-index:50;background:rgba(30,27,75,.35);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:18px;opacity:0;visibility:hidden;transition:.28s;
}
.modal-mask.show{opacity:1;visibility:visible;}
.modal{
  width:min(640px,100%);max-height:82vh;background:#fff;border-radius:24px;
  box-shadow:0 30px 70px rgba(30,27,75,.3);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(16px) scale(.97);transition:.28s;
}
.modal-mask.show .modal{transform:none;}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
  background:linear-gradient(135deg,#eef2ff,#e0f2fe);border-bottom:1px solid #e0e7ff;
}
.modal-head h3{font-size:1rem;font-weight:800;color:#3730a3;}
.modal-head button{
  border:none;background:#fff;color:#6366f1;font-size:1rem;font-weight:800;
  width:32px;height:32px;border-radius:10px;cursor:pointer;
  box-shadow:0 3px 10px rgba(99,102,241,.18);transition:.2s;
}
.modal-head button:hover{background:#4f46e5;color:#fff;}
.modal-body{padding:18px 20px;overflow-y:auto;}
.modal-body::-webkit-scrollbar{width:7px;}
.modal-body::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:7px;}

.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bank-item{background:#f8faff;border:1px solid #e0e7ff;border-radius:14px;padding:10px 12px;}
.bi-word{font-weight:900;color:#3730a3;font-size:.95rem;}
.bi-phon{font-size:.72rem;color:#9ca3af;margin:2px 0 4px;}
.bi-cn{font-size:.76rem;color:#4b5563;line-height:1.55;}

.hist-list{display:flex;flex-direction:column;gap:9px;}
.hist-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;border-radius:14px;background:#f8faff;border:1px solid #e0e7ff;
}
.hist-item.best{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a;}
.hi-left{display:flex;flex-direction:column;gap:3px;}
.hi-rank{font-size:.7rem;font-weight:800;color:#6366f1;background:#eef2ff;padding:1px 7px;border-radius:6px;width:fit-content;}
.hi-time{font-size:.72rem;color:#9ca3af;}
.hi-right{display:flex;align-items:center;gap:8px;}
.hi-score{font-weight:900;color:#1e1b4b;font-size:1rem;}
.hi-score i{font-style:normal;color:#c7d2fe;font-size:.8rem;}
.hi-acc{font-size:.78rem;font-weight:800;color:#06b6d4;}
.hi-best{font-size:.65rem;font-weight:800;color:#b45309;background:#fde68a;padding:2px 7px;border-radius:6px;}
.empty-tip{text-align:center;color:#9ca3af;font-weight:600;padding:30px 10px;font-size:.9rem;}

@media (max-width:520px){
  .bank-grid{grid-template-columns:1fr;}
  .q-cn{font-size:1.5rem;}
  .q-input{font-size:1.3rem;}
  .card{padding:18px;}
  .start-title{font-size:1.5rem;}
}
</style>
</head>
<body>
<div class="bg-deco" id="bgDeco"></div>

<div class="app">
  <header>
    <div class="brand"><span class="logo">📚</span><span>核心词汇16 · 听写</span></div>
    <div class="header-actions">
      <button class="icon-btn" id="btnBank">📖 词库</button>
      <button class="icon-btn" id="btnHistory">🏆 历史</button>
    </div>
  </header>

  <main class="card">
    <!-- ========== 开始页 ========== -->
    <section class="view active" id="view-start">
      <div class="start-emoji">✍️</div>
      <h1 class="start-title">汉译英 · 单词听写</h1>
      <p class="start-sub">共 <b>57</b> 个核心词汇 · 随机抽取 <b>30</b> 题 · 题目不重复</p>
      <div class="start-tips">
        <span>🔤 看中文与词性</span><span>⌨️ 输入英文</span><span>⏎ 回车下一题</span>
      </div>
      <button class="btn-primary" id="btnStart">开始听写 →</button>
    </section>

    <!-- ========== 答题页 ========== -->
    <section class="view" id="view-quiz">
      <div class="q-head">
        <span class="q-index">第 <b id="qIndex">1</b> / <span id="qTotal">30</span> 题</span>
        <span class="q-answered">已作答 <b id="qAnswered">0</b></span>
      </div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

      <div class="q-body">
        <div class="q-pos" id="qPos">n.</div>
        <div class="q-cn" id="qCn">经济学家</div>
        <div class="q-hint">写出对应的英文单词</div>
        <input class="q-input" id="answerInput" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" placeholder="在此输入…">
      </div>

      <div class="q-foot">
        <button class="btn-ghost" id="prevBtn">← 上一题</button>
        <button class="btn-ghost" id="nextBtn">下一题 →</button>
        <button class="btn-submit" id="submitBtn">提交</button>
      </div>
      <div class="q-extra">
        <button class="link-btn" id="btnReshuffle">🔄 重新随机题目</button>
      </div>
    </section>

    <!-- ========== 结果页 ========== -->
    <section class="view" id="view-result">
      <div class="ring-wrap">
        <svg viewBox="0 0 160 160">
          <circle class="ring-bg" cx="80" cy="80" r="70"></circle>
          <circle class="ring-fill" id="ringFill" cx="80" cy="80" r="70"></circle>
        </svg>
        <div class="ring-text">
          <div class="ring-score"><span id="resCorrect">0</span><i>/</i><span id="resTotal">30</span></div>
          <div class="ring-label" id="resAcc">0%</div>
        </div>
      </div>

      <div class="compare" id="resCompare"></div>
      <div class="advice" id="resAdvice"></div>

      <div class="wrong-section">
        <div class="wrong-title">❌ 错题回顾 <span id="wrongTitleCount"></span></div>
        <div class="wrong-list" id="resWrong"></div>
      </div>

      <div class="result-actions">
        <button class="btn-primary" id="btnAgain">🔄 再抽 30 题</button>
        <button class="btn-ghost" id="btnShowWrong">❌ 查看错题</button>
        <button class="btn-ghost" id="btnBank2">📖 查看词库</button>
        <button class="btn-ghost" id="btnHistory2">🏆 历史分数</button>
      </div>
    </section>
  </main>
</div>

<!-- ========== 弹窗 ========== -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   1. 词库数据（57 词）
   ========================================================= */
const WORDS = [
  {w:'economist',    phon:'/ɪˈkɒnəmɪst/',        pos:'n.',            cn:'经济学家'},
  {w:'family',       phon:'/ˈfæməli/',            pos:'n./adj.',       cn:'家庭；家族；子女；家庭的'},
  {w:'familiar',     phon:'/fəˈmɪliə(r)/',        pos:'adj.',          cn:'熟悉的；常见的；亲近的'},
  {w:'prove',        phon:'/pruːv/',              pos:'v.',            cn:'证明；证实；检验'},
  {w:'approve',      phon:'/əˈpruːv/',            pos:'v.',            cn:'批准；赞成；同意'},
  {w:'approval',     phon:'/əˈpruːvl/',           pos:'n.',            cn:'批准；赞成；认可'},
  {w:'disapprove',   phon:'/ˌdɪsəˈpruːv/',        pos:'v.',            cn:'不赞成；不同意'},
  {w:'improve',      phon:'/ɪmˈpruːv/',           pos:'v.',            cn:'改善；提高；改进'},
  {w:'improvement',  phon:'/ɪmˈpruːvmənt/',       pos:'n.',            cn:'改进；改善；提高'},
  {w:'yet',          phon:'/jet/',                pos:'adv./conj.',    cn:'还；但是；已经；然而'},
  {w:'yield',        phon:'/jiːld/',              pos:'v./n.',         cn:'产生；屈服；出产；产量；收益'},
  {w:'lied',         phon:'/laɪd/',               pos:'v.',            cn:'撒谎（lie 的过去式和过去分词）'},
  {w:'increase',     phon:'/ɪnˈkriːs/',           pos:'v./n.',         cn:'增加；提高；增长'},
  {w:'increasingly', phon:'/ɪnˈkriːsɪŋli/',       pos:'adv.',          cn:'越来越多地；日益'},
  {w:'decrease',     phon:'/dɪˈkriːs/',           pos:'v./n.',         cn:'减少；降低'},
  {w:'indeed',       phon:'/ɪnˈdiːd/',            pos:'adv.',          cn:'确实；的确；实际上'},
  {w:'economy',      phon:'/ɪˈkɒnəmi/',           pos:'n.',            cn:'经济；节约'},
  {w:'economic',     phon:'/ˌiːkəˈnɒmɪk/',        pos:'adj.',          cn:'经济的；经济上的；有利可图的'},
  {w:'economical',   phon:'/ˌiːkəˈnɒmɪkl/',       pos:'adj.',          cn:'节约的；经济的；实惠的'},
  {w:'negotiate',    phon:'/nɪˈɡəʊʃieɪt/',        pos:'v.',            cn:'谈判；协商；洽谈'},
  {w:'origin',       phon:'/ˈɒrɪdʒɪn/',           pos:'n.',            cn:'起源；原点；出身'},
  {w:'original',     phon:'/əˈrɪdʒənl/',          pos:'adj./n.',       cn:'原始的；最初的；原创的；原件；原作'},
  {w:'ought',        phon:'/ɔːt/',                pos:'aux.',          cn:'应该（ought to）'},
  {w:'pain',         phon:'/peɪn/',               pos:'n./v.',         cn:'疼痛；痛苦；努力；使痛苦'},
  {w:'take',         phon:'/teɪk/',               pos:'v.',            cn:'拿；取；花费；乘坐；接受'},
  {w:'No',           phon:'/nəʊ/',                pos:'adv./adj./n.',  cn:'不；没有；不是；否定的回答'},
  {w:'painful',      phon:'/ˈpeɪnfl/',            pos:'adj.',          cn:'痛苦的；疼痛的；令人不快的'},
  {w:'paint',        phon:'/peɪnt/',              pos:'n./v.',         cn:'油漆；颜料；绘画；涂油漆'},

  {w:'employer',     phon:'/ɪmˈplɔɪə(r)/',        pos:'n.',            cn:'雇主；老板'},

  {w:'unemployment', phon:'/ˌʌnɪmˈplɔɪmənt/',     pos:'n.',            cn:'失业；失业人数'},

  {w:'go',           phon:'/ɡəʊ/',                pos:'v./n.',         cn:'去；走；进行；尝试'},

/* =========================================================
   2. 常量与状态
   ========================================================= */
const LS_KEY  = 'vocab16_quiz_records_v1';
const TOTAL_Q = 30;

let quiz = [];         // 当前题目（含 ans 字段）
let cur  = 0;          // 当前题号
let submitted = false;
let lastWrong = [];    // 最近一次错题
const input = document.getElementById('answerInput');

/* =========================================================
   3. 工具函数
   ========================================================= */
const $ = id => document.getElementById(id);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function norm(s){
  return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g,' ');
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}

function pad(n){ return n<10 ? '0'+n : ''+n; }

/* =========================================================
   4. 历史记录（localStorage）
   ========================================================= */
function getRecords(){
  try{
    const r = JSON.parse(localStorage.getItem(LS_KEY));
    return Array.isArray(r) ? r : [];
  }catch(e){ return []; }
}
function saveRecord(rec){
  const r = getRecords();
  r.unshift(rec);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(r.slice(0,100))); }catch(e){}
}
function getBest(){
  const r = getRecords();
  if(!r.length) return null;
  return Math.max.apply(null, r.map(x => x.correct));
}

/* =========================================================
   5. 视图切换
   ========================================================= */
function showView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('view-' + name).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

/* =========================================================
   6. 出题 / 渲染
   ========================================================= */
function newQuiz(){
  quiz = shuffle(WORDS).slice(0, TOTAL_Q).map(w => Object.assign({}, w, {ans:''}));
  cur = 0;
  submitted = false;
  lastWrong = [];
  showView('quiz');
  renderQuestion();
}

function renderQuestion(){
  if(!quiz.length) return;
  const q = quiz[cur];

  $('qIndex').textContent  = cur + 1;
  $('qTotal').textContent  = quiz.length;
  $('qPos').textContent    = q.pos;
  $('qCn').textContent     = q.cn;

  input.value = q.ans;

  $('progressFill').style.width = ((cur + 1) / quiz.length * 100).toFixed(2) + '%';
  $('prevBtn').disabled = (cur === 0);

  const nextBtn = $('nextBtn');
  if(cur === quiz.length - 1){
    nextBtn.disabled = true;
    nextBtn.textContent = '已是最后一题';
  }else{
    nextBtn.disabled = false;
    nextBtn.textContent = '下一题 →';
  }

  updateAnswered();
  setTimeout(()=> input.focus(), 40);
}

function updateAnswered(){
  const n = quiz.filter(q => q.ans.trim() !== '').length;
  $('qAnswered').textContent = n;
}

/* =========================================================
   7. 提交与判分
   ========================================================= */
function doSubmit(){
  if(submitted || !quiz.length) return;
  submitted = true;

  const wrong = [];
  let correct = 0;

  quiz.forEach(q => {
    const ua = norm(q.ans);
    if(ua && ua === norm(q.w)){
      correct++;
    }else{
      wrong.push(Object.assign({}, q, {ua: q.ans.trim()}));
    }
  });

  const total = quiz.length;
  const acc   = Math.round(correct / total * 100);

  // 先取历史最高，再保存本次记录
  const prevBest = getBest();
  saveRecord({ correct, total, acc, time: Date.now() });

  lastWrong = wrong;
  renderResult({correct, total, acc, prevBest, wrong});
  showView('result');
}

function renderResult(r){
  const correct  = r.correct;
  const total    = r.total;
  const acc      = r.acc;
  const prevBest = r.prevBest;
  const wrong    = r.wrong;

  /* ---- 圆环 ---- */
  const R = 70, C = 2 * Math.PI * R;
  const ring = $('ringFill');
  const color = acc >= 85 ? '#10b981' : acc >= 70 ? '#06b6d4' : acc >= 60 ? '#f59e0b' : '#f43f5e';

  ring.style.transition = 'none';
  ring.style.strokeDasharray  = C;
  ring.style.strokeDashoffset = C;
  ring.style.stroke = color;

  void ring.getBoundingClientRect();          // 强制重排，让动画生效

  ring.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)';
  requestAnimationFrame(()=>{
    ring.style.strokeDashoffset = C * (1 - correct / total);
  });

  $('resTotal').textContent = total;
  $('ringFill').style.stroke = color;
  $('resAcc').style.color = color;
  animateNumber($('resCorrect'), correct);
  animateNumber($('resAcc'), acc, '%');

  /* ---- 与历史最高分对比 ---- */
  const cmp = $('resCompare');
  if(prevBest === null){
    cmp.className = 'compare up';
    cmp.innerHTML = '🎉 首次记录，已保存为历史最高分！';
  }else if(correct > prevBest){
    cmp.className = 'compare up';
    cmp.innerHTML = `📈 历史最高 <b>${prevBest}</b> 分 → 本次 <b>${correct}</b> 分，<b>上升了 +${correct - prevBest}</b> 分，进步明显！`;
  }else if(correct < prevBest){
    cmp.className = 'compare down';
    cmp.innerHTML = `📉 历史最高 <b>${prevBest}</b> 分 → 本次 <b>${correct}</b> 分，<b>下降了 ${prevBest - correct}</b> 分，继续加油！`;
  }else{
    cmp.className = 'compare same';
    cmp.innerHTML = `➖ 与历史最高分 <b>${prevBest}</b> 分持平，状态稳定！`;
  }

  /* ---- 学习建议 ---- */
  const adv = getAdvice(acc);
  $('resAdvice').innerHTML =
    `<div class="adv-title">${adv.t}</div><div class="adv-text">${adv.d}</div>`;

  /* ---- 错题展示 ---- */
  $('resWrong').innerHTML = wrongListHTML(wrong);
  $('wrongTitleCount').textContent = wrong.length ? `（${wrong.length} 题）` : '（无）';

  const swBtn = $('btnShowWrong');
  if(wrong.length){
    swBtn.disabled = false;
    swBtn.textContent = `❌ 查看错题 (${wrong.length})`;
  }else{
    swBtn.disabled = true;
    swBtn.textContent = '✅ 本次全对';
  }
}

function getAdvice(acc){
  if(acc >= 95) return {t:'🌟 完美表现！',
    d:'这些核心词汇你已经掌握得非常牢固。可以尝试用它们各写一个英文句子，把“认识”升级为“会用”。'};
  if(acc >= 85) return {t:'🎉 非常出色！',
    d:'绝大部分单词都写对了，基础很扎实。把错题抄写 2～3 遍并大声朗读，就能做到零失误。'};
  if(acc >= 70) return {t:'👍 表现不错！',
    d:'大部分词汇已经掌握，个别长词（如 increasingly、management、unemployment）容易拼错，建议按音节拆分记忆。'};
  if(acc >= 60) return {t:'💪 基础尚可，需要巩固',
    d:'有近半数的单词存在拼写错误。建议把错题整理成小卡片，利用碎片时间反复默写，重点区分 economic / economical 这类形近词。'};
  return {t:'📚 需要加把劲啦',
    d:'目前正确率偏低。建议先对照词库把每个词的音标读准，再按“音节拆分法”背单词，每天复习 2 次，三天后再来测试。'};
}

function animateNumber(el, target, suffix){
  suffix = suffix || '';
  const dur = 900, start = performance.now();
  function step(t){
    const p = Math.min((t - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased) + suffix;
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = target + suffix;
  }
  requestAnimationFrame(step);
}

/* =========================================================
   8. 错题列表 HTML
   ========================================================= */
function wrongListHTML(list){
  if(!list.length) return '<div class="all-right">🎊 全部正确，太厉害了！</div>';
  return list.map(q => `
    <div class="wrong-item">
      <div class="wi-top">
        <span class="wi-word">${esc(q.w)}</span>
        <span class="wi-phon">${esc(q.phon)}</span>
      </div>
      <div class="wi-cn"><span class="tag">${esc(q.pos)}</span>${esc(q.cn)}</div>
      <div class="wi-your">你的答案：<span class="bad">${q.ua ? esc(q.ua) : '（未作答）'}</span></div>
    </div>`).join('');
}

/* =========================================================
   9. 弹窗
   ========================================================= */
function openModal(title, html){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = html;
  $('modalMask').classList.add('show');
  $('modalBody').scrollTop = 0;
}
function closeModal(){ $('modalMask').classList.remove('show'); }

function showBank(){
  const html = '<div class="bank-grid">' + WORDS.map(w => `
    <div class="bank-item">
      <div class="bi-word">${esc(w.w)}</div>
      <div class="bi-phon">${esc(w.phon)}</div>
      <div class="bi-cn"><span class="tag sm">${esc(w.pos)}</span>${esc(w.cn)}</div>
    </div>`).join('') + '</div>';
  openModal(`📖 词库 · 共 ${WORDS.length} 词`, html);
}

function showHistory(){
  const recs = getRecords();
  if(!recs.length){
    openModal('🏆 历史分数', '<div class="empty-tip">还没有任何记录，快去完成一次听写吧！</div>');
    return;
  }
  const best = Math.max.apply(null, recs.map(r => r.correct));
  const html = '<div class="hist-list">' + recs.map((r, i) => {
    const d = new Date(r.time);
    const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const isBest = (r.correct === best);
    return `<div class="hist-item ${isBest ? 'best' : ''}">
      <div class="hi-left">
        <span class="hi-rank">${i === 0 ? '最新' : '#' + (i+1)}</span>
        <span class="hi-time">${ds}</span>
      </div>
      <div class="hi-right">
        <span class="hi-score">${r.correct}<i>/${r.total}</i></span>
        <span class="hi-acc">${r.acc}%</span>
        ${isBest ? '<span class="hi-best">最高</span>' : ''}
      </div>
    </div>`;
  }).join('') + '</div>';
  openModal('🏆 历史分数（最高 ' + best + ' 分）', html);
}

function showWrongModal(){
  if(!lastWrong.length){
    openModal('❌ 错题回顾', '<div class="empty-tip">本次没有错题，太棒了！</div>');
    return;
  }
  openModal(`❌ 错题回顾（${lastWrong.length} 题）`,
    '<div class="wrong-list">' + wrongListHTML(lastWrong) + '</div>');
}

/* =========================================================
   10. 事件绑定
   ========================================================= */
$('btnStart').addEventListener('click', newQuiz);
$('btnAgain').addEventListener('click', newQuiz);

$('btnReshuffle').addEventListener('click', function(){
  if(quiz.length && !submitted && quiz.some(q => q.ans.trim() !== '')){
    if(!confirm('重新随机会清空当前已填写的内容，确定吗？')) return;
  }
  newQuiz();
});

$('prevBtn').addEventListener('click', function(){
  if(cur > 0){ cur--; renderQuestion(); }
});

$('nextBtn').addEventListener('click', function(){
  if(cur < quiz.length - 1){ cur++; renderQuestion(); }
});

$('submitBtn').addEventListener('click', doSubmit);

input.addEventListener('input', function(){
  if(!quiz.length || submitted) return;
  quiz[cur].ans = input.value;
  updateAnswered();
});

input.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    if(cur < quiz.length - 1){
      cur++;
      renderQuestion();
    }else{
      doSubmit();
    }
  }
});

$('btnBank').addEventListener('click', showBank);
$('btnBank2').addEventListener('click', showBank);
$('btnHistory').addEventListener('click', showHistory);
$('btnHistory2').addEventListener('click', showHistory);
$('btnShowWrong').addEventListener('click', showWrongModal);

$('modalClose').addEventListener('click', closeModal);
$('modalMask').addEventListener('click', function(e){
  if(e.target === $('modalMask')) closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});

/* =========================================================
   11. 背景装饰
   ========================================================= */
(function decorate(){
  const deco = $('bgDeco');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const colors = ['#6366f1','#06b6d4','#f59e0b','#f43f5e','#10b981','#8b5cf6'];
  for(let i = 0; i < 14; i++){
    const s = document.createElement('span');
    s.textContent = letters[Math.floor(Math.random() * 26)];
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.fontSize = (24 + Math.random() * 60) + 'px';
    s.style.color = colors[i % colors.length];
    s.style.animationDuration = (14 + Math.random() * 16) + 's';
    s.style.animationDelay = (-Math.random() * 25) + 's';
    deco.appendChild(s);
  }
})();

})();
