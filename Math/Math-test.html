<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 数学测试 · 合集</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #f7f9fc 0%, #e8edf5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            color: #1a2639;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 数学风格背景装饰 ===== */
        body::before {
            content: '∫ ∮ ∂ ∑ ∏ √ ∞ π θ Δ φ ψ Ω α β γ';
            position: fixed;
            top: -8%;
            right: -4%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 22vw;
            color: rgba(41, 98, 255, 0.04);
            pointer-events: none;
            transform: rotate(8deg);
            letter-spacing: 24px;
            white-space: nowrap;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -15%;
            left: -8%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* 坐标网格装饰 */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(41, 98, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(41, 98, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1a2a6c 0%, #2962ff 45%, #d4af37 75%, #f5d77b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: none;
            position: relative;
            display: inline-block;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #2962ff, #d4af37, transparent);
            border-radius: 4px;
        }

        .header p {
            font-size: 1.1rem;
            color: rgba(26, 38, 57, 0.45);
            letter-spacing: 5px;
            margin-top: 14px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .header p span {
            color: #2962ff;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ===== 卡片网格 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(41, 98, 255, 0.10);
            border-radius: 28px;
            padding: 36px 28px 32px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow:
                0 4px 20px rgba(26, 38, 57, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: radial-gradient(circle at 30% 40%, rgba(212, 175, 55, 0.05), transparent 60%);
            pointer-events: none;
            transition: 0.6s;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #2962ff, #d4af37, transparent);
            opacity: 0;
            transition: 0.4s;
            border-radius: 28px 28px 0 0;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(41, 98, 255, 0.20);
            box-shadow:
                0 20px 60px rgba(41, 98, 255, 0.06),
                0 8px 24px rgba(26, 38, 57, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.88);
        }

        .card:hover::after {
            opacity: 1;
        }

        .card:hover::before {
            transform: scale(1.3);
        }

        /* 卡片图标 */
        .card .icon {
            font-size: 3.8rem;
            margin-bottom: 14px;
            display: inline-block;
            filter: drop-shadow(0 2px 8px rgba(41, 98, 255, 0.06));
            transition: 0.3s;
        }

        .card:hover .icon {
            transform: scale(1.04) rotate(-2deg);
        }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #1a2639;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .card .badge {
            display: inline-block;
            background: rgba(41, 98, 255, 0.06);
            border: 1px solid rgba(41, 98, 255, 0.10);
            border-radius: 40px;
            padding: 4px 18px;
            font-size: 0.72rem;
            color: #2962ff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .card .desc {
            font-size: 0.95rem;
            color: rgba(26, 38, 57, 0.55);
            line-height: 1.7;
            font-weight: 400;
        }

        .card .desc strong {
            color: #1a2639;
            font-weight: 600;
        }

        .card .enter-btn {
            margin-top: 20px;
            padding: 10px 34px;
            border-radius: 50px;
            background: linear-gradient(135deg, #1a2a6c, #2962ff);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border: none;
            transition: all 0.35s ease;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(41, 98, 255, 0.12);
            display: inline-block;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .card .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transition: 0.5s;
        }

        .card:hover .enter-btn {
            background: linear-gradient(135deg, #2962ff, #1a2a6c);
            box-shadow: 0 8px 32px rgba(41, 98, 255, 0.22);
            transform: scale(1.04);
        }

        .card:hover .enter-btn::before {
            left: 100%;
        }

        /* ===== 底部装饰 ===== */
        .container::after {
            content: '✧ 高等数学 · 精选习题 ✧';
            display: block;
            margin-top: 60px;
            padding-top: 28px;
            border-top: 1px solid rgba(41, 98, 255, 0.06);
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: rgba(26, 38, 57, 0.20);
            letter-spacing: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .header h1 {
                font-size: 2.6rem;
            }
            .header h1::after {
                width: 50px;
            }
            .card-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .card {
                padding: 28px 20px;
            }
            body::before {
                font-size: 36vw;
                top: -4%;
                right: -6%;
                letter-spacing: 16px;
            }
            .container::after {
                font-size: 0.65rem;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }
            .header p {
                font-size: 0.85rem;
                letter-spacing: 2px;
            }
            .card .icon {
                font-size: 3rem;
            }
            .card h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- 网格背景 -->
    <div class="grid-bg"></div>

    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>✦ 数学测试 ✦</h1>
            <p>— <span>一</span> 套精选 · 一键挑战 —</p>
        </header>

        <!-- 卡片网格 -->
        <div class="card-grid">
            <!-- 卡片一 -->
            <a href="Math-test-one.html" class="card" target="_blank">

            <!-- 卡片一 -->
            <a href="Math-test-two.html" class="card" target="_blank">

                <div class="badge">300道题 · 随机 30</div>
                <div class="desc">
                    <strong>高数专项</strong><br />
                    导数 · 微分
                </div>
                <span class="enter-btn">🚀 进入练习</span>
            </a>
            <!-- 卡片一 -->
            <a href="Math-test-three.html" class="card" target="_blank">
                <div class="icon">📕</div>
                <h2>微分定理和导数的应用</h2>
                <div class="badge">300道题 · 随机 30</div>
                <div class="desc">
                    <strong>高数专项</strong><br />
                    微分定理 · 导数的应用
                </div>
                <span class="enter-btn">🚀 进入练习</span>
            </a>
            <!-- 卡片一 -->
            <a href="Math-test-four（一）.html" class="card" target="_blank">
                <div class="icon">📕</div>
                <h2>不定积分</h2>
                <div class="badge">300道题 · 随机 30</div>
                <div class="desc">
                    <strong>高数专项</strong><br />
                    不定积分
                </div>
                <span class="enter-btn">🚀 进入练习</span>
                <!-- 卡片一 -->
            <a href="Math-test-four（二）.html" class="card" target="_blank">
                <div class="icon">📕</div>
                <h2>不定积分</h2>
                <div class="badge">300道题 · 随机 30</div>
                <div class="desc">
                    <strong>高数专项</strong><br />

                </div>
                <span class="enter-btn">🚀 进入练习</span>
        </div>
    </div>
</body>
</html>
