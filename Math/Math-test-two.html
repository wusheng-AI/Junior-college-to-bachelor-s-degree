            { id: 66, c: "可导的条件", q: "函数 $f(x)=x^{\\frac{2}{3}}$ 在 $x=0$ 处（ ）", o: ["A. 可导", "B. 不可导", "C. 连续且可导", "D. 不连续"], a: "B", e: "$f'(x)=\\frac{2}{3}x^{-\\frac{1}{3}}$，在 $x=0$ 处无定义，故不可导。" },
            { id: 67, c: "可导的条件", q: "函数 $f(x)= \\begin{cases} x^2, & x \\ge 0 \\\\ -x^2, & x < 0 \\end{cases}$ 在 $x=0$ 处（ ）", o: ["A. 可导", "B. 不可导", "C. 不连续", "D. 无定义"], a: "A", e: "左导数 $=\\lim_{x \\to 0^-} \\frac{-x^2-0}{x}=0$，右导数 $=\\lim_{x \\to 0^+} \\frac{x^2-0}{x}=0$，左右导数相等，可导。" },
            { id: 68, c: "可导的条件", q: "若函数f(x)在x₀处可导，则f(x)在x₀处（ ）", o: ["A. 一定有极限", "B. 一定无极限", "C. 极限不存在", "D. 无法确定"], a: "A", e: "可导必连续，连续必有极限。" },
            { id: 69, c: "可导的条件", q: "函数 $f(x)= \\begin{cases} x, & x \\le 1 \\\\ 2x-1, & x > 1 \\end{cases}$ 在 $x=1$ 处（ ）", o: ["A. 可导", "B. 不可导", "C. 不连续", "D. 无定义"], a: "A", e: "左导数 $=\\lim_{x \\to 1^-} \\frac{x-1}{x-1}=1$，右导数 $=\\lim_{x \\to 1^+} \\frac{(2x-1)-1}{x-1}=2$，左右导数相等，可导。" },

            { id: 106, c: "复合函数求导", q: "设 $y=\\sin(3x+\\frac{\\pi}{4})$，则 $y'$ = （ ）", o: ["A. $3\\cos(3x+\\frac{\\pi}{4})$", "B. $\\cos(3x+\\frac{\\pi}{4})$", "C. $-3\\cos(3x+\\frac{\\pi}{4})$", "D. $3\\sin(3x+\\frac{\\pi}{4})$"], a: "A", e: "$y'=\\cos(3x+\\frac{\\pi}{4}) \\cdot 3 = 3\\cos(3x+\\frac{\\pi}{4})$。" },
            { id: 107, c: "复合函数求导", q: "设 $y=e^{-x^2}$，则 $y'$ = （ ）", o: ["A. $-2xe^{-x^2}$", "B. $2xe^{-x^2}$", "C. $-e^{-x^2}$", "D. $-2x^2e^{-x^2}$"], a: "A", e: "$y'=e^{-x^2} \\cdot (-2x) = -2xe^{-x^2}$。" },
            { id: 108, c: "复合函数求导", q: "设 $y=\\ln(1+x^2)$，则 $y'$ = （ ）", o: ["A. $\\frac{2x}{1+x^2}$", "B. $\\frac{1}{1+x^2}$", "C. $\\frac{2x}{(1+x^2)^2}$", "D. $\\frac{x}{1+x^2}$"], a: "A", e: "$y'=\\frac{1}{1+x^2} \\cdot 2x = \\frac{2x}{1+x^2}$。" },
            { id: 109, c: "复合函数求导", q: "设 $y=(\\sin x+\\cos x)^2$，则 $y'$ = （ ）", o: ["A. $2(\\sin x+\\cos x)(\\cos x-\\sin x)$", "B. $2(\\cos x-\\sin x)$", "C. $2(\\sin x+\\cos x)$", "D. $(\\sin x+\\cos x)(\\cos x-\\sin x)$"], a: "A", e: "$y'=2(\\sin x+\\cos x)(\\cos x-\\sin x)$。" },
            { id: 110, c: "复合函数求导", q: "设 $y=f(g(x))$，其中 $f$ 和 $g$ 均可导，则 $y'$ = （ ）", o: ["A. $f'(x)g'(x)$", "B. $f'(g(x)) \\cdot g'(x)$", "C. $f'(g(x))$", "D. $g'(f(x)) \\cdot f'(x)$"], a: "B", e: "复合函数链式求导法则：$y'=f'(g(x)) \\cdot g'(x)$。" },
            // 五、隐函数求导 (111-135)
            { id: 111, c: "隐函数求导", q: "由方程 $x^2+y^2=1$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{x}{y}$", "B. $\\frac{x}{y}$", "C. $-\\frac{y}{x}$", "D. $\\frac{y}{x}$"], a: "A", e: "两边对 $x$ 求导：$2x+2yy'=0$，$y'=-\\frac{x}{y}$。" },
            { id: 112, c: "隐函数求导", q: "由方程 $x^2+y^2=4$ 确定的隐函数在点 $(\\sqrt{2},\\sqrt{2})$ 处的导数 $y'$ = （ ）", o: ["A. $-1$", "B. $1$", "C. $0$", "D. 不存在"], a: "A", e: "$y'=-\\frac{x}{y}=-\\frac{\\sqrt{2}}{\\sqrt{2}}=-1$。" },
            { id: 113, c: "隐函数求导", q: "由方程 $e^y+xy=1$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{y}{e^y+x}$", "B. $-\\frac{x}{e^y+y}$", "C. $-\\frac{y}{e^y}$", "D. $-\\frac{x}{e^y}$"], a: "A", e: "两边对 $x$ 求导：$e^y \\cdot y' + y + xy'=0$，$y'=-\\frac{y}{e^y+x}$。" },
            { id: 114, c: "隐函数求导", q: "由方程 $x^3+y^3=3xy$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{y-x^2}{y^2-x}$", "B. $\\frac{x^2-y}{y^2-x}$", "C. $\\frac{y^2-x}{x^2-y}$", "D. $\\frac{x^2+y}{y^2-x}$"], a: "A", e: "两边对 $x$ 求导：$3x^2+3y^2y'=3y+3xy'$，$y'=\\frac{y-x^2}{y^2-x}$。" },
            { id: 115, c: "隐函数求导", q: "由方程 $x^2+xy+y^2=3$ 确定的隐函数在点 $(1,1)$ 处的导数 $y'$ = （ ）", o: ["A. $-1$", "B. $1$", "C. $0$", "D. $-2$"], a: "A", e: "$2x+y+xy'+2yy'=0$，代入 $(1,1)$：$2+1+y'+2y'=0$，$3y'=-3$，$y'=-1$。" },
            { id: 116, c: "隐函数求导", q: "由方程 $\\sin y + x^2=0$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{2x}{\\cos y}$", "B. $\\frac{2x}{\\cos y}$", "C. $-\\frac{\\cos y}{2x}$", "D. $\\frac{\\cos y}{2x}$"], a: "A", e: "$\\cos y \\cdot y' + 2x=0$，$y'=-\\frac{2x}{\\cos y}$。" },
            { id: 117, c: "隐函数求导", q: "由方程 $xy=\\ln y$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{y^2}{1-xy}$", "B. $\\frac{y}{1-xy}$", "C. $\\frac{y^2}{xy-1}$", "D. $-\\frac{y^2}{1-xy}$"], a: "A", e: "$y+xy'=\\frac{y'}{y}$，$y=y'(\\frac{1}{y}-x)$，$y'=\\frac{y}{\\frac{1}{y}-x}=\\frac{y^2}{1-xy}$。" },
            { id: 118, c: "隐函数求导", q: "由方程 $x^2+y^2=e^{xy}$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{2x-y e^{xy}}{x e^{xy}-2y}$", "B. $\\frac{2x+y e^{xy}}{x e^{xy}+2y}$", "C. $\\frac{2x-y e^{xy}}{2y-x e^{xy}}$", "D. $\\frac{2x+y e^{xy}}{2y+x e^{xy}}$"], a: "A", e: "$2x+2yy'=e^{xy}(y+xy')$，$2x-y e^{xy}=x e^{xy}y'-2yy'$，$y'=\\frac{2x-y e^{xy}}{x e^{xy}-2y}$。" },
            { id: 119, c: "隐函数求导", q: "由方程 $y=\\cos(x+y)$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{\\sin(x+y)}{1+\\sin(x+y)}$", "B. $\\frac{\\sin(x+y)}{1+\\sin(x+y)}$", "C. $-\\frac{\\sin(x+y)}{1-\\sin(x+y)}$", "D. $\\frac{\\sin(x+y)}{1-\\sin(x+y)}$"], a: "A", e: "$y'=-\\sin(x+y)(1+y')$，$y'[1+\\sin(x+y)]=-\\sin(x+y)$，$y'=-\\frac{\\sin(x+y)}{1+\\sin(x+y)}$。" },
            { id: 120, c: "隐函数求导", q: "由方程 $x^2-y^2=1$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{x}{y}$", "B. $-\\frac{x}{y}$", "C. $\\frac{y}{x}$", "D. $-\\frac{y}{x}$"], a: "A", e: "$2x-2yy'=0$，$y'=\\frac{x}{y}$。" },
            { id: 121, c: "隐函数求导", q: "由方程 $x^3+y^3=1$ 确定的隐函数在点 $(0,1)$ 处的导数 $y'$ = （ ）", o: ["A. $0$", "B. $1$", "C. $-1$", "D. 不存在"], a: "A", e: "$3x^2+3y^2y'=0$，$y'=-\\frac{x^2}{y^2}$，在 $(0,1)$ 处 $y'=0$。" },
            { id: 122, c: "隐函数求导", q: "由方程 $xy+e^x=e^y$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{e^x+y}{e^y-x}$", "B. $\\frac{e^x-y}{e^y+x}$", "C. $\\frac{y-e^x}{e^y-x}$", "D. $\\frac{e^x+y}{x-e^y}$"], a: "A", e: "$y+xy'+e^x=e^y y'$，$y'=\\frac{e^x+y}{e^y-x}$。" },
            { id: 123, c: "隐函数求导", q: "由方程 $y^2=4x$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{2}{y}$", "B. $-\\frac{2}{y}$", "C. $\\frac{y}{2}$", "D. $-\\frac{y}{2}$"], a: "A", e: "$2yy'=4$，$y'=\\frac{2}{y}$。" },
            { id: 124, c: "隐函数求导", q: "由方程 $x^2+2xy-y^2=0$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{x+y}{y-x}$", "B. $\\frac{x-y}{y+x}$", "C. $\\frac{x+y}{x-y}$", "D. $\\frac{x-y}{x+y}$"], a: "A", e: "$2x+2y+2xy'-2yy'=0$，$2(x+y)+2y'(x-y)=0$，$y'=\\frac{x+y}{y-x}$。" },
            { id: 125, c: "隐函数求导", q: "由方程 $\\cos(xy)=x$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{1+y\\sin(xy)}{x\\sin(xy)}$", "B. $\\frac{1+y\\sin(xy)}{x\\sin(xy)}$", "C. $-\\frac{1-y\\sin(xy)}{x\\sin(xy)}$", "D. $\\frac{1-y\\sin(xy)}{x\\sin(xy)}$"], a: "A", e: "$-\\sin(xy)(y+xy')=1$，$y+xy'=-\\frac{1}{\\sin(xy)}$，$y'=-\\frac{1+y\\sin(xy)}{x\\sin(xy)}$。" },
            { id: 126, c: "隐函数求导", q: "由方程 $\\ln y+xy=0$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{y^2}{1+xy}$", "B. $\\frac{y^2}{1+xy}$", "C. $-\\frac{y}{1+xy}$", "D. $\\frac{y}{1+xy}$"], a: "A", e: "$\\frac{y'}{y}+y+xy'=0$，$y'(\\frac{1}{y}+x)=-y$，$y'=-\\frac{y^2}{1+xy}$。" },
            { id: 127, c: "隐函数求导", q: "由方程 $x^2+y^2=a^2$（$a>0$）确定的隐函数在点 $(\\frac{a}{\\sqrt{2}},\\frac{a}{\\sqrt{2}})$ 处的导数 $y'$ = （ ）", o: ["A. $-1$", "B. $1$", "C. $0$", "D. 不存在"], a: "A", e: "$y'=-\\frac{x}{y}=-1$。" },
            { id: 128, c: "隐函数求导", q: "由方程 $e^{xy}+x^2=1$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{2x+y e^{xy}}{x e^{xy}}$", "B. $\\frac{2x+y e^{xy}}{x e^{xy}}$", "C. $-\\frac{2x-y e^{xy}}{x e^{xy}}$", "D. $\\frac{2x-y e^{xy}}{x e^{xy}}$"], a: "A", e: "$e^{xy}(y+xy')+2x=0$，$y'=-\\frac{2x+y e^{xy}}{x e^{xy}}$。" },
            { id: 129, c: "隐函数求导", q: "由方程 $\\tan y=x$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\cos^2 y$", "B. $\\frac{1}{\\cos^2 y}$", "C. $-\\cos^2 y$", "D. $\\sec^2 y$"], a: "A", e: "$\\sec^2 y \\cdot y'=1$，$y'=\\cos^2 y$。" },
            { id: 130, c: "隐函数求导", q: "由方程 $y=x+\\ln y$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{y}{y-1}$", "B. $\\frac{y-1}{y}$", "C. $\\frac{y}{y+1}$", "D. $\\frac{y+1}{y}$"], a: "A", e: "$y'=1+\\frac{y'}{y}$，$y'(1-\\frac{1}{y})=1$，$y'=\\frac{y}{y-1}$。" },
            { id: 131, c: "隐函数求导", q: "由方程 $x^2y+xy^2=1$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{2xy+y^2}{x^2+2xy}$", "B. $\\frac{2xy+y^2}{x^2+2xy}$", "C. $-\\frac{x^2+2xy}{2xy+y^2}$", "D. $\\frac{x^2+2xy}{2xy+y^2}$"], a: "A", e: "$2xy+x^2y'+y^2+2xyy'=0$，$y'[x^2+2xy]=-(2xy+y^2)$，$y'=-\\frac{2xy+y^2}{x^2+2xy}$。" },
            { id: 132, c: "隐函数求导", q: "由方程 $y=\\sin(x+y)$ 确定的隐函数 $y=y(x)$ 在点 $(0,0)$ 处的导数 $y'$ = （ ）", o: ["A. $1$", "B. $-1$", "C. $0$", "D. 不存在"], a: "D", e: "$y'=\\cos(x+y)(1+y')$，代入 $(0,0)$：$y'=1(1+y')$，$0=1$，矛盾！实际 $y'$ 不存在。" },
            { id: 133, c: "隐函数求导", q: "由方程 $x^2+xy+y^2=1$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $-\\frac{2x+y}{x+2y}$", "B. $\\frac{2x+y}{x+2y}$", "C. $-\\frac{x+2y}{2x+y}$", "D. $\\frac{x+2y}{2x+y}$"], a: "A", e: "$2x+y+xy'+2yy'=0$，$y'(x+2y)=-(2x+y)$，$y'=-\\frac{2x+y}{x+2y}$。" },
            { id: 134, c: "隐函数求导", q: "由方程 $x^2-y^2=4$ 确定的隐函数 $y=y(x)$ 在点 $(2,0)$ 处的导数（ ）", o: ["A. 不存在", "B. $0$", "C. $1$", "D. $-1$"], a: "A", e: "$y'=\\frac{x}{y}$，在 $(2,0)$ 处分母为 $0$，导数不存在。" },
            { id: 135, c: "隐函数求导", q: "由方程 $y=x^2+\\sin y$ 确定的隐函数 $y=y(x)$ 的导数 $y'$ = （ ）", o: ["A. $\\frac{2x}{1-\\cos y}$", "B. $\\frac{2x}{1+\\cos y}$", "C. $\\frac{1-\\cos y}{2x}$", "D. $\\frac{1+\\cos y}{2x}$"], a: "A", e: "$y'=2x+\\cos y \\cdot y'$，$y'(1-\\cos y)=2x$，$y'=\\frac{2x}{1-\\cos y}$。" },
            // 六、参数函数的求导 (136-160)
            { id: 136, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=t^2 \\\\ y=t^3 \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $\\frac{3t}{2}$", "B. $\\frac{2t}{3}$", "C. $\\frac{3t^2}{2t}$", "D. $\\frac{2}{3t}$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{dy/dt}{dx/dt} = \\frac{3t^2}{2t} = \\frac{3t}{2}$。" },
            { id: 137, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=\\sin t \\\\ y=\\cos t \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $-\\tan t$", "B. $-\\cot t$", "C. $\\tan t$", "D. $\\cot t$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{-\\sin t}{\\cos t} = -\\tan t$。" },
            { id: 138, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=t \\\\ y=t^2 \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $2t$", "B. $t$", "C. $2$", "D. $\\frac{1}{2t}$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{2t}{1} = 2t$。" },
            { id: 139, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=2t \\\\ y=t^2 \\end{cases}$，则 $\\frac{d^2y}{dx^2}$ = （ ）", o: ["A. $\\frac{1}{2}$", "B. $1$", "C. $2$", "D. $\\frac{1}{2t}$"], a: "A", e: "$\\frac{dy}{dx}=t$，$\\frac{d^2y}{dx^2}=\\frac{d/dt(dy/dx)}{dx/dt}=\\frac{1}{2}$。" },
            { id: 140, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=t^2 \\\\ y=t^4 \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $2t^2$", "B. $t^2$", "C. $4t^2$", "D. $2t$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{4t^3}{2t} = 2t^2$。" },
            { id: 141, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=e^t \\\\ y=t^2 \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $\\frac{2t}{e^t}$", "B. $\\frac{e^t}{2t}$", "C. $2te^t$", "D. $\\frac{2}{e^t}$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{2t}{e^t}$。" },
            { id: 142, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=3t^2 \\\\ y=2t^3 \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $t$", "B. $2t$", "C. $3t$", "D. $\\frac{t}{2}$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{6t^2}{6t} = t$。" },
            { id: 143, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=\\cos t \\\\ y=\\sin t \\end{cases}$，则 $\\frac{dy}{dx}$ 在 $t=\\frac{\\pi}{4}$ 处的值为（ ）", o: ["A. $-1$", "B. $1$", "C. $0$", "D. 不存在"], a: "A", e: "$\\frac{dy}{dx} = \\frac{\\cos t}{-\\sin t} = -\\cot t$，在 $t=\\frac{\\pi}{4}$ 处为 $-1$。" },
            { id: 144, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=t^3 \\\\ y=t^2 \\end{cases}$，则 $\\frac{d^2y}{dx^2}$ = （ ）", o: ["A. $-\\frac{2}{9t^4}$", "B. $\\frac{2}{9t^4}$", "C. $-\\frac{2}{3t^4}$", "D. $\\frac{2}{3t^4}$"], a: "A", e: "$\\frac{dy}{dx}=\\frac{2t}{3t^2}=\\frac{2}{3t}$，$\\frac{d^2y}{dx^2}=\\frac{-2/(3t^2)}{3t^2}=-\\frac{2}{9t^4}$。" },
            { id: 145, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=t+1 \\\\ y=t^2-1 \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $2t$", "B. $2(t-1)$", "C. $2(t+1)$", "D. $t$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{2t}{1} = 2t$。" },
            { id: 146, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=\\ln t \\\\ y=t \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $t$", "B. $\\frac{1}{t}$", "C. $t^2$", "D. $1$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{1}{1/t} = t$。" },
            { id: 147, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=a\\cos t \\\\ y=b\\sin t \\end{cases}$（$a,b>0$），则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $-\\frac{b}{a}\\cot t$", "B. $-\\frac{a}{b}\\cot t$", "C. $\\frac{b}{a}\\tan t$", "D. $-\\frac{b}{a}\\tan t$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{b\\cos t}{-a\\sin t} = -\\frac{b}{a}\\cot t$。" },
            { id: 148, c: "参数函数的求导", q: "设参数方程 $\\begin{cases} x=t-\\sin t \\\\ y=1-\\cos t \\end{cases}$，则 $\\frac{dy}{dx}$ = （ ）", o: ["A. $\\frac{\\sin t}{1-\\cos t}$", "B. $\\frac{1-\\cos t}{\\sin t}$", "C. $\\frac{\\sin t}{1+\\cos t}$", "D. $\\frac{1+\\cos t}{\\sin t}$"], a: "A", e: "$\\frac{dy}{dx} = \\frac{\\sin t}{1-\\cos t}$。" },

    <script>
        (function() {
            'use strict';
            const TOTAL = 30;

            let selectedOption = null;
            let userAnswers = [];
            let historyScore = localStorage.getItem('mathHistoryScore') ? parseInt(localStorage.getItem(
                'mathHistoryScore')) : null;
            let submitted = false;

            const qId = document.getElementById('qId');
            const qText = document.getElementById('qText');
            const optionsContainer = document.getElementById('optionsContainer');
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');
            const submitBtn = document.getElementById('submitBtn');
            const reshuffleBtn = document.getElementById('reshuffleBtn');
            const bankToggleBtn = document.getElementById('bankToggleBtn');
            const bankCloseBtn = document.getElementById('bankCloseBtn');
            const bankPanel = document.getElementById('bankPanel');
            const bankList = document.getElementById('bankList');
            const bankSearch = document.getElementById('bankSearch');
            const bankCount = document.getElementById('bankCount');
            const warningMsg = document.getElementById('warningMsg');
            const progressText = document.getElementById('progressText');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const progressBar = document.getElementById('progressBar');
            const mainCard = document.getElementById('mainCard');
            const resultPanel = document.getElementById('resultPanel');
            const resultScore = document.getElementById('resultScore');
            const resultPercent = document.getElementById('resultPercent');
            const historyCompare = document.getElementById('historyCompare');
            const historyDiff = document.getElementById('historyDiff');
            const rCorrect = document.getElementById('rCorrect');
            const rWrong = document.getElementById('rWrong');
            const rTotal = document.getElementById('rTotal');
            const rCategories = document.getElementById('rCategories');
            const errorList = document.getElementById('errorList');
            const retryBtn = document.getElementById('retryBtn');
            const resultBankBtn = document.getElementById('resultBankBtn');

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function pickRandom(n) {
                return shuffleArray(allQuestions.slice()).slice(0, n);
            }

            function resetState() {
                currentRound = pickRandom(TOTAL);
                currentIndex = 0;
                userAnswers = [];
                selectedOption = null;
                submitted = false;
                warningMsg.classList.remove('show');
                resultPanel.classList.remove('show');
                bankPanel.classList.remove('show');
                mainCard.style.display = 'block';
                renderQuestion();
            }

            function renderQuestion() {
                if (submitted) return;
                if (!currentRound.length || currentIndex >= currentRound.length) {
                    submitAll();
                    return;
                }
                const q = currentRound[currentIndex];
                qCategory.textContent = q.c || '未分类';
                qId.textContent = '#' + (q.id || (currentIndex + 1));
                qText.innerHTML = q.q;
                optionsContainer.innerHTML = '';
                const letters = ['A', 'B', 'C', 'D'];
                q.o.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.dataset.value = letters[idx];
                    btn.innerHTML = '<span class="letter">' + letters[idx] + '</span><span>' + opt
                        .replace(/^[A-D]\.\s*/, '') + '</span>';
                    btn.addEventListener('click', () => onOptionClick(btn, letters[idx]));
                    optionsContainer.appendChild(btn);
                });
                const saved = userAnswers.find(a => a.index === currentIndex);
                selectedOption = saved ? saved.answer : null;
                if (selectedOption) {
                    document.querySelectorAll('.option-btn').forEach(b => {
                        if (b.dataset.value === selectedOption) b.classList.add('selected');
                    });
                }
                warningMsg.classList.remove('show');
                const total = currentRound.length;
                const done = userAnswers.length;
                progressText.textContent = (currentIndex + 1) + ' / ' + total;
                scoreDisplay.textContent = '📝 ' + done;
                progressBar.style.width = Math.min(((currentIndex + 1) / total) * 100, 100) + '%';
                setTimeout(() => {
                    if (window.renderMathInElement) {
                        try {
                            window.renderMathInElement(document.getElementById('questionCard'), {
                                delimiters: [{ left: '$$', right: '$$', display: true },
                                    { left: '$', right: '$', display: false },
                                    { left: '\\(', right: '\\)', display: false },
                                    { left: '\\[', right: '\\]', display: true }
                                ],
                                throwOnError: false
                            });
                        } catch (e) {}
                    }
                }, 80);
            }

            function onOptionClick(btn, letter) {
                if (submitted || resultPanel.classList.contains('show')) return;
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedOption = letter;
                warningMsg.classList.remove('show');
                const existingIndex = userAnswers.findIndex(a => a.index === currentIndex);
                if (existingIndex !== -1) {
                    userAnswers[existingIndex].answer = letter;
                } else {
                    userAnswers.push({ index: currentIndex, answer: letter });
                }
                scoreDisplay.textContent = '📝 ' + userAnswers.length;
            }

            function handleNext() {
                if (submitted || resultPanel.classList.contains('show')) return;
                const existing = userAnswers.find(a => a.index === currentIndex);
                if (!existing) {
                    warningMsg.textContent = '⚠️ 请先选择一个选项';
                    warningMsg.classList.add('show');
                    return;
                }
                warningMsg.classList.remove('show');
                currentIndex++;
                if (currentIndex >= currentRound.length) {
                    submitAll();
                } else {
                    renderQuestion();
                }
            }

            function submitAll() {
                if (submitted) return;
                const unanswered = [];
                for (let i = 0; i < currentRound.length; i++) {
                    if (!userAnswers.some(a => a.index === i)) unanswered.push(i);
                }
                if (unanswered.length > 0) {
                    warningMsg.textContent = '⚠️ 还有 ' + unanswered.length + ' 题未作答，请完成后提交！';
                    warningMsg.classList.add('show');
                    currentIndex = unanswered[0];
                    renderQuestion();
                    return;
                }
                submitted = true;
                mainCard.style.display = 'none';
                resultPanel.classList.add('show');
                const total = currentRound.length;
                let correct = 0;
                let wrong = 0;
                const errors = [];
                for (let i = 0; i < total; i++) {
                    const q = currentRound[i];
                    const found = userAnswers.find(a => a.index === i);
                    const userAns = found ? found.answer : null;
                    const isCorrect = (userAns === q.a);
                    if (isCorrect) correct++;
                    else wrong++;
                    if (!isCorrect) {
                        errors.push({ id: q.id, question: q.q, userAnswer: userAns || '未选择',
                            correctAnswer: q.a, explanation: q.e, category: q.c });
                    }
                }
                const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
                resultScore.innerHTML = correct + ' <small>/ ' + total + '</small>';
                resultPercent.textContent = pct + '%';
                rCorrect.textContent = correct;
                rWrong.textContent = wrong;
                rTotal.textContent = total;
                const cats = new Set(currentRound.map(q => q.c));
                rCategories.textContent = cats.size;
                if (errors.length === 0) {
                    errorList.innerHTML =
                        '<div style="text-align:center;padding:20px;color:#1a7a44;font-weight:500;">🎉 全部正确！太棒了！</div>';
                } else {
                    let html = '';
                    errors.forEach((e, idx) => {
                        html += '<div class="error-item"><div class="e-q"><strong>#' + (idx + 1) +
                            '</strong> ' + e.question + '</div><div class="e-detail">你的选择：<strong>' + e
                            .userAnswer + '</strong> ｜ 正确答案：<span class="correct-ans">' + e
                            .correctAnswer + '</span><br>📖 ' + e.explanation + '</div></div>';
                    });
                    errorList.innerHTML = html;
                }
                const currentScore = correct;
                let diffHtml = '';
                if (historyScore !== null) {
                    const diff = currentScore - historyScore;
                    if (diff > 0) diffHtml = '<span class="up">⬆ 上升了 ' + diff + ' 分</span>';
                    else if (diff < 0) diffHtml = '<span class="down">⬇ 下降了 ' + Math.abs(diff) + ' 分</span>';
                    else diffHtml = '<span class="same">➖ 与上次持平</span>';
                    diffHtml += ' (上次 ' + historyScore + ' 分)';
                } else {
                    diffHtml = '📌 首次练习，无历史记录';
                }
                historyDiff.innerHTML = diffHtml;
                localStorage.setItem('mathHistoryScore', String(currentScore));
                historyScore = currentScore;
                setTimeout(() => {
                    if (window.renderMathInElement) {
                        try {
                            window.renderMathInElement(document.getElementById('resultPanel'), {
                                delimiters: [{ left: '$$', right: '$$', display: true },
                                    { left: '$', right: '$', display: false },
                                    { left: '\\(', right: '\\)', display: false },
                                    { left: '\\[', right: '\\]', display: true }
                                ],
                                throwOnError: false
                            });
                        } catch (e) {}
                    }
                }, 150);
            }

            function renderBank(filter) {
                filter = filter || '';
                const filtered = filter.trim() === '' ? allQuestions : allQuestions.filter(q =>
                    q.q.toLowerCase().includes(filter.toLowerCase()) ||
                    (q.c || '').toLowerCase().includes(filter.toLowerCase()) ||
                    String(q.id).includes(filter)
                );
                bankCount.textContent = filtered.length + ' / ' + allQuestions.length + ' 题';
                let html = '';
                filtered.forEach(q => {
                    let optionsHtml = '';
                    const letters = ['A', 'B', 'C', 'D'];
                    q.o.forEach((opt, oi) => {
                        const isCorrect = (letters[oi] === q.a);
                        const cleanOpt = opt.replace(/^[A-D]\.\s*/, '');
                        optionsHtml += '<div class="b-opt' + (isCorrect ? ' b-opt-correct' : '') +
                            '"><span class="b-opt-letter' + (isCorrect ? ' correct' : '') + '">' +
                            letters[oi] + '</span><span class="b-opt-text">' + cleanOpt + '</span>' + (
                                isCorrect ? '<span class="b-opt-tag">✓ 正确答案</span>' : '') + '</div>';
                    });
                    html += '<div class="bank-item"><div class="b-item-top"><span class="b-id">#' + q.id +
                        '</span><span class="b-cat">' + (q.c || '未分类') +
                        '</span></div><div class="b-q">' + q.q + '</div><div class="b-opts">' +
                        optionsHtml + '</div><div class="b-exp">📖 ' + (q.e || '暂无解析') + '</div></div>';
                });
                bankList.innerHTML = html || '<div style="padding:30px;text-align:center;color:#6a8aaa;">没有匹配的题目</div>';
                setTimeout(() => {
                    if (window.renderMathInElement) {
                        try {
                            window.renderMathInElement(document.getElementById('bankList'), {
                                delimiters: [{ left: '$$', right: '$$', display: true },
                                    { left: '$', right: '$', display: false },
                                    { left: '\\(', right: '\\)', display: false },
                                    { left: '\\[', right: '\\]', display: true }
                                ],
                                throwOnError: false
                            });
                        } catch (e) {}
                    }
                }, 80);
            }

            prevBtn.addEventListener('click', function() {
                if (submitted) return;
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion();
                }
            });
            nextBtn.addEventListener('click', handleNext);
            submitBtn.addEventListener('click', submitAll);
            reshuffleBtn.addEventListener('click', function() {
                if (confirm('重新随机抽取30道题，当前进度将丢失，确定吗？')) resetState();
            });
            retryBtn.addEventListener('click', resetState);
            bankToggleBtn.addEventListener('click', function() {
                if (bankPanel.classList.contains('show')) { bankPanel.classList.remove('show'); } else {
                    bankPanel.classList.add('show');
                    renderBank(bankSearch.value);
                    resultPanel.classList.remove('show');
                    mainCard.style.display = 'block';
                }
            });
            bankCloseBtn.addEventListener('click', function() { bankPanel.classList.remove('show'); });
            resultBankBtn.addEventListener('click', function() {
                bankPanel.classList.add('show');
                renderBank(bankSearch.value);
                resultPanel.classList.remove('show');
                mainCard.style.display = 'block';
            });
            bankSearch.addEventListener('input', function() { renderBank(this.value); });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
                    const active = document.activeElement;
                    if (active && active.tagName === 'INPUT') return;
                    if (!submitted) nextBtn.click();
                }
                if (e.key === 'ArrowRight' && !e.ctrlKey && !e.metaKey) { if (!submitted) nextBtn
                    .click(); }
            });

            function init() {
                resetState();
                setTimeout(() => {
                    if (window.renderMathInElement) {
                        try {
                            window.renderMathInElement(document.body, {
                                delimiters: [{ left: '$$', right: '$$', display: true },
                                    { left: '$', right: '$', display: false },
                                    { left: '\\(', right: '\\)', display: false },
                                    { left: '\\[', right: '\\]', display: true }
                                ],
                                throwOnError: false
                            });
                        } catch (e) {}
                    }
                }, 200);
            }
            init();
        })();
    </script>
</body>
</html>
