<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河南专升本 · 数学随机测试</title>
    <script>
        window.MathJax = {

    <style>
        :root {
            --bg: #0a0f2e;
            --card: rgba(255, 255, 255, 0.06);
            --gold: #f0c75e;
            --blue: #4a9eff;
            --red: #ff6b6b;
            --green: #51cf66;
            --text: #f0f0f5;
            --border: rgba(255, 255, 255, 0.15);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: radial-gradient(circle at 20% 20%, #16224a, var(--bg));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '∑ ∫ π √ ∞';
            position: absolute;
            font-size: 180px;
            color: rgba(255, 255, 255, 0.02);
            top: 20px;
            left: 0;
            letter-spacing: 30px;
            pointer-events: none;
            width: 100%;
            text-align: center;
        }
        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            position: relative;
            z-index: 2;
        }
        h1, h2, h3 { font-weight: 600; letter-spacing: 1px; }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--gold), #fff7d6, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }
        .header .sub {
            color: var(--blue);
            font-size: 1rem;
            letter-spacing: 2px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--gold), #ffdd7e);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(240, 199, 94, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(240, 199, 94, 0.55); }
        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: none;
        }
        .btn.secondary:hover { background: rgba(255, 255, 255, 0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn.danger {
            background: linear-gradient(135deg, var(--red), #ff8787);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        .home-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.25);
            padding: 12px 20px;
            border-radius: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .progress-bar {
            flex: 1;
            min-width: 150px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--gold));
            border-radius: 10px;
            transition: width 0.4s;
        }
        .question-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.7;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .option-item:hover { background: rgba(74, 158, 255, 0.1); border-color: var(--blue); }
        .option-item.selected {
            background: rgba(74, 158, 255, 0.2);
            border-color: var(--blue);
            box-shadow: 0 0 15px rgba(74, 158, 255, 0.3);
        }
        .option-item input[type="radio"] { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; position: relative; }
        .option-item input[type="radio"]:checked { border-color: var(--gold); background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .nav-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .question-nav-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 15px;
        }
        .dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            color: #ccc;
        }
        .dot.active { background: var(--gold); color: #1a1a2e; border-color: var(--gold); box-shadow: 0 0 12px rgba(240,199,94,0.6); }
        .dot.answered { background: rgba(74,158,255,0.3); border-color: var(--blue); }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #1a1f3d;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: var(--text); font-size: 2rem; cursor: pointer; line-height: 1; }
        .result-card {
            background: rgba(255,255,255,0.05);
            border-radius: var(--radius);
            padding: 20px;
            margin-top: 15px;
            border-left: 4px solid var(--gold);

        .wrong-item {
            background: rgba(255,107,107,0.08);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,107,107,0.2);
        }
        .correct-answer { color: var(--green); font-weight: 600; }
        .wrong-answer { color: var(--red); font-weight: 600; }
        .explanation {
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.95rem;
        }
        .topic-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .topic-filter .btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
        }
        .hidden { display: none !important; }
        @media (max-width: 600px) {
            .app-container { padding: 15px; }
            .question-text { font-size: 1rem; }
            .option-item { font-size: 0.95rem; padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- 首页 -->
        <div id="homePage">
            <div class="header">
                <h1>河南专升本 · 数学</h1>
                <div class="sub">随机抽题 · 智能解析 · 历史对比</div>
            </div>
            <div class="stats-bar" id="historyBar">
                <span>📊 历史最高：<strong id="bestScore">--</strong></span>
                <span>📈 上次：<strong id="lastScore">--</strong></span>
                <span>📚 总题数：<strong>300</strong></span>
            </div>
            <div class="home-actions">
                <button class="btn" id="startBtn">🎯 开始随机测试（30题）</button>
                <button class="btn secondary" id="showBankBtn">📖 显示题库</button>
                <button class="btn secondary" id="resetHistoryBtn">🗑️ 清空历史记录</button>
            </div>
        </div>

        <!-- 测试页 -->
        <div id="testPage" class="hidden">
            <div class="stats-bar">
                <span>📝 进度：<strong id="progressText">1 / 30</strong></span>
                <div class="progress-bar"><div class="fill" id="progressFill" style="width:2%"></div></div>
                <button class="btn secondary" id="reRandomBtn">🔄 重新随机</button>
                <button class="btn secondary" id="showBankBtn2">📖 题库</button>
                <button class="btn danger" id="submitBtn">✅ 提交</button>
            </div>
            <div id="questionArea"></div>
            <div class="nav-buttons">
                <button class="btn secondary" id="prevBtn">◀ 上一题</button>
                <button class="btn secondary" id="nextBtn">下一题 ▶</button>
            </div>
            <div class="question-nav-dots" id="dotsContainer"></div>
        </div>

        <!-- 结果页 -->
        <div id="resultPage" class="hidden">
            <div class="header">
                <h2>📋 测试结果</h2>
            </div>
            <div id="resultSummary"></div>
            <div id="resultComparison"></div>
            <div id="resultWrong"></div>
            <div class="home-actions" style="margin-top:20px;">
                <button class="btn" id="backHomeBtn">🏠 返回首页</button>
                <button class="btn secondary" id="retakeBtn">🔄 重新测试</button>
            </div>
        </div>
    </div>

    <!-- 题库模态框 -->
    <div class="modal" id="bankModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📚 题库浏览</h3>
                <button class="close-btn" id="closeBankBtn">&times;</button>
            </div>
            <div class="topic-filter" id="topicFilter"></div>
            <div id="bankContent"></div>
        </div>
    </div>

    <script>
        // ========== 题库数据（300题） ==========
        const TOPICS = ['定义域','奇偶性','表达式','反函数','数列极限','函数极限','渐近线','已知极限求参数','无穷大','无穷小','无穷小比阶','连续与间断'];
        const Q = [
            // 专题1 定义域 25题
            [1, `函数 \\(f(x)=\\ln(2x-4)\\) 的定义域是（ ）`, `\\((2,+\\infty)\\)`, `\\([2,+\\infty)\\)`, `\\((-\\infty,2)\\)`, `\\((0,+\\infty)\\)`, 0, `\\(2x-4>0\\Rightarrow x>2\\)`],
            [1, `函数 \\(f(x)=\\frac{\\sqrt{3-x}}{x+1}\\) 的定义域是（ ）`, `\\(x\\le3\\) 且 \\(x\\ne-1\\)`, `\\(x<3\\) 且 \\(x\\ne-1\\)`, `\\(x\\ge3\\) 且 \\(x\\ne-1\\)`, `\\(x\\le3\\) 且 \\(x\\ne1\\)`, 0, `\\(3-x\\ge0\\) 且 \\(x+1\\ne0\\)`],
            [1, `\\(f(x)=\\frac{1}{\\sqrt{x^2-9}}\\) 的定义域是（ ）`, `\\((-3,3)\\)`, `\\([-3,3]\\)`, `\\((-\\infty,-3)\\cup(3,+\\infty)\\)`, `\\((-\\infty,-3]\\cup[3,+\\infty)\\)`, 2, `\\(x^2-9>0\\)`],
            [1, `\\(f(x)=\\arcsin(x-2)\\) 的定义域是（ ）`, `\\([0,2]\\)`, `\\([1,3]\\)`, `\\([2,4]\\)`, `\\([-1,1]\\)`, 1, `\\(-1\\le x-2\\le1\\Rightarrow 1\\le x\\le3\\)`],
            [1, `\\(f(x)=\\ln(4-x^2)\\) 的定义域是（ ）`, `\\((-2,2)\\)`, `\\([-2,2]\\)`, `\\((-\\infty,-2)\\cup(2,+\\infty)\\)`, `\\((0,4)\\)`, 0, `\\(4-x^2>0\\)`],
            [1, `\\(f(x)=\\sqrt{2x-1}+\\frac{1}{x-3}\\) 的定义域是（ ）`, `\\([\\frac12,3)\\cup(3,+\\infty)\\)`, `\\((\\frac12,3)\\)`, `\\([\\frac12,+\\infty)\\)`, `\\([\\frac12,3]\\)`, 0, `\\(2x-1\\ge0\\) 且 \\(x\\ne3\\)`],
            [1, `\\(f(x)=\\frac{\\ln(x-1)}{\\sqrt{4-x}}\\) 的定义域是（ ）`, `\\((1,4)\\)`, `\\([1,4]\\)`, `\\((1,4]\\)`, `\\([1,4)\\)`, 0, `\\(x-1>0\\) 且 \\(4-x>0\\)`],
            [1, `\\(f(x)=\\frac{1}{\\ln x}\\) 的定义域是（ ）`, `\\((0,+\\infty)\\)`, `\\((0,1)\\cup(1,+\\infty)\\)`, `\\([1,+\\infty)\\)`, `\\((1,+\\infty)\\)`, 1, `\\(x>0\\) 且 \\(\\ln x\\ne0\\)`],
            [1, `\\(f(x)=\\sqrt{x^2-5x+6}\\) 的定义域是（ ）`, `\\([2,3]\\)`, `\\((-\\infty,2]\\cup[3,+\\infty)\\)`, `\\((2,3)\\)`, `\\((-\\infty,2)\\cup(3,+\\infty)\\)`, 1, `\\(x^2-5x+6\\ge0\\)`],
            [1, `\\(f(x)=\\arcsin\\frac{x-1}{3}\\) 的定义域是（ ）`, `\\([-2,4]\\)`, `\\([-1,3]\\)`, `\\([0,3]\\)`, `\\([-4,2]\\)`, 0, `\\(-1\\le\\frac{x-1}{3}\\le1\\Rightarrow -2\\le x\\le4\\)`],
            [1, `\\(f(x)=\\ln(3+x)+\\sqrt{2-x}\\) 的定义域是（ ）`, `\\([-3,2]\\)`, `\\((-3,2]\\)`, `\\((-3,2)\\)`, `\\([-3,2)\\)`, 1, `\\(3+x>0\\) 且 \\(2-x\\ge0\\)`],
            [1, `\\(f(x)=\\sqrt{1-|x|}\\) 的定义域是（ ）`, `\\([-1,1]\\)`, `\\((-1,1)\\)`, `\\([0,1]\\)`, `\\((-\\infty,1]\\)`, 0, `\\(1-|x|\\ge0\\)`],
            [1, `\\(f(x)=\\frac{1}{x^2-4x+3}\\) 的定义域是（ ）`, `\\(x\\ne1\\) 且 \\(x\\ne3\\)`, `\\(x\\ne1\\)`, `\\(x\\ne3\\)`, `\\((1,3)\\)`, 0, `\\(x^2-4x+3\\ne0\\)`],
            [1, `\\(f(x)=\\sqrt{\\ln x}\\) 的定义域是（ ）`, `\\((0,1)\\)`, `\\((0,1]\\)`, `\\([1,+\\infty)\\)`, `\\((1,+\\infty)\\)`, 2, `\\(\\ln x\\ge0\\) 且 \\(x>0\\)`],
            [1, `\\(f(x)=\\ln(\\ln x)\\) 的定义域是（ ）`, `\\((0,+\\infty)\\)`, `\\((1,+\\infty)\\)`, `\\([1,+\\infty)\\)`, `\\((e,+\\infty)\\)`, 1, `\\(\\ln x>0\\Rightarrow x>1\\)`],
            [1, `\\(f(x)=\\arccos(2x-1)\\) 的定义域是（ ）`, `\\([-1,1]\\)`, `\\([0,1]\\)`, `\\([\\frac12,1]\\)`, `\\([0,2]\\)`, 1, `\\(-1\\le2x-1\\le1\\Rightarrow 0\\le x\\le1\\)`],
            [1, `\\(f(x)=\\frac{\\sqrt{4-x^2}}{\\ln(x+1)}\\) 的定义域是（ ）`, `\\((-1,0)\\cup(0,2]\\)`, `\\([-2,2]\\)`, `\\((-1,2)\\)`, `\\((-1,0)\\cup(0,2)\\)`, 0, `\\(4-x^2\\ge0\\)，\\(x+1>0\\) 且 \\(\\ln(x+1)\\ne0\\)`],
            [1, `\\(f(x)=\\frac{1}{\\sqrt{1-x^2}}\\) 的定义域是（ ）`, `\\((-1,1)\\)`, `\\([-1,1]\\)`, `\\((-\\infty,-1)\\cup(1,+\\infty)\\)`, `\\((0,1)\\)`, 0, `\\(1-x^2>0\\)`],
            [1, `\\(f(x)=\\ln\\frac{x-2}{x+1}\\) 的定义域是（ ）`, `\\((-1,2)\\)`, `\\((-\\infty,-1)\\cup(2,+\\infty)\\)`, `\\((2,+\\infty)\\)`, `\\((-\\infty,-1)\\)`, 1, `\\(\\frac{x-2}{x+1}>0\\)`],
            [1, `\\(f(x)=\\frac{\\sqrt{x^2-1}}{x-2}\\) 的定义域是（ ）`, `\\(|x|\\ge1\\) 且 \\(x\\ne2\\)`, `\\(|x|>1\\) 且 \\(x\\ne2\\)`, `\\(x\\ge1\\) 且 \\(x\\ne2\\)`, `\\(x\\le-1\\) 或 \\(x\\ge1\\)`, 0, `\\(x^2-1\\ge0\\) 且 \\(x\\ne2\\)`],
            [1, `\\(f(x)=e^{1/x}\\) 的定义域是（ ）`, `\\((0,+\\infty)\\)`, `\\((-\\infty,0)\\cup(0,+\\infty)\\)`, `\\([0,+\\infty)\\)`, `\\((-\\infty,0)\\)`, 1, `\\(x\\ne0\\)`],
            [1, `\\(f(x)=\\ln|x-2|\\) 的定义域是（ ）`, `\\(x>2\\)`, `\\(x<2\\)`, `\\(x\\ne2\\)`, `\\(x\\ge2\\)`, 2, `\\(|x-2|>0\\)`],
            [1, `\\(f(x)=\\sqrt{2x-x^2}\\) 的定义域是（ ）`, `\\([0,2]\\)`, `\\((0,2)\\)`, `\\([-2,0]\\)`, `\\([0,+\\infty)\\)`, 0, `\\(2x-x^2\\ge0\\)`],
            [1, `\\(f(x)=\\arcsin(\\ln x)\\) 的定义域是（ ）`, `\\([\\frac1e,e]\\)`, `\\((0,e)\\)`, `\\([1,e]\\)`, `\\((\\frac1e,e)\\)`, 0, `\\(-1\\le\\ln x\\le1\\)`],
            [1, `\\(f(x)=\\frac{\\sqrt{4-x}}{\\ln(3-x)}\\) 的定义域是（ ）`, `\\((-\\infty,2)\\cup(2,3)\\)`, `\\((-\\infty,3)\\)`, `\\((-\\infty,2)\\cup(2,3]\\)`, `\\((-\\infty,3]\\)`, 0, `\\(4-x\\ge0\\)，\\(3-x>0\\) 且 \\(\\ln(3-x)\\ne0\\)`],

            // 专题2 奇偶性 25题
            [2, `函数 \\(f(x)=x^3+\\sin x\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 0, `\\(f(-x)=-x^3-\\sin x=-f(x)\\)`],
            [2, `\\(f(x)=x^2+\\cos x\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 1, `\\(f(-x)=x^2+\\cos x=f(x)\\)`],
            [2, `\\(f(x)=x^2+x\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `既是奇又是偶`, 2, `\\(f(-x)=x^2-x\\)`],
            [2, `\\(f(x)=\\ln\\frac{1-x}{1+x}\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 0, `\\(f(-x)=-f(x)\\)`],
            [2, `\\(f(x)=x(e^x+e^{-x})\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 0, `偶函数乘x得奇函数`],
            [2, `\\(f(x)=e^x-e^{-x}\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 0, `\\(f(-x)=-f(x)\\)`],
            [2, `\\(f(x)=e^x+e^{-x}\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 1, `\\(f(-x)=f(x)\\)`],
            [2, `\\(f(x)=|x|\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 1, `\\(|-x|=|x|\\)`],
            [2, `\\(f(x)=x|x|\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 0, `\\(f(-x)=-f(x)\\)`],
            [2, `\\(f(x)=\\sin x+\\cos x\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 2, `\\(f(-x)=-\\sin x+\\cos x\\)`],
            [2, `\\(f(x)=\\ln(x+\\sqrt{1+x^2})\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 0, `\\(f(-x)=-f(x)\\)`],
            [2, `\\(f(x)=x^2\\sin x\\) 是（ ）`, `奇函数`, `偶函数`, `非奇非偶`, `无法确定`, 0, `偶乘奇得奇`],

        let originalQuestions = [];     // 记录原始题目的索引
        let testCount = 30;

        // 历史记录
        function getHistory() {
            const raw = localStorage.getItem('math_test_history');
            if (raw) {
                try { return JSON.parse(raw); } catch (e) { return []; }
            }
            return [];
        }
        function saveHistory(record) {
            const h = getHistory();
            h.push(record);
            localStorage.setItem('math_test_history', JSON.stringify(h));
        }
        function updateHistoryDisplay() {
            const h = getHistory();
            const best = h.length ? Math.max(...h.map(r => r.percentage)) : '--';
            const last = h.length ? h[h.length-1].percentage : '--';
            document.getElementById('bestScore').textContent = best;
            document.getElementById('lastScore').textContent = last + '%';
        }

        // ========== 工具函数 ==========
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        function pickRandomQuestions(count) {
            const indices = shuffleArray([...Array(Q.length).keys()]);
            return indices.slice(0, count);
        }
        function prepareQuestions(indices) {
            return indices.map(idx => {
                const item = Q[idx];
                const opts = [item[2], item[3], item[4], item[5]];
                const correct = item[6];
                const shuffled = shuffleArray([0,1,2,3]);
                const newOpts = shuffled.map(i => opts[i]);
                const newCorrect = shuffled.indexOf(correct);
                return {
                    topic: item[0],
                    question: item[1],
                    options: newOpts,
                    answer: newCorrect,
                    explanation: item[7],
                    originalIdx: idx
                };
            });
        }

        // ========== 渲染MathJax ==========
        function renderMath(element) {
            if (window.MathJax && MathJax.typesetPromise) {
                return MathJax.typesetPromise([element]).catch(() => {});
            }
            return Promise.resolve();
        }

        // ========== 页面切换 ==========
        function showPage(pageId) {
            ['homePage','testPage','resultPage'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // ========== 测试逻辑 ==========
        function startTest() {
            const indices = pickRandomQuestions(testCount);
            originalQuestions = indices;
            currentQuestions = prepareQuestions(indices);
            answers = new Array(testCount).fill(-1);
            currentIndex = 0;
            showPage('testPage');
            renderCurrentQuestion();
            renderDots();
        }

        function renderCurrentQuestion() {
            const q = currentQuestions[currentIndex];
            const area = document.getElementById('questionArea');
            const optLetters = ['A', 'B', 'C', 'D'];
            let html = `<div class="question-card"><div class="question-text">第 ${currentIndex+1} 题 · ${TOPICS[q.topic-1]}<br>${q.question}</div><div class="options">`;
            q.options.forEach((opt, i) => {
                const selected = (answers[currentIndex] === i) ? 'selected' : '';
                const checked = (answers[currentIndex] === i) ? 'checked' : '';
                html += `<label class="option-item ${selected}"><input type="radio" name="option" value="${i}" ${checked}><span>${optLetters[i]}. ${opt}</span></label>`;
            });
            html += `</div></div>`;
            area.innerHTML = html;
            document.querySelectorAll('input[name="option"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    answers[currentIndex] = parseInt(e.target.value);
                    renderDots();
                    // 重新渲染当前题以更新选中样式（或直接修改class）
                    const labels = document.querySelectorAll('.option-item');
                    labels.forEach((lab, idx) => {
                        lab.classList.toggle('selected', idx === answers[currentIndex]);
                    });
                });
            });
            document.getElementById('progressText').textContent = `${currentIndex+1} / ${testCount}`;
            document.getElementById('progressFill').style.width = `${((currentIndex+1)/testCount)*100}%`;
            renderMath(area);
        }

        function renderDots() {
            const container = document.getElementById('dotsContainer');
            let html = '';
            for (let i = 0; i < testCount; i++) {
                const answered = answers[i] !== -1 ? 'answered' : '';
                const active = i === currentIndex ? 'active' : '';
                html += `<div class="dot ${active} ${answered}" data-index="${i}">${i+1}</div>`;
            }
            container.innerHTML = html;
            container.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    currentIndex = parseInt(dot.dataset.index);
                    renderCurrentQuestion();
                    renderDots();
                });
            });
        }

        function goPrev() {
            if (currentIndex > 0) { currentIndex--; renderCurrentQuestion(); renderDots(); }
        }
        function goNext() {
            if (currentIndex < testCount - 1) { currentIndex++; renderCurrentQuestion(); renderDots(); }
        }

        function reRandom() {
            if (confirm('确定要重新随机选题吗？当前进度将丢失。')) {
                startTest();
            }
        }

        function submitTest() {
            const unanswered = answers.filter(a => a === -1).length;
            if (unanswered > 0) {
                if (!confirm(`还有 ${unanswered} 题未作答，确定提交吗？`)) return;
            }
            let correctCount = 0;
            const wrongList = [];
            currentQuestions.forEach((q, i) => {
                const userAns = answers[i];
                if (userAns === q.answer) {
                    correctCount++;
                } else {
                    wrongList.push({ index: i, userAns, q });
                }
            });
            const percentage = Math.round((correctCount / testCount) * 100);
            const record = { date: new Date().toLocaleString(), correct: correctCount, total: testCount, percentage };
            saveHistory(record);
            updateHistoryDisplay();
            showResultPage(record, wrongList);
        }

        function showResultPage(record, wrongList) {
            showPage('resultPage');
            const summary = document.getElementById('resultSummary');
            const comparison = document.getElementById('resultComparison');
            const wrongDiv = document.getElementById('resultWrong');
            summary.innerHTML = `<div class="result-card"><h3>📊 本次成绩</h3><p>正确率：<strong style="color:var(--gold);font-size:1.5rem;">${record.percentage}%</strong>（答对 ${record.correct} / ${record.total} 题）</p></div>`;
            const h = getHistory();
            let cmpText = '';
            if (h.length >= 2) {
                const prev = h[h.length - 2];
                const diff = record.percentage - prev.percentage;
                if (diff > 0) cmpText = `📈 与上一次（${prev.percentage}%）相比：上升了 ${diff}%`;
                else if (diff < 0) cmpText = `📉 与上一次（${prev.percentage}%）相比：下降了 ${-diff}%`;
                else cmpText = `➡️ 与上一次（${prev.percentage}%）相比：持平`;
            } else {
                cmpText = `🎯 首次测试记录`;
            }
            comparison.innerHTML = `<div class="result-card"><h4>历史对比</h4><p>${cmpText}</p><p>历史最高：<strong>${Math.max(...h.map(r=>r.percentage))}%</strong></p></div>`;
            let advice = '';
            if (record.percentage >= 90) advice = '🌟 优秀！你对这些知识掌握得非常好，继续保持！';
            else if (record.percentage >= 80) advice = '👍 良好！少量知识点需要巩固，查漏补缺即可。';
            else if (record.percentage >= 60) advice = '📖 及格，但建议系统复习错题涉及的知识点。';
            else advice = '💪 需要加强基础，建议从定义域、极限等基础概念重新梳理。';
            let wrongHtml = `<div class="result-card"><h4>💬 建议</h4><p>${advice}</p></div>`;
            if (wrongList.length > 0) {
                wrongHtml += `<div class="result-card"><h4>❌ 错题解析（${wrongList.length}题）</h4>`;
                const letters = ['A','B','C','D'];
                wrongList.forEach((w, idx) => {
                    const q = w.q;
                    const userStr = w.userAns === -1 ? '未作答' : `${letters[w.userAns]}. ${q.options[w.userAns]}`;
                    const correctStr = `${letters[q.answer]}. ${q.options[q.answer]}`;
                    wrongHtml += `<div class="wrong-item"><p><strong>第 ${w.index+1} 题</strong>（${TOPICS[q.topic-1]}）</p><p>${q.question}</p><p>你的答案：<span class="wrong-answer">${userStr}</span></p><p>正确答案：<span class="correct-answer">${correctStr}</span></p><div class="explanation">📘 解析：${q.explanation}</div></div>`;
                });
                wrongHtml += `</div>`;
            } else {
                wrongHtml += `<div class="result-card"><h4>🎉 全对！太棒了！</h4></div>`;
            }
            wrongDiv.innerHTML = wrongHtml;
            renderMath(resultPage);
        }

        // ========== 题库模态框 ==========
        function openBank() {
            const modal = document.getElementById('bankModal');
            modal.classList.add('open');
            renderTopicFilter();
            renderBankContent(1);
            renderMath(document.getElementById('bankContent'));
        }
        function closeBank() {
            document.getElementById('bankModal').classList.remove('open');
        }
        function renderTopicFilter() {
            const filter = document.getElementById('topicFilter');
            let html = '<button class="btn secondary" data-topic="all">全部</button>';
            TOPICS.forEach((t, i) => {
                html += `<button class="btn secondary" data-topic="${i+1}">${t}</button>`;
            });
            filter.innerHTML = html;
            filter.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const topic = btn.dataset.topic;
                    renderBankContent(topic === 'all' ? 'all' : parseInt(topic));
                });
            });
        }
        function renderBankContent(topic) {
            const content = document.getElementById('bankContent');
            const letters = ['A','B','C','D'];
            let filtered = Q;
            if (topic !== 'all') {
                filtered = Q.filter(item => item[0] === topic);
            }
            let html = '';
            filtered.forEach((item, idx) => {
                const topicName = TOPICS[item[0]-1];
                const correctIdx = item[6];
                html += `<div class="question-card"><p><strong>${idx+1}. [${topicName}]</strong> ${item[1]}</p><div class="options">`;
                [item[2], item[3], item[4], item[5]].forEach((opt, oi) => {
                    const cls = (oi === correctIdx) ? 'style="color:var(--green);font-weight:600;"' : '';
                    html += `<span ${cls}>${letters[oi]}. ${opt}</span><br>`;
                });
                html += `</div><p class="correct-answer">✅ 答案：${letters[correctIdx]}</p><div class="explanation">📘 解析：${item[7]}</div></div>`;
            });
            content.innerHTML = html;
            renderMath(content);
        }

        // ========== 事件绑定 ==========
        document.addEventListener('DOMContentLoaded', () => {
            updateHistoryDisplay();
            document.getElementById('startBtn').addEventListener('click', startTest);
            document.getElementById('showBankBtn').addEventListener('click', openBank);
            document.getElementById('showBankBtn2').addEventListener('click', openBank);
            document.getElementById('closeBankBtn').addEventListener('click', closeBank);
            document.getElementById('reRandomBtn').addEventListener('click', reRandom);
            document.getElementById('prevBtn').addEventListener('click', goPrev);
            document.getElementById('nextBtn').addEventListener('click', goNext);
            document.getElementById('submitBtn').addEventListener('click', submitTest);
            document.getElementById('backHomeBtn').addEventListener('click', () => { showPage('homePage'); updateHistoryDisplay(); });
            document.getElementById('retakeBtn').addEventListener('click', startTest);
            document.getElementById('resetHistoryBtn').addEventListener('click', () => {
                if (confirm('确定清空所有历史记录吗？')) {
                    localStorage.removeItem('math_test_history');
                    updateHistoryDisplay();
                }
            });
            // 关闭模态框点击背景
            document.getElementById('bankModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('bankModal')) closeBank();
            });
        });

        // 初始渲染公式（如果有）
        window.addEventListener('load', () => {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.body]).catch(() => {});
            }
        });
    </script>
