        { type: 'fill', q: 'They ______ (build) a new bridge last year.', ans: 'built' },
        { type: 'fill', q: 'We ______ (live) in Zhengzhou for ten years.', ans: 'have lived' },

        { type: 'fill', q: 'Look at the black clouds! It ______ (rain).', ans: 'is going to rain' },
        { type: 'fill', q: 'He said he ______ (finish) it the next day.', ans: 'would finish' },
        { type: 'fill', q: 'This time tomorrow, we ______ (fly) to the USA.', ans: 'will be flying' },
        { type: 'fill', q: 'By the end of last month, she ______ (teach) here for 10 years.', ans: 'had taught' },
        { type: 'fill', q: 'The English ______ (speak) in many countries.', ans: 'is spoken' },
        { type: 'fill', q: 'The book ______ (sell) well.', ans: 'sells' },
        { type: 'fill', q: 'I ______ (know) him since we were students.', ans: 'have known' },
        { type: 'fill', q: 'She always ______ (make) mistakes.', ans: 'makes' },
        { type: 'fill', q: 'The room needs ______ (paint).', ans: 'painting' },
        { type: 'fill', q: 'When I came in, they ______ (talk) happily.', ans: 'were talking' },
        { type: 'fill', q: 'We ______ (have) a test if it is fine next week.', ans: 'will have' },
        { type: 'fill', q: 'He ______ (be) to London twice.', ans: 'has been' },
        { type: 'fill', q: 'The window ______ (break) by the boy yesterday.', ans: 'was broken' },
        { type: 'fill', q: 'The train ______ (leave) at eight tomorrow morning.', ans: 'leaves' },
        { type: 'fill', q: 'Hardly ______ (he, sit) down when the bell rang.', ans: 'had he sat' },
        { type: 'fill', q: 'I ______ (write) a letter when the light went out.', ans: 'was writing' },
        { type: 'fill', q: 'We ______ (be) friends for many years.', ans: 'have been' },
        { type: 'fill', q: 'I will call you as soon as I ______ (arrive) in Beijing.', ans: 'arrive' },
        { type: 'fill', q: 'She ______ (marry) for 5 years.', ans: 'has been married' },
        { type: 'fill', q: 'This is the first time I ______ (be) here.', ans: 'have been' },
        { type: 'fill', q: 'The house ______ (build) in 2020.', ans: 'was built' },
        { type: 'fill', q: 'If you ______ (heat) ice, it turns into water.', ans: 'heat' },
        { type: 'fill', q: 'Look! The children ______ (swim) in the river.', ans: 'are swimming' },
        /* ====== 改错题 181-200 (双填空格式) ====== */
        { type: 'error', q: 'He has left Beijing for two years.', wrong: 'left', right: 'been away from' },
        { type: 'error', q: 'She is knowing the answer.', wrong: 'is knowing', right: 'knows' },
        { type: 'error', q: 'I have seen him yesterday.', wrong: 'have seen', right: 'saw' },
        { type: 'error', q: 'The book is sold well.', wrong: 'is sold', right: 'sells' },
        { type: 'error', q: 'He didn\'t went to school yesterday.', wrong: 'went', right: 'go' },
        { type: 'error', q: 'If it will rain tomorrow, I will stay at home.', wrong: 'will rain', right: 'rains' },
        { type: 'error', q: 'By the time I got there, he has left.', wrong: 'has', right: 'had' },
        { type: 'error', q: 'The window needs to clean.', wrong: 'to clean', right: 'cleaning' },
        { type: 'error', q: 'He said he will come next week.', wrong: 'will', right: 'would' },
        { type: 'error', q: 'Look! The children plays in the playground.', wrong: 'plays', right: 'are playing' },
        { type: 'error', q: 'I have bought this book for three days.', wrong: 'bought', right: 'kept' },
        { type: 'error', q: 'The fish is tasted very nice.', wrong: 'is tasted', right: 'tastes' },
        { type: 'error', q: 'When I came in, he is playing computer games.', wrong: 'is', right: 'was' },
        { type: 'error', q: 'She has been to the park last week.', wrong: 'has been', right: 'went' },
        { type: 'error', q: 'He was bought the bike two days ago.', wrong: 'was', right: '(删除)' },
        { type: 'error', q: 'Hardly did I sit down when the bell rang.', wrong: 'did', right: 'had' },
        { type: 'error', q: 'Look at the timetable. The train is leaving at 8:00.', wrong: 'is leaving', right: 'leaves' },
        { type: 'error', q: 'The Great Wall is visiting by thousands of people every year.', wrong: 'visiting', right: 'visited' },
        { type: 'error', q: 'She has left the city since three years ago.', wrong: 'has left', right: 'has been away from' },
        { type: 'error', q: 'He usually go to school on foot.', wrong: 'go', right: 'goes' }
    ];

    let currentQuestions = [];
    let userAnswers = {};

    // Fisher-Yates洗牌算法
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 初始化
    function initQuiz() {
        document.getElementById('result').style.display = 'none';
        currentQuestions = shuffle([...questionBank]).slice(0, 30); // 随机30题，保证不重复
        userAnswers = {};
        renderQuestions();
    }

    // 渲染题目
    function renderQuestions() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        currentQuestions.forEach((q, index) => {
            let typeTag = q.type === 'choice' ? '选择' : (q.type === 'fill' ? '填空' : '改错');
            let html = `<div class="question-card" id="q-${index}">
                <div class="q-header"><span class="q-tag">${typeTag}</span>${index + 1}. ${q.q}</div>`;

            if (q.type === 'choice') {
                html += `<div class="options">`;
                q.opts.forEach((opt, i) => {
                    html += `<div class="option" onclick="selectOption(${index}, ${i}, this)">${String.fromCharCode(65 + i)}. ${opt}</div>`;
                });
                html += `</div>`;
            } else if (q.type === 'fill') {
                html += `<input type="text" class="fill-input" oninput="recordAnswer(${index}, this.value)" placeholder="请输入正确形式...">`;
            } else {
                // 改错：双填空格式，无横杠
                html += `<div class="err-fill-group">
                            <div class="err-box"><label>错误项</label><input type="text" class="fill-input" oninput="recordAnswer(${index}, this.value, 'wrong')" placeholder="错误内容"></div>
                            <div class="err-box"><label>正确项</label><input type="text" class="fill-input" oninput="recordAnswer(${index}, this.value, 'right')" placeholder="正确内容"></div>
                         </div>`;
            }
            html += `</div>`;
            container.innerHTML += html;
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 选择
    function selectOption(qIndex, optIndex, element) {
        let options = element.parentElement.querySelectorAll('.option');
        options.forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        userAnswers[qIndex] = { type: 'choice', val: String.fromCharCode(65 + optIndex) };
    }

    // 填空/改错
    function recordAnswer(qIndex, value, part) {
        if (!userAnswers[qIndex]) userAnswers[qIndex] = { type: currentQuestions[qIndex].type, vals: {} };
        if (currentQuestions[qIndex].type === 'error') {
            if (!userAnswers[qIndex].vals) userAnswers[qIndex].vals = {};
            userAnswers[qIndex].vals[part] = value;
        } else {
            userAnswers[qIndex].val = value;
        }
    }

    // 提交
    function submitQuiz() {
        if (Object.keys(userAnswers).length < 30) {
            alert('您还有题目未作答，请完成后再提交！');
            return;
        }
        let correct = 0;
        currentQuestions.forEach((q, index) => {
            let ansData = userAnswers[index];
            let isCorrect = false;
            if (q.type === 'choice') {
                if (ansData.val === q.ans) isCorrect = true;
            } else if (q.type === 'fill') {
                if (ansData.val && ansData.val.trim().toLowerCase() === q.ans.toLowerCase()) isCorrect = true;
            } else if (q.type === 'error') {
                let w = (ansData.vals && ansData.vals.wrong) ? ansData.vals.wrong.trim().toLowerCase() : "";
                let r = (ansData.vals && ansData.vals.right) ? ansData.vals.right.trim().toLowerCase() : "";
                if (w === q.wrong.toLowerCase() && r === q.right.toLowerCase()) isCorrect = true;
            }
            document.getElementById(`q-${index}`).style.borderLeftColor = isCorrect ? '#00ff88' : '#ff4d4d';
            if (isCorrect) correct++;
        });

        let accuracy = Math.round((correct / 30) * 100);
        document.getElementById('result').style.display = 'block';
        document.getElementById('score').innerText = correct;
        document.getElementById('accuracy').innerText = accuracy + '%';

        let advice = "";
        if (accuracy >= 90) advice = "Excellent! Perfect command of tenses!";
        else if (accuracy >= 70) advice = "Good job! Review the tricky parts more.";
        else if (accuracy >= 50) advice = "Not bad, but more practice is needed.";
        else advice = "Don't worry! Practice makes perfect.";
        document.getElementById('advice').innerText = advice;

        compareAndSaveScore(accuracy);
    }

    // 历史对比
    function compareAndSaveScore(newScore) {
        let prevScore = localStorage.getItem('english_200_last_score');
        let trendMsg = document.getElementById('trend-msg');
        if (prevScore === null) {
            trendMsg.innerHTML = `<span class="up">初次测试，基础分数已记录！</span>`;
        } else {
            prevScore = parseInt(prevScore);
            document.getElementById('history-score').innerText = prevScore + "%";
            if (newScore > prevScore) trendMsg.innerHTML = `<span class="up">比历史最高分上升了 ${newScore - prevScore}%！</span>`;
            else if (newScore < prevScore) trendMsg.innerHTML = `<span class="down">比历史最高分下降了 ${prevScore - newScore}%。继续查漏补缺！</span>`;
            else trendMsg.innerHTML = `<span class="up">与历史最高分持平！</span>`;
        }
        localStorage.setItem('english_200_last_score', newScore);
        document.getElementById('history-score').innerText = newScore + "%";
    }

    // 题库展示
    function openBank() {
        let html = "";
        questionBank.forEach((q, i) => {
            let txt = `${i + 1}. [${q.type}] ${q.q}`;
            if (q.type === 'choice') txt += `<br><small>选项：${q.opts.join(', ')} | 答案：${q.ans}</small>`;
            else if (q.type === 'fill') txt += `<br><small>答案：${q.ans}</small>`;
            else txt += `<br><small>错：${q.wrong} | 对：${q.right}</small>`;
            html += `<div class="bank-item">${txt}</div>`;
        });
        document.getElementById('bank-list').innerHTML = html;
        document.getElementById('bankModal').style.display = 'flex';
    }
    
    function closeBank() {
        document.getElementById('bankModal').style.display = 'none';
    }

    window.onload = initQuiz;
</script>
