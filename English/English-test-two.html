<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>英语时态语态 · 单题模式（200题库）</title>
    <style>
        /* ===== 华丽英伦风 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 28px;
            padding: 24px 26px 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
            padding-bottom: 14px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #ffd700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header h1 .subtag {
            font-size: 0.7rem;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid #ffd700;
            padding: 0 14px;
            border-radius: 40px;
            color: #ffd700;
            font-weight: 400;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }

        .btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #ffd700;
            color: #000;
            border-color: #ffd700;
        }

        .btn-primary:hover {
            background: #ffed4a;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }

        .btn-success {
            background: #28a745;
            color: #fff;
            border-color: #28a745;
        }

        .btn-success:hover {
            background: #34ce57;
            border-color: #34ce57;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.4);
        }

        .btn-outline {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.3);
            color: #ddd;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: none;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== 统计栏 ===== */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 22px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 18px;
            border-radius: 60px;
            margin-bottom: 18px;
            justify-content: center;
            border: 1px solid rgba(255, 215, 0, 0.1);
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ddd;
        }

        .stat-item .badge {
            background: #ffd700;
            color: #000;
            border-radius: 40px;
            padding: 0 12px;
            font-size: 0.75rem;
            line-height: 24px;
            font-weight: 700;
        }

        .stat-item .badge.green {
            background: #28a745;
            color: #fff;
        }

        .stat-item .badge.gold {
            background: #ffd700;
            color: #000;
        }

        .stat-item .badge.orange {
            background: #fd7e14;
            color: #fff;
        }

        /* ===== 单题卡片 ===== */
        .single-card-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px 0 14px;
        }

        .question-card {
            background: rgba(0, 0, 0, 0.45);
            border-left: 6px solid #ffd700;
            border-radius: 16px;
            padding: 22px 26px 26px;
            width: 100%;
            max-width: 620px;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .question-card.correct-border {
            border-left-color: #28a745;
        }

        .question-card.wrong-border {
            border-left-color: #dc3545;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .q-number {
            background: #ffd700;
            color: #000;
            padding: 0 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 28px;
        }

        .q-type {
            background: rgba(255, 255, 255, 0.12);
            color: #ccc;
            padding: 0 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            line-height: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .q-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #f0f0f0;
            margin: 6px 0 14px;
            font-weight: 400;
        }

        /* 选项 */
        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0 12px;
        }

        .q-options .option {
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.25s;
            color: #e0e0e0;
            font-size: 0.95rem;
        }

        .q-options .option:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .q-options .option.selected {
            background: #ffd700;
            color: #000;
            border-color: #ffd700;
            font-weight: 600;
        }

        .q-options .option.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .q-options .option.disabled:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: transparent;
        }

        .q-options .option.correct-option {
            background: #28a745;
            color: #fff;
            border-color: #28a745;
        }

        .q-options .option.wrong-option {
            background: #dc3545;
            color: #fff;
            border-color: #dc3545;
        }

        /* 填空输入 */
        .fill-input {
            width: 100%;
            padding: 10px 18px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.9);
            font-size: 1.05rem;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
            margin-top: 6px;
            color: #1a1a1a;
        }

        .fill-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
        }

        .fill-input:disabled {
            background: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
        }

        .fill-input.correct-input {
            border-color: #28a745;
            background: #e8f5e9;
        }

        .fill-input.wrong-input {
            border-color: #dc3545;
            background: #fbe9e7;
        }

        /* 改错双输入 */
        .err-group {
            display: flex;
            gap: 16px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .err-group .err-box {
            flex: 1;
            min-width: 140px;
        }

        .err-group .err-box label {
            display: block;
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .err-group .err-box .fill-input {
            margin-top: 0;
        }

        /* 反馈结果 */
        .q-result {
            margin-top: 14px;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.25);
            display: none;
        }

        .q-result.show {
            display: block;
        }

        .q-result .correct-text {
            color: #28a745;
        }

        .q-result .wrong-text {
            color: #dc3545;
        }

        .q-result .answer-text {
            color: #ffd700;
        }

        /* ===== 导航栏 ===== */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            width: 100%;
            max-width: 620px;
        }

        .nav-bar .progress {
            font-size: 0.95rem;
            color: #ccc;
            font-weight: 500;
        }

        .nav-bar .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== 结果面板 ===== */
        .result-panel {
            margin-top: 24px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 24px 28px 30px;
            border: 2px solid #ffd700;
            display: none;
        }

        .result-panel.visible {
            display: block;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 1.5rem;
            color: #ffd700;
            text-align: center;
            margin-bottom: 6px;
        }

        .result-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 30px;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 20px;
            border-radius: 60px;
            margin: 8px 0 16px;
            font-size: 1rem;
        }

        .result-stats .stat strong {
            font-size: 1.4rem;
            color: #ffd700;
        }

        .result-stats .stat .trend {
            font-size: 1.1rem;
            margin-left: 4px;
        }

        .result-stats .stat .trend.up {
            color: #28a745;
        }

        .result-stats .stat .trend.down {
            color: #dc3545;
        }

        .suggestion {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 40px;
            padding: 8px 24px;
            font-size: 0.95rem;
            display: inline-block;
            color: #f0f0f0;
            text-align: center;
            width: 100%;
        }

        .wrong-list {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .wrong-item {
            background: rgba(220, 53, 69, 0.15);
            border-left: 4px solid #dc3545;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.85rem;
        }

        .wrong-item .w-q {
            font-weight: 600;
            color: #f0f0f0;
        }

        .wrong-item .w-user {
            color: #dc3545;
            font-size: 0.8rem;
        }

        .wrong-item .w-answer {
            color: #28a745;
            font-weight: 500;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.25s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-box {
            background: #1e2f3a;
            border-radius: 28px;
            max-width: 820px;
            width: 100%;
            padding: 24px 28px 30px;
            border: 2px solid #ffd700;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .modal-box h2 {
            color: #ffd700;
            font-size: 1.5rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-box .close-btn {
            float: right;
            background: #dc3545;
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.25s;
            font-size: 0.9rem;
        }

        .modal-box .close-btn:hover {
            background: #c82333;
            transform: scale(1.04);
        }

        .bank-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            margin-top: 8px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .bank-item {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .bank-item .b-q {
            color: #e8e8e8;
            font-weight: 500;
        }

        .bank-item .b-answer {
            color: #ffd700;
            font-size: 0.8rem;
            padding-left: 14px;
            border-left: 3px solid #ffd700;
            padding-top: 2px;
            padding-bottom: 2px;
        }

        .bank-item .b-type {
            color: #aaa;
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0 12px;
            border-radius: 30px;
            line-height: 20px;
            display: inline-block;
            align-self: flex-start;
        }

        /* 历史列表 */
        .history-list {
            list-style: none;
            padding: 0;
        }

        .history-list li {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #ddd;
        }

        .history-list li:last-child {
            border: none;
        }

        .history-list .score-high {
            color: #ffd700;
            font-weight: 700;
        }

        /* 滚动条 */
        .bank-grid::-webkit-scrollbar,
        .modal-box::-webkit-scrollbar {
            width: 5px;
        }

        .bank-grid::-webkit-scrollbar-track,
        .modal-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .bank-grid::-webkit-scrollbar-thumb,
        .modal-box::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 10px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 16px 14px 22px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .header h1 .subtag {
                font-size: 0.6rem;
                padding: 0 10px;
            }

            .question-card {
                padding: 16px 16px 20px;
                border-left-width: 4px;
            }

            .q-text {
                font-size: 0.98rem;
            }

            .q-options {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .q-options .option {
                padding: 8px 12px;
                font-size: 0.88rem;
            }

            .fill-input {
                font-size: 0.95rem;
                padding: 8px 14px;
            }

            .err-group {
                flex-direction: column;
                gap: 10px;
            }

            .err-group .err-box {
                min-width: auto;
            }

            .stats {
                font-size: 0.75rem;
                padding: 6px 12px;
                gap: 6px 14px;
            }

            .stat-item .badge {
                font-size: 0.65rem;
                line-height: 20px;
                padding: 0 10px;
            }

            .nav-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .nav-bar .btn-group {
                justify-content: center;
            }

            .modal-box {
                padding: 16px 14px 20px;
                border-radius: 20px;
            }

            .modal-box h2 {
                font-size: 1.2rem;
            }

            .bank-item {
                font-size: 0.78rem;
                padding: 6px 10px;
            }

            .result-stats {
                flex-direction: column;
                gap: 4px;
                border-radius: 24px;
                padding: 10px 16px;
            }

            .wrong-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 1rem;
            }

            .btn {
                font-size: 0.7rem;
                padding: 5px 12px;
            }

            .question-card {
                padding: 12px 12px 16px;
            }

            .q-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 头部 -->
        <div class="header">
            <h1>
                ⏳ 时态·语态
                <span class="subtag">单题模式</span>
            </h1>
            <div class="toolbar">
                <button class="btn btn-primary" id="randomBtn">🎲 重随机</button>
                <button class="btn" id="showBankBtn">📖 题库</button>
                <button class="btn" id="showHistoryBtn">🏆 历史</button>
            </div>
        </div>

        <!-- 统计 -->
        <div class="stats">
            <div class="stat-item">📝 总题 <span class="badge" id="totalCount">30</span></div>
            <div class="stat-item">✅ 已答 <span class="badge green" id="answeredCount">0</span></div>
            <div class="stat-item">📊 当前得分 <span class="badge gold" id="liveScore">0</span></div>
            <div class="stat-item">📌 历史最高 <span class="badge orange" id="historyScore">--</span></div>
        </div>

        <!-- 单题卡片 -->
        <div class="single-card-wrap">
            <div id="questionCard" class="question-card">
                <!-- 由 JS 动态渲染 -->
            </div>

            <div class="nav-bar">
                <div class="progress" id="progressDisplay">第 1 / 30 题</div>
                <div class="btn-group">
                    <button class="btn btn-outline" id="prevBtn" disabled>◀ 上一题</button>
                    <button class="btn btn-success" id="submitBtn">✅ 提交本题</button>
                    <button class="btn btn-outline" id="nextBtn">下一题 ▶</button>
                </div>
            </div>
        </div>

        <!-- 结果面板 -->
        <div class="result-panel" id="resultPanel">
            <div class="result-title">📊 练习结果</div>
            <div class="result-stats" id="resultStats">
                <div class="stat">正确率 <strong id="accuracy">0%</strong></div>
                <div class="stat">得分 <strong id="scoreNum">0</strong> / 30</div>
                <div class="stat">趋势 <span class="trend" id="trendIcon">—</span> <span id="trendText"></span></div>
            </div>
            <div class="suggestion" id="suggestionText">继续加油！</div>
            <div style="margin-top:16px; font-weight:600; color:#ffd700; font-size:0.95rem;">❌ 错题回顾</div>
            <div class="wrong-list" id="wrongList"></div>
        </div>
    </div>

    <!-- 题库模态框 -->
    <div class="modal-overlay" id="bankModal">
        <div class="modal-box">
            <button class="close-btn" id="closeBankModal">✕ 关闭</button>
            <h2>📖 全部题库（200题 · 含答案）</h2>
            <div id="bankContent" class="bank-grid"></div>
        </div>
    </div>

    <!-- 历史模态框 -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-box">
            <button class="close-btn" id="closeHistoryModal">✕ 关闭</button>
            <h2>🏆 历史记录</h2>
            <div id="historyContent"><p style="color:#888;">暂无记录</p></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  完整题库：200题（选择、填空、改错）
        //  结构保持与原版一致
        // ============================================================

        const questionBank = [
            /* ====== 选择题 1-50 ====== */
            { type: 'choice', q: 'The sun ______ in the east.', opts: ['rise', 'rises', 'rose', 'is rising'],
            ans: 'B' },
            { type: 'choice', q: 'He ______ his homework every day.', opts: ['do', 'does', 'did', 'is doing'],
            ans: 'B' },
            { type: 'choice', q: 'If it ______ tomorrow, we will stay at home.', opts: ['rains', 'will rain',
                    'rained', 'rain'
                ], ans: 'A' },
            { type: 'choice', q: 'Look! The children ______ in the playground.', opts: ['play', 'plays',
                    'are playing', 'is playing'
                ], ans: 'C' },
            { type: 'choice', q: 'She ______ to Beijing three times.', opts: ['has gone', 'has been', 'went',
                    'goes'
                ], ans: 'B' },
            { type: 'choice', q: 'My father ______ in this factory since 2010.', opts: ['works', 'worked',
                    'has worked', 'is working'
                ], ans: 'C' },
            { type: 'choice', q: 'I ______ this book for two weeks.', opts: ['have bought', 'have had', 'bought',
                    'had had'
                ], ans: 'B' },
            { type: 'choice', q: 'By the time he came back, I ______ the work.', opts: ['finished', 'have finished',
                    'had finished', 'finish'
                ], ans: 'C' },
            { type: 'choice', q: 'Hardly ______ down when the bell rang.', opts: ['had I sat', 'I had sat',

            { type: 'error', q: 'She has left the city since three years ago.', wrong: 'has left',
                right: 'has been away from' },
            { type: 'error', q: 'He usually go to school on foot.', wrong: 'go', right: 'goes' }
        ];

        // ============================================================
        //  单题模式状态
        // ============================================================

        let currentQuestions = [];
        let currentIndex = 0;
        let results = [];
        let allSubmitted = false;

        // DOM 引用
        const cardContainer = document.getElementById('questionCard');
        const progressDisplay = document.getElementById('progressDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const randomBtn = document.getElementById('randomBtn');
        const showBankBtn = document.getElementById('showBankBtn');
        const showHistoryBtn = document.getElementById('showHistoryBtn');

        const totalSpan = document.getElementById('totalCount');
        const answeredSpan = document.getElementById('answeredCount');
        const liveScoreSpan = document.getElementById('liveScore');
        const historyScoreSpan = document.getElementById('historyScore');

        const resultPanel = document.getElementById('resultPanel');
        const accuracySpan = document.getElementById('accuracy');
        const scoreNumSpan = document.getElementById('scoreNum');
        const trendIcon = document.getElementById('trendIcon');
        const trendText = document.getElementById('trendText');
        const suggestionDiv = document.getElementById('suggestionText');
        const wrongListDiv = document.getElementById('wrongList');

        // ---------- 工具 ----------
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function pickRandom(arr, n) {
            const shuffled = shuffle(arr);
            return shuffled.slice(0, n);
        }

        // ---------- 历史 ----------
        const STORAGE_KEY = 'tense_aspect_history_single';

        function getHistory() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
        }

        function saveHistory(record) {
            const h = getHistory();
            h.push(record);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
        }

        function getBestScore() {
            const h = getHistory();
            if (h.length === 0) return null;
            const scores = h.map(r => r.score);
            return Math.max(...scores);
        }

        function getLatestScore() {
            const h = getHistory();
            if (h.length === 0) return null;
            return h[h.length - 1].score;
        }

        function updateHistoryDisplay() {
            const best = getBestScore();
            historyScoreSpan.textContent = best !== null ? `${best}/30` : '--';
        }

        // ---------- 统计更新 ----------
        function updateStats() {
            const total = currentQuestions.length;
            const submitted = results.filter(r => r.submitted).length;
            const correct = results.filter(r => r.submitted && r.correct).length;
            totalSpan.textContent = total;
            answeredSpan.textContent = submitted;
            liveScoreSpan.textContent = correct;
            progressDisplay.textContent = `第 ${currentIndex+1} / ${total} 题`;
            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === total - 1);

            if (submitted === total && total > 0) {
                allSubmitted = true;
                showFinalResult();
            } else {
                allSubmitted = false;
                resultPanel.classList.remove('visible');
            }
            updateHistoryDisplay();
        }

        // ---------- 获取正确答案文本 ----------
        function getCorrectAnswerText(q) {
            if (q.type === 'choice') {
                const idx = q.ans.charCodeAt(0) - 65;
                return q.opts[idx] || q.ans;
            } else if (q.type === 'fill') {
                return q.ans;
            } else if (q.type === 'error') {
                return `错误: ${q.wrong} → 正确: ${q.right}`;
            }
            return '';
        }

        // ---------- 渲染当前题目 ----------
        function renderCurrentQuestion() {
            if (!currentQuestions.length) {
                cardContainer.innerHTML =
                    '<div style="text-align:center;padding:30px;color:#aaa;">请点击「重随机」开始练习</div>';
                return;
            }

            const q = currentQuestions[currentIndex];
            const result = results[currentIndex];
            const isSubmitted = result.submitted;

            let typeLabel = '';
            if (q.type === 'choice') typeLabel = '选择';
            else if (q.type === 'fill') typeLabel = '填空';
            else if (q.type === 'error') typeLabel = '改错';

            let html = `<div class="q-header">
                            <span class="q-number">#${currentIndex+1}</span>
                            <span class="q-type">${typeLabel}</span>
                        </div>`;
            html += `<div class="q-text">${q.q}</div>`;

            // ---- 选择题 ----
            if (q.type === 'choice') {
                html += `<div class="q-options">`;
                const ansIdx = q.ans.charCodeAt(0) - 65;
                q.opts.forEach((opt, oi) => {
                    const letter = String.fromCharCode(65 + oi);
                    let cls = 'option';
                    if (isSubmitted) {
                        cls += ' disabled';
                        if (oi === ansIdx) cls += ' correct-option';
                        else if (result.userAnswer === opt && oi !== ansIdx) cls += ' wrong-option';
                        else if (result.userAnswer === opt) cls += ' selected';
                    } else {
                        if (result.userAnswer === opt) cls += ' selected';
                    }
                    html += `<div class="${cls}" data-optidx="${oi}" onclick="selectChoice(${currentIndex}, ${oi})">${letter}. ${opt}</div>`;
                });
                html += `</div>`;
            }

            // ---- 填空题 ----
            if (q.type === 'fill') {
                const val = isSubmitted ? result.userAnswer : '';
                const disabled = isSubmitted ? 'disabled' : '';
                let inputCls = 'fill-input';
                if (isSubmitted) {
                    if (result.correct) inputCls += ' correct-input';
                    else inputCls += ' wrong-input';
                }
                html += `<input class="${inputCls}" type="text" placeholder="请输入答案..." value="${val}" ${disabled} autocomplete="off" oninput="recordFill(${currentIndex}, this.value)">`;
            }

            // ---- 改错题 ----
            if (q.type === 'error') {
                const errVal = isSubmitted ? (result.userAnswer.err || '') : '';
                const corVal = isSubmitted ? (result.userAnswer.cor || '') : '';
                const disabled = isSubmitted ? 'disabled' : '';
                let errCls = 'fill-input';
                let corCls = 'fill-input';
                if (isSubmitted) {
                    if (result.correct) { errCls += ' correct-input';
                        corCls += ' correct-input'; } else { errCls += ' wrong-input';
                        corCls += ' wrong-input'; }
                }
                html += `<div class="err-group">
                            <div class="err-box">
                                <label>❌ 错误部分</label>
                                <input class="${errCls}" type="text" placeholder="错误内容" value="${errVal}" ${disabled} autocomplete="off" oninput="recordError(${currentIndex}, 'wrong', this.value)">
                            </div>
                            <div class="err-box">
                                <label>✅ 正确形式</label>
                                <input class="${corCls}" type="text" placeholder="正确内容" value="${corVal}" ${disabled} autocomplete="off" oninput="recordError(${currentIndex}, 'right', this.value)">
                            </div>
                        </div>`;
            }

            // ---- 反馈 ----
            if (isSubmitted) {
                const correctText = getCorrectAnswerText(q);
                const icon = result.correct ? '✅' : '❌';
                const cls = result.correct ? 'correct-text' : 'wrong-text';
                const msg = result.correct ? '正确' : '错误';
                html += `<div class="q-result show">
                            <span class="${cls}">${icon} ${msg}</span>
                            &nbsp; 正确答案: <span class="answer-text">${correctText}</span>
                        </div>`;
                cardContainer.className = 'question-card ' + (result.correct ? 'correct-border' : 'wrong-border');
            } else {
                html += `<div class="q-result" style="display:block;color:#888;font-weight:400;">请作答后点击「提交本题」</div>`;
                cardContainer.className = 'question-card';
            }

            cardContainer.innerHTML = html;
            updateStats();
        }

        // ---------- 交互函数 ----------
        function selectChoice(index, optIdx) {
            if (results[index].submitted) return;
            const q = currentQuestions[index];
            const opt = q.opts[optIdx];
            results[index].userAnswer = opt;
            renderCurrentQuestion();
        }

        function recordFill(index, value) {
            if (results[index].submitted) return;
            results[index].userAnswer = value;
        }

        function recordError(index, part, value) {
            if (results[index].submitted) return;
            if (!results[index].userAnswer) results[index].userAnswer = {};
            results[index].userAnswer[part] = value;
        }

        // ---------- 提交当前题目 ----------
        function submitCurrent() {
            if (allSubmitted) {
                alert('所有题目已提交，点击「重随机」可重新练习。');
                return;
            }

            const q = currentQuestions[currentIndex];
            const result = results[currentIndex];

            if (result.submitted) {
                alert('本题已提交，请点击「下一题」继续。');
                return;
            }

            let isCorrect = false;
            let userAnswer = result.userAnswer;

            // 检查是否作答
            if (q.type === 'choice') {
                if (!userAnswer) {
                    alert('请先选择一个选项。');
                    return;
                }
                const ansIdx = q.ans.charCodeAt(0) - 65;
                isCorrect = (userAnswer === q.opts[ansIdx]);
            } else if (q.type === 'fill') {
                if (!userAnswer || userAnswer.trim() === '') {
                    alert('请填写答案。');
                    return;
                }
                isCorrect = (userAnswer.trim().toLowerCase() === q.ans.trim().toLowerCase());
            } else if (q.type === 'error') {
                if (!userAnswer || !userAnswer.wrong || !userAnswer.right || userAnswer.wrong.trim() === '' || userAnswer
                    .right.trim() === '') {
                    alert('请填写错误部分和正确形式。');
                    return;
                }
                isCorrect = (userAnswer.wrong.trim().toLowerCase() === q.wrong.trim().toLowerCase() &&
                    userAnswer.right.trim().toLowerCase() === q.right.trim().toLowerCase());
            }

            result.submitted = true;
            result.correct = isCorrect;

            renderCurrentQuestion();

            // 全部提交后显示结果
            const submittedCount = results.filter(r => r.submitted).length;
            if (submittedCount === currentQuestions.length) {
                allSubmitted = true;
                showFinalResult();
            }
            updateStats();

            // 自动跳转下一题
            if (currentIndex < currentQuestions.length - 1) {
                setTimeout(() => goToNext(), 700);
            }
        }

        // ---------- 导航 ----------
        function goToPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentQuestion();
            }
        }

        function goToNext() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderCurrentQuestion();
            }
        }

        // ---------- 显示最终结果 ----------
        function showFinalResult() {
            const total = currentQuestions.length;
            const correct = results.filter(r => r.submitted && r.correct).length;
            const accuracy = (correct / total * 100);

            const record = { score: correct, total, date: new Date().toLocaleString('zh-CN') };
            saveHistory(record);
            updateHistoryDisplay();

            resultPanel.classList.add('visible');
            accuracySpan.textContent = accuracy.toFixed(0) + '%';
            scoreNumSpan.textContent = correct;

            const history = getHistory();
            let trend = '',
                trendClass = '';
            if (history.length >= 2) {
                const prev = history[history.length - 2].score;
                if (correct > prev) { trend = '📈 上升';
                    trendClass = 'up'; } else if (correct < prev) { trend = '📉 下降';
                    trendClass = 'down'; } else { trend = '➖ 持平';
                    trendClass = ''; }
                trendIcon.textContent = trend;
                trendIcon.className = 'trend ' + trendClass;
                trendText.textContent = ` (上次 ${prev}/30)`;
            } else if (history.length === 1) {
                trendIcon.textContent = '—';
                trendText.textContent = '首次记录';
            } else {
                trendIcon.textContent = '—';
                trendText.textContent = '无历史';
            }

            let suggestion = '';
            if (accuracy >= 90) suggestion = '🌟 优秀！时态语态掌握扎实！';
            else if (accuracy >= 70) suggestion = '👍 良好，复习错题巩固。';
            else if (accuracy >= 50) suggestion = '📖 建议回顾时态语态基本规则。';
            else suggestion = '💪 别灰心，从基础开始，逐一分析错题。';
            suggestionDiv.textContent = suggestion;

            wrongListDiv.innerHTML = '';
            const wrongs = results.filter(r => r.submitted && !r.correct);
            if (wrongs.length === 0) {
                wrongListDiv.innerHTML = '<p style="color:#28a745; font-weight:500;">🎉 全部正确！</p>';
            } else {
                wrongs.forEach((w, idx) => {
                    const q = currentQuestions[idx];
                    const item = document.createElement('div');
                    item.className = 'wrong-item';
                    const userAns = typeof w.userAnswer === 'string' ? w.userAnswer :
                        (w.userAnswer ? (w.userAnswer.wrong + ' → ' + w.userAnswer.right) : '');
                    const correctAns = getCorrectAnswerText(q);
                    item.innerHTML = `
                                <div class="w-q">${q.q}</div>
                                <div class="w-user">你的答案: ${userAns || '(未填)'}</div>
                                <div class="w-answer">正确答案: ${correctAns}</div>
                            `;
                    wrongListDiv.appendChild(item);
                });
            }
        }

        // ---------- 随机出题 ----------
        function randomQuestions() {
            const selected = pickRandom(questionBank, 30);
            currentQuestions = selected;
            results = currentQuestions.map(() => ({
                submitted: false,
                correct: false,
                userAnswer: null
            }));
            currentIndex = 0;
            allSubmitted = false;
            resultPanel.classList.remove('visible');
            renderCurrentQuestion();
            updateHistoryDisplay();
        }

        // ---------- 题库模态框（显示完整答案） ----------
        function showBank() {
            const modal = document.getElementById('bankModal');
            const content = document.getElementById('bankContent');
            content.innerHTML = '';
            questionBank.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'bank-item';

                let type = '';
                if (q.type === 'choice') type = '选择';
                else if (q.type === 'fill') type = '填空';
                else type = '改错';

                let answerText = '';
                if (q.type === 'choice') {
                    const idx = q.ans.charCodeAt(0) - 65;
                    answerText = `正确答案: ${q.opts[idx]}`;
                } else if (q.type === 'fill') {
                    answerText = `答案: ${q.ans}`;
                } else if (q.type === 'error') {
                    answerText = `错误: ${q.wrong} → 正确: ${q.right}`;
                }

                div.innerHTML = `
                            <div class="b-q">${i+1}. ${q.q}</div>
                            <div class="b-answer">${answerText}</div>
                            <span class="b-type">${type}</span>
                        `;
                content.appendChild(div);
            });
            modal.classList.add('open');
        }

        // ---------- 历史 ----------
        function showHistory() {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            const history = getHistory();
            if (history.length === 0) {
                content.innerHTML = '<p style="color:#888;">暂无记录</p>';
            } else {
                let html = `<ul class="history-list">`;
                history.slice().reverse().forEach((r, i) => {
                    const isLatest = (i === 0);
                    html +=
                        `<li><span>#${history.length - i}  ${r.date}</span><span class="${isLatest ? 'score-high' : ''}">${r.score} / ${r.total}</span></li>`;
                });
                html += '</ul>';
                content.innerHTML = html;
            }
            modal.classList.add('open');
        }

        // ---------- 事件绑定 ----------
        randomBtn.addEventListener('click', randomQuestions);
        submitBtn.addEventListener('click', submitCurrent);
        prevBtn.addEventListener('click', goToPrev);
        nextBtn.addEventListener('click', goToNext);

        showBankBtn.addEventListener('click', showBank);
        document.getElementById('closeBankModal').addEventListener('click', () => {
            document.getElementById('bankModal').classList.remove('open');
        });
        document.getElementById('bankModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) document.getElementById('bankModal').classList.remove('open');
        });

        showHistoryBtn.addEventListener('click', showHistory);
        document.getElementById('closeHistoryModal').addEventListener('click', () => {
            document.getElementById('historyModal').classList.remove('open');
        });
        document.getElementById('historyModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) document.getElementById('historyModal').classList.remove('open');
        });

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft') goToPrev();
            else if (e.key === 'ArrowRight') goToNext();
            else if (e.key === 'Enter') submitCurrent();
        });

        // ---------- 启动 ----------
        randomQuestions();
    </script>
</body>
</html>
