<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 主谓一致 · 英语专项训练</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f5f9ff 0%, #e3edfa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(70, 130, 200, 0.08) 0%, transparent 50%);
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            min-height: 90vh;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 56px;
            box-shadow: 0 30px 80px rgba(30, 60, 120, 0.15),
                0 10px 30px rgba(30, 60, 120, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 32px 40px 28px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 215, 0, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(70, 130, 220, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 32px;
            line-height: 1;
            background: linear-gradient(135deg, #f7c948, #f0a030);
            border-radius: 16px;
            padding: 6px 10px;
            box-shadow: 0 4px 12px rgba(240, 160, 48, 0.3);
        }

        .logo-text {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1a3a6b, #2a5f9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text span {
            font-weight: 300;
            -webkit-text-fill-color: #4a7ab5;
            opacity: 0.8;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            position: relative;
            z-index: 1;
            background: white;
            color: #1a3a6b;
            border: 1px solid rgba(26, 58, 107, 0.10);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2a5f9e, #1a3a6b);
            color: white;
            border: none;
            box-shadow: 0 6px 20px rgba(26, 58, 107, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 30px rgba(26, 58, 107, 0.35);
        }

        .btn-gold {
            background: linear-gradient(135deg, #f7c948, #f0a030);
            color: #1a2a3a;
            border: none;
            box-shadow: 0 6px 20px rgba(240, 160, 48, 0.30);
        }

        .btn-gold:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 30px rgba(240, 160, 48, 0.40);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(26, 58, 107, 0.20);
            color: #1a3a6b;
        }

        .btn-outline:hover {
            background: rgba(26, 58, 107, 0.05);
            border-color: #1a3a6b;
            transform: translateY(-1px);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 16px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 1;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #1a3a6b;
            font-weight: 500;
        }

        .stat-item .num {
            font-weight: 700;
            font-size: 18px;
            color: #0a2a4a;
            min-width: 28px;
        }

        .stat-item .label {
            opacity: 0.7;
            font-weight: 400;
        }

        .trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
        }

        .trend.up {
            color: #1a8a4a;
            background: rgba(26, 138, 74, 0.12);
        }

        .trend.down {
            color: #b03a3a;
            background: rgba(176, 58, 58, 0.10);
        }

        .trend.same {
            color: #6a7a8a;
            background: rgba(106, 122, 138, 0.10);
        }

        .question-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 18px 10px 10px;
            position: relative;
            z-index: 1;
            min-height: 340px;
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #3a5a7a;
            font-weight: 500;
        }

        .q-type-badge {
            background: rgba(26, 58, 107, 0.08);
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .q-index {
            opacity: 0.7;
        }

        .q-text {
            font-size: 26px;
            line-height: 1.6;
            font-weight: 500;
            color: #0a1a2a;
            margin-bottom: 24px;
            padding: 8px 4px;
            letter-spacing: 0.3px;
        }

        .q-text .blank-indicator {
            display: inline-block;
            min-width: 120px;
            border-bottom: 3px dashed #2a5f9e;
            margin: 0 4px;
            padding: 0 6px;
            color: #2a5f9e;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 24px;
            margin: 12px 0 8px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            background: white;
            border-radius: 20px;
            border: 2px solid rgba(26, 58, 107, 0.06);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .option-item:hover {
            border-color: rgba(26, 58, 107, 0.20);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26, 58, 107, 0.06);
        }

        .option-item.selected {
            border-color: #2a5f9e;
            background: rgba(42, 95, 158, 0.06);
            box-shadow: 0 0 0 4px rgba(42, 95, 158, 0.08);
        }

        .option-item.correct-reveal {
            border-color: #1a8a4a;
            background: rgba(26, 138, 74, 0.08);
        }

        .option-item.wrong-reveal {
            border-color: #b03a3a;
            background: rgba(176, 58, 58, 0.08);
        }

        .option-radio {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(26, 58, 107, 0.20);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
            font-size: 12px;
            font-weight: 700;
            color: #1a3a6b;
        }

        .option-item.selected .option-radio {
            border-color: #2a5f9e;
            background: #2a5f9e;
            color: white;
        }

        .option-item.correct-reveal .option-radio {
            border-color: #1a8a4a;
            background: #1a8a4a;
            color: white;
        }

        .option-item.wrong-reveal .option-radio {
            border-color: #b03a3a;
            background: #b03a3a;
            color: white;
        }

        .option-label {
            font-size: 17px;
            font-weight: 450;
            color: #1a2a3a;
        }

        .fill-area {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin: 10px 0 6px;
            max-width: 700px;
        }

        .fill-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .fill-row label {
            font-weight: 500;
            color: #1a3a6b;
            min-width: 80px;
            font-size: 15px;
        }

        .fill-input {
            flex: 1;
            min-width: 160px;
            padding: 12px 18px;
            border: 2px solid rgba(26, 58, 107, 0.08);
            border-radius: 16px;
            font-size: 17px;
            font-weight: 450;
            background: white;
            transition: 0.25s;
            outline: none;
            color: #0a1a2a;
        }

        .fill-input:focus {
            border-color: #2a5f9e;
            box-shadow: 0 0 0 4px rgba(42, 95, 158, 0.12);
        }

        .fill-input.correct {
            border-color: #1a8a4a;
            background: rgba(26, 138, 74, 0.04);
        }

        .fill-input.wrong {
            border-color: #b03a3a;
            background: rgba(176, 58, 58, 0.04);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(26, 58, 107, 0.06);
            position: relative;
            z-index: 1;
        }

        .action-left,
        .action-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .feedback {
            margin-top: 14px;
            padding: 14px 22px;
            border-radius: 24px;
            font-weight: 500;
            font-size: 15px;
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
        }

        .feedback.show {
            display: flex;
        }

        .feedback.correct {
            border-left: 6px solid #1a8a4a;
            color: #0a4a2a;
        }

        .feedback.wrong {
            border-left: 6px solid #b03a3a;
            color: #6a2a2a;
        }

        .feedback .fb-icon {
            font-size: 28px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 20, 40, 0.50);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: white;
            border-radius: 40px;
            max-width: 1000px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.30);
            overflow: hidden;
            animation: modalIn 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fbff;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 22px;
            color: #1a3a6b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.03);
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            color: #3a5a7a;
        }

        .modal-close:hover {
            background: rgba(176, 58, 58, 0.08);
            color: #b03a3a;
        }

        .modal-body {
            padding: 20px 28px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body::-webkit-scrollbar {
            width: 6px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 10px;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(26, 58, 107, 0.20);
            border-radius: 10px;
        }

        .bank-item {
            padding: 14px 18px;
            margin-bottom: 10px;
            background: #f8fbff;
            border-radius: 18px;
            border-left: 4px solid #2a5f9e;
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .bank-item .bq {
            flex: 1;
            color: #0a1a2a;
        }

        .bank-item .bans {
            font-weight: 600;
            color: #1a8a4a;
            background: rgba(26, 138, 74, 0.08);
            padding: 2px 16px;
            border-radius: 30px;
            white-space: nowrap;
            font-size: 13px;
        }

        .bank-item .btype {
            font-size: 12px;
            color: #6a8aaa;
            background: rgba(0, 0, 0, 0.03);
            padding: 2px 12px;
            border-radius: 30px;
        }

        .bank-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .bank-filter .btn {
            padding: 6px 18px;
            font-size: 13px;
        }

        @media (max-width: 780px) {
            .app-container {
                padding: 20px 18px;
                border-radius: 32px;
                min-height: 92vh;
            }
            .q-text {
                font-size: 20px;
            }
            .options-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .option-item {
                padding: 12px 16px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: flex-start;
            }
            .stats-bar {
                flex-wrap: wrap;
                font-size: 12px;
                padding: 8px 14px;
                gap: 6px 12px;
            }
            .stat-item .num {
                font-size: 16px;
                min-width: 20px;
            }
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .action-left,
            .action-right {
                justify-content: center;
            }
            .fill-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .fill-row label {
                min-width: auto;
            }
            .modal-box {
                max-height: 92vh;
                border-radius: 28px;
            }
            .modal-header {
                padding: 16px 20px;
            }
            .modal-body {
                padding: 14px 16px;
            }
            .bank-item {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 14px 12px;
                border-radius: 24px;
                min-height: 96vh;
            }
            .q-text {
                font-size: 18px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 12px;
            }
            .logo-text {
                font-size: 17px;
            }
            .logo-icon {
                font-size: 24px;
                padding: 4px 8px;
            }
        }

        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .text-muted {
            color: #6a8aaa;
        }
        .text-gold {
            color: #f0a030;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">📘</div>
                <div class="logo-text">主谓一致 <span>· 专项训练</span></div>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline btn-sm" onclick="openBank()">📚 题库</button>
                <button class="btn btn-gold btn-sm" onclick="reshuffle()">🎲 重新随机</button>
                <button class="btn btn-primary btn-sm" onclick="submitAll()">✔ 提交批改</button>
            </div>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <span class="label">📌 进度</span>
                <span class="num" id="progressNum">0/30</span>
            </div>
            <div class="stat-item">
                <span class="label">✅ 正确率</span>
                <span class="num" id="rateNum">0%</span>
            </div>
            <div class="stat-item">
                <span class="label">🏆 历史最佳</span>
                <span class="num" id="bestNum">--</span>
            </div>
            <div class="stat-item">
                <span class="label">📊 对比</span>
                <span id="trendDisplay" class="trend same">— 首次</span>
            </div>
        </div>

        <div class="question-area" id="questionArea">
            <div class="q-meta">
                <span class="q-type-badge" id="qTypeBadge">📝 选择题</span>
                <span class="q-index" id="qIndexDisplay">1 / 30</span>
            </div>
            <div class="q-text" id="qText">加载题目中...</div>
            <div id="qInteraction"></div>
        </div>

        <div class="feedback" id="feedback">
            <span class="fb-icon" id="fbIcon">✅</span>
            <span id="fbText">回答正确！</span>
        </div>

        <div class="action-bar">
            <div class="action-left">
                <button class="btn btn-outline btn-sm" onclick="prevQuestion()">◀ 上一题</button>
                <button class="btn btn-outline btn-sm" onclick="nextQuestion()">下一题 ▶</button>
                <span style="font-size:13px;color:#6a8aaa;" id="qNavInfo">1 / 30</span>
            </div>
            <div class="action-right">
                <button class="btn btn-gold btn-sm" onclick="submitAll()">📝 提交批改</button>
                <button class="btn btn-primary btn-sm" onclick="resetProgress()">🔄 重置进度</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bankModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>📚 全部题库 <span style="font-size:15px;font-weight:400;color:#6a8aaa;">(200题)</span></h2>
                <button class="modal-close" onclick="closeBank()">✕</button>
            </div>
            <div class="modal-body" id="bankBody">
                <div class="bank-filter">
                    <button class="btn btn-sm btn-outline" onclick="filterBank('all')">📋 全部</button>
                    <button class="btn btn-sm btn-outline" onclick="filterBank('choice')">🔘 选择</button>
                    <button class="btn btn-sm btn-outline" onclick="filterBank('fill')">✏️ 填空</button>
                    <button class="btn btn-sm btn-outline" onclick="filterBank('correct')">🔧 改错</button>
                </div>
                <div id="bankList"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 数据：200 道题（80 选择 + 80 填空 + 40 改错）
        // ============================================================
        const ALL_QUESTIONS = [];

        // ---------- 选择题 (80) ----------
        const choiceData = [
            { q: 'A large amount of money ______ spent on the project last year.', opts: ['were', 'was', 'have', 'are'],
                ans: 1 },
            { q: 'Large quantities of water ______ polluted in that area.', opts: ['has', 'have', 'is', 'was'], ans: 1 },
            { q: 'This kind of apples ______ sweet.', opts: ['taste', 'tastes', 'have tasted', 'are tasting'], ans: 1 },
            { q: 'Apples of this kind ______ well in this area.', opts: ['grows', 'grow', 'is grown', 'has grown'],
            ans: 1 },
            { q: 'A day or two ______ enough for this work.', opts: ['are', 'is', 'were', 'have been'], ans: 1 },
            { q: 'One or two days ______ enough for this work.', opts: ['is', 'was', 'are', 'has been'], ans: 2 },
            { q: 'One of the girls in our class ______ my daughter.', opts: ['are', 'is', 'were', 'have been'], ans: 1 },
            { q: 'This is one of the rooms that ______ damaged in the fire.', opts: ['was', 'were', 'has', 'is'], ans: 1 },
            { q: 'Mary is the only one of the youngest girls who ______ in the band.', opts: ['play', 'plays', 'are playing',
                    'have played'
                ], ans: 1 },
            { q: 'One-third of the area ______ covered with green trees.', opts: ['are', 'have', 'is', 'were'], ans: 2 },
            { q: 'About seventy percent of the trees ______ been planted.', opts: ['has', 'have', 'is', 'was'], ans: 1 },

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];

                    <input class="fill-input" type="text" id="correctInput" 
                           placeholder="输入正确的词..." 
                           value="${userAnswers[q.id + '_cor'] || ''}"
                           ${isSubmitted ? 'disabled' : ''}>
                `;
                area.appendChild(row1);
                area.appendChild(row2);
                container.appendChild(area);

                if (isSubmitted) {
                    const eInp = document.getElementById('errorInput');
                    const cInp = document.getElementById('correctInput');
                    const eVal = userAnswers[q.id + '_err'] || '';
                    const cVal = userAnswers[q.id + '_cor'] || '';
                    const isErrOk = eVal.trim().toLowerCase() === q.errorWord.toLowerCase();
                    const isCorOk = cVal.trim().toLowerCase() === q.correctWord.toLowerCase();
                    if (eVal) eInp.classList.add(isErrOk ? 'correct' : 'wrong');
                    if (cVal) cInp.classList.add(isCorOk ? 'correct' : 'wrong');
                } else {
                    document.getElementById('errorInput').addEventListener('input', (e) => {
                        userAnswers[q.id + '_err'] = e.target.value;
                    });
                    document.getElementById('correctInput').addEventListener('input', (e) => {
                        userAnswers[q.id + '_cor'] = e.target.value;
                    });
                }
            }

            if (isSubmitted) {
                const fb = document.getElementById('feedback');
                const isCorrect = results[q.id] === 'correct';
                fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
                document.getElementById('fbIcon').textContent = isCorrect ? '✅' : '❌';
                document.getElementById('fbText').textContent = isCorrect ? '回答正确！' : '回答错误，查看正确答案。';
                if (q.type === 'choice') {
                    document.getElementById('fbText').textContent += ` 正确答案: ${q.options[q.answer]}`;
                } else if (q.type === 'fill') {
                    document.getElementById('fbText').textContent += ` 正确答案: ${q.answer}`;
                } else if (q.type === 'correct') {
                    document.getElementById('fbText').textContent += ` 错误词: ${q.errorWord} → 正确词: ${q.correctWord}`;
                }
            } else {
                document.getElementById('feedback').classList.remove('show');
            }

            updateStats();
        }

        function prevQuestion() {
            if (currentIndex > 0) { currentIndex--;
                renderQuestion(); }
        }

        function nextQuestion() {
            if (currentIndex < currentPool.length - 1) { currentIndex++;
                renderQuestion(); }
        }

        function submitAll() {
            let anyAnswered = false;
            for (const idx of currentPool) {
                const q = ALL_QUESTIONS[idx];
                if (submitted[q.id]) continue;
                let hasAnswer = false;
                if (q.type === 'choice') {
                    if (userAnswers[q.id] !== undefined && userAnswers[q.id] !== null) hasAnswer = true;
                } else if (q.type === 'fill') {
                    if (userAnswers[q.id] && userAnswers[q.id].trim() !== '') hasAnswer = true;
                } else if (q.type === 'correct') {
                    const e = userAnswers[q.id + '_err'] || '';
                    const c = userAnswers[q.id + '_cor'] || '';
                    if (e.trim() !== '' || c.trim() !== '') hasAnswer = true;
                }
                if (hasAnswer) anyAnswered = true;

                let isCorrect = false;
                if (q.type === 'choice') {
                    const userAns = userAnswers[q.id];
                    if (userAns !== undefined && userAns !== null && userAns === q.answer) isCorrect = true;
                } else if (q.type === 'fill') {
                    const userAns = (userAnswers[q.id] || '').trim();
                    if (userAns.toLowerCase() === q.answer.toLowerCase()) isCorrect = true;
                } else if (q.type === 'correct') {
                    const e = (userAnswers[q.id + '_err'] || '').trim().toLowerCase();
                    const c = (userAnswers[q.id + '_cor'] || '').trim().toLowerCase();
                    if (e === q.errorWord.toLowerCase() && c === q.correctWord.toLowerCase()) isCorrect = true;
                }
                submitted[q.id] = true;
                results[q.id] = isCorrect ? 'correct' : 'wrong';
            }

            if (!anyAnswered) {
                alert('⚠️ 请至少回答一题再提交！');
                return;
            }

            let correctCount = 0;
            let totalAnswered = 0;
            for (const idx of currentPool) {
                const q = ALL_QUESTIONS[idx];
                if (submitted[q.id]) {
                    totalAnswered++;
                    if (results[q.id] === 'correct') correctCount++;
                }
            }
            currentScore = correctCount;
            historyScores.push(correctCount);
            localStorage.setItem('subj_agree_history', JSON.stringify(historyScores));
            bestScore = Math.max(...historyScores);
            updateStats();
            updateTrendDisplay();
            renderQuestion();
            const fb = document.getElementById('feedback');
            fb.className = 'feedback show correct';
            document.getElementById('fbIcon').textContent = '📊';
            document.getElementById('fbText').textContent =
                `已批改 ${totalAnswered} 题，正确 ${correctCount} 题，正确率 ${Math.round(correctCount/totalAnswered*100)}%。${correctCount/totalAnswered >= 0.8 ? '🌟 优秀！继续保持！' : correctCount/totalAnswered >= 0.6 ? '💪 加油，再练练！' : '📖 建议复习主谓一致规则！'}`;
        }

        function updateStats() {
            const total = currentPool.length;
            let answered = 0,
                correct = 0;
            for (const idx of currentPool) {
                const q = ALL_QUESTIONS[idx];
                if (submitted[q.id]) {
                    answered++;
                    if (results[q.id] === 'correct') correct++;
                }
            }
            document.getElementById('progressNum').textContent = `${answered}/${total}`;
            const rate = answered > 0 ? Math.round(correct / answered * 100) : 0;
            document.getElementById('rateNum').textContent = answered > 0 ? rate + '%' : '0%';
            document.getElementById('bestNum').textContent = bestScore !== null ? bestScore + '/' + total : '--';
        }

        function updateTrendDisplay() {
            const el = document.getElementById('trendDisplay');
            const scores = historyScores;
            if (scores.length < 2) {
                el.className = 'trend same';
                el.textContent = '— 首次';
                return;
            }
            const latest = scores[scores.length - 1];
            const prev = scores[scores.length - 2];
            if (latest > prev) {
                el.className = 'trend up';
                el.textContent = `📈 上升 +${latest - prev}`;
            } else if (latest < prev) {
                el.className = 'trend down';
                el.textContent = `📉 下降 ${latest - prev}`;
            } else {
                el.className = 'trend same';
                el.textContent = `➖ 持平 ${latest}`;
            }
        }

        // ============================================================
        //  4. 题库查看
        // ============================================================
        function openBank() {
            document.getElementById('bankModal').classList.add('open');
            renderBankList('all');
            document.body.style.overflow = 'hidden';
        }

        function closeBank() {
            document.getElementById('bankModal').classList.remove('open');
            document.body.style.overflow = '';
        }

        function filterBank(type) {
            bankFilter = type;
            renderBankList(type);
        }

        function renderBankList(type) {
            const container = document.getElementById('bankList');
            let filtered = ALL_QUESTIONS;
            if (type === 'choice') filtered = ALL_QUESTIONS.filter(q => q.type === 'choice');
            else if (type === 'fill') filtered = ALL_QUESTIONS.filter(q => q.type === 'fill');
            else if (type === 'correct') filtered = ALL_QUESTIONS.filter(q => q.type === 'correct');

            let html = '';
            filtered.forEach((q, i) => {
                let ansDisplay = q.displayAnswer || q.answer || '';
                if (q.type === 'correct') {
                    ansDisplay = `❌ ${q.errorWord} → ✅ ${q.correctWord}`;
                }
                html += `
                    <div class="bank-item">
                        <span class="btype">${q.typeLabel}</span>
                        <span class="bq">${q.question}</span>
                        <span class="bans">✔ ${ansDisplay}</span>
                    </div>
                `;
            });
            container.innerHTML = html || '<p style="color:#6a8aaa;padding:20px;">暂无题目</p>';
        }

        document.getElementById('bankModal').addEventListener('click', function(e) {
            if (e.target === this) closeBank();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeBank();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'Enter') {
                const fb = document.getElementById('feedback');
                if (!fb.classList.contains('show')) submitAll();
            }
        });

        // ============================================================
        //  5. 初始化
        // ============================================================
        function init() {
            const pool = pickRandomQuestions(TOTAL_PER_ROUND);
            currentPool = pool;
            currentIndex = 0;
            userAnswers = {};
            submitted = {};
            results = {};
            currentScore = null;
            renderQuestion();
            updateStats();
            updateTrendDisplay();
        }

        init();
    </script>

</body>
</html>
