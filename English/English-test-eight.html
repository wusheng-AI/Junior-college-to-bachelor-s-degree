<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 英语数词 · 冠词 专项训练</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: linear-gradient(145deg, #f9f3e8 0%, #fff8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .app-container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 56px;
            padding: 32px 36px 40px;
            box-shadow: 0 30px 60px rgba(180, 120, 70, 0.18), 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 215, 175, 0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 2px dashed #f0d5b8;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 36px;
            background: #ffe4c4;
            width: 56px;
            height: 56px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(210, 150, 80, 0.25);
        }
        .title {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #b45f2b, #d4893b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .title-sub {
            font-size: 14px;
            color: #b58a6a;
            font-weight: 500;
            -webkit-text-fill-color: #b58a6a;
        }
        .stats-badge {
            display: flex;
            align-items: center;
            gap: 18px;
            background: #f9ede4;
            padding: 10px 22px;
            border-radius: 40px;
            box-shadow: inset 0 2px 6px rgba(255, 215, 175, 0.4);
        }
        .stats-badge span {
            font-size: 15px;
            font-weight: 600;
            color: #6b4d34;
        }
        .stats-badge .num {
            color: #b45f2b;
            font-size: 20px;
            margin: 0 4px;
        }
        .history-compare {
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 30px;
            background: #e6d5c2;
            color: #5a3f2b;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .history-compare.up {
            background: #d4edda;
            color: #1e6b3b;
        }
        .history-compare.down {
            background: #f8d7da;
            color: #a13d3d;
        }
        .history-compare.same {
            background: #e2e3e5;
            color: #5a5a5a;
        }
        .progress-wrap {
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .progress-track {
            flex: 1;
            height: 8px;
            background: #ecdccc;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #eab676, #d4893b);
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .progress-text {
            font-size: 15px;
            font-weight: 600;
            color: #7a5d44;
            min-width: 70px;
            text-align: right;
        }
        .question-card {
            background: #ffffff;
            border-radius: 40px;
            padding: 38px 42px 32px;
            margin: 6px 0 24px;
            box-shadow: 0 12px 30px rgba(160, 110, 60, 0.12), 0 4px 12px rgba(0, 0, 0, 0.02);
            border: 1px solid #f5e3d4;
            min-height: 340px;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.3s;
        }
        .question-card:hover {
            box-shadow: 0 18px 40px rgba(160, 110, 60, 0.16);
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .q-type {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: #b58a6a;
            padding: 4px 18px;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }
        .q-type.choice {
            background: #c97d4a;
        }
        .q-type.fill {
            background: #4f8a8b;
        }
        .q-type.correct {
            background: #b14f6b;
        }
        .q-number {
            font-size: 15px;
            font-weight: 600;
            color: #b58a6a;
        }
        .q-text {
            font-size: 22px;
            line-height: 1.7;
            color: #2d1f14;
            font-weight: 500;
            margin-bottom: 24px;
            word-break: break-word;
        }
        /* 下划线占位符 — 只保留字符本身的下划线，不加额外边框 */
        .q-text .blank-indicator {
            display: inline-block;
            min-width: 120px;
            margin: 0 6px;
            padding: 0 4px;
            color: #b45f2b;
            font-weight: 600;
            /* 移除 border-bottom，只靠字符自身下划线 */
            border-bottom: none;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 8px 0 12px;
        }
        .option-btn {
            background: #fcf6f0;
            border: 2px solid #eddccc;
            border-radius: 18px;
            padding: 16px 18px;
            font-size: 17px;
            font-weight: 500;
            color: #3d2c1e;
            cursor: pointer;
            transition: all 0.18s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .option-btn:hover {
            border-color: #d4893b;
            background: #fcf1e6;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(180, 110, 40, 0.10);
        }
        .option-btn.selected {
            border-color: #b45f2b;
            background: #f7e3d3;
            box-shadow: 0 0 0 3px rgba(180, 95, 43, 0.20);
        }
        .option-btn .opt-label {
            font-weight: 700;
            min-width: 28px;
        }
        .option-btn.correct-reveal {
            border-color: #2b7a4b;
            background: #e1f3e9;
        }
        .option-btn.wrong-reveal {
            border-color: #b13d3d;
            background: #f5e1e1;
        }
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 10px 0 8px;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .input-group label {
            font-weight: 600;
            color: #6b4d34;
            font-size: 16px;
            min-width: 80px;
        }
        .input-group input {
            flex: 1;
            min-width: 180px;
            padding: 14px 20px;
            border: 2px solid #eddccc;
            border-radius: 18px;
            font-size: 17px;
            background: #fcf8f4;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            font-weight: 500;
            color: #2d1f14;
        }
        .input-group input:focus {
            border-color: #d4893b;
            box-shadow: 0 0 0 4px rgba(212, 137, 59, 0.15);
            background: #fffdfa;
        }
        .input-group input.correct-input {
            border-color: #2b7a4b;
            background: #f0faf4;
        }
        .input-group input.wrong-input {
            border-color: #b13d3d;
            background: #fdf0f0;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 10px;
        }
        .actions-left, .actions-right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            background: #f0e4d8;
            color: #4d3828;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(100, 70, 40, 0.12);
        }
        .btn:active { transform: translateY(0px); }
        .btn-primary {
            background: #d4893b;
            color: #fff;
            box-shadow: 0 8px 18px rgba(212, 137, 59, 0.30);
        }
        .btn-primary:hover {
            background: #c47a2e;
            box-shadow: 0 12px 26px rgba(212, 137, 59, 0.35);
        }
        .btn-secondary {
            background: #e6d5c2;
            color: #4d3828;
        }
        .btn-secondary:hover { background: #ddc9b2; }
        .btn-outline {
            background: transparent;
            border: 2px solid #d4893b;
            color: #d4893b;
        }
        .btn-outline:hover {
            background: #d4893b;
            color: #fff;
        }
        .result-panel {
            margin-top: 22px;
            padding: 24px 28px;
            border-radius: 30px;
            background: #fcf6f0;
            border: 1px solid #f0dcc8;
            display: none;
            animation: fadeSlide 0.4s ease;
        }
        .result-panel.show { display: block; }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .result-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 24px 40px;
            align-items: center;
        }
        .result-score {
            font-size: 44px;
            font-weight: 700;
            color: #b45f2b;
        }
        .result-score span {
            font-size: 24px;
            font-weight: 500;
            color: #7a5d44;
        }
        .result-detail {
            font-size: 16px;
            color: #4d3828;
        }
        .result-detail strong { color: #b45f2b; }
        .result-advice {
            margin-top: 12px;
            padding: 14px 20px;
            border-radius: 20px;
            background: #f9ede4;
            font-size: 16px;
            color: #3d2c1e;
            border-left: 5px solid #d4893b;
        }
        .result-advice .emoji { font-size: 22px; margin-right: 10px; }
        .error-list {
            margin-top: 16px;
            max-height: 280px;
            overflow-y: auto;
            background: #fffdfa;
            border-radius: 20px;
            padding: 14px 20px;
            border: 1px solid #eddccc;
        }
        .error-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0e4d8;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 15px;
        }
        .error-item:last-child { border-bottom: none; }
        .error-item .e-num {
            font-weight: 700;
            color: #b45f2b;
            min-width: 40px;
        }
        .error-item .e-q { flex: 1; color: #2d1f14; }
        .error-item .e-wrong {
            font-weight: 600;
            color: #b13d3d;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(40, 25, 15, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 30px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fffcf8;
            max-width: 960px;
            width: 100%;
            max-height: 85vh;
            border-radius: 48px;
            padding: 32px 38px;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.30);
            border: 1px solid #f0dcc8;
            animation: fadeSlide 0.3s ease;
        }
        .modal-box h2 {
            font-size: 28px;
            color: #b45f2b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .modal-box .close-btn {
            margin-left: auto;
            background: #f0e4d8;
            border: none;
            border-radius: 40px;
            padding: 8px 22px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #4d3828;
            transition: background 0.2s;
        }
        .modal-box .close-btn:hover { background: #e0cfbf; }
        .modal-question {
            padding: 14px 0;
            border-bottom: 1px solid #f0e4d8;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            font-size: 15px;
        }
        .modal-question .mq-num {
            font-weight: 700;
            color: #b58a6a;
            min-width: 48px;
        }
        .modal-question .mq-text { flex: 1; color: #2d1f14; }
        .modal-question .mq-answer {
            font-weight: 600;
            color: #2b7a4b;
            background: #e1f3e9;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 14px;
            white-space: nowrap;
        }
        .modal-question .mq-type {
            font-size: 12px;
            background: #eddccc;
            padding: 2px 12px;
            border-radius: 30px;
            color: #5a3f2b;
        }
        .modal-box::-webkit-scrollbar,
        .error-list::-webkit-scrollbar {
            width: 6px;
        }
        .modal-box::-webkit-scrollbar-track,
        .error-list::-webkit-scrollbar-track {
            background: #f5ede6;
            border-radius: 10px;
        }
        .modal-box::-webkit-scrollbar-thumb,
        .error-list::-webkit-scrollbar-thumb {
            background: #dccbbc;
            border-radius: 10px;
        }
        @media (max-width: 700px) {
            .app-container { padding: 20px 18px; border-radius: 32px; }
            .question-card { padding: 24px 20px 22px; border-radius: 28px; }
            .options-grid { grid-template-columns: 1fr; }
            .q-text { font-size: 18px; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .stats-badge { width: 100%; justify-content: space-between; padding: 10px 16px; }
            .actions { flex-direction: column; align-items: stretch; }
            .actions-left, .actions-right { justify-content: center; }
            .btn { padding: 10px 18px; font-size: 14px; }
            .modal-box { padding: 20px 16px; }
            .result-score { font-size: 32px; }
            .input-group { flex-direction: column; align-items: stretch; }
            .input-group label { min-width: unset; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <header class="header">
        <div class="logo-area">
            <div class="logo-icon">📘</div>
            <div>
                <div class="title">Numeral · Article</div>
                <div class="title-sub">数词 · 冠词 专项训练</div>
            </div>
        </div>
        <div class="stats-badge">
            <span>📊 正确率 <span class="num" id="rateDisplay">0%</span></span>
            <span>📝 <span class="num" id="doneDisplay">0</span>/<span id="totalDisplay">30</span></span>
            <span id="historyBadge" class="history-compare">📈 未提交</span>
        </div>
    </header>

    <div class="progress-wrap">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 30</div>
    </div>

    <div class="question-card" id="questionCard">
        <div class="q-header">
            <span class="q-type" id="qTypeLabel">选择题</span>
            <span class="q-number" id="qNumberLabel">第 1 / 30 题</span>
        </div>
        <div class="q-text" id="qText">加载题目中...</div>
        <div id="qInteraction"></div>
    </div>

    <div class="actions">
        <div class="actions-left">
            <button class="btn btn-secondary" id="prevBtn">◀ 上一题</button>
            <button class="btn btn-secondary" id="nextBtn">下一题 ▶</button>
            <button class="btn btn-outline" id="randomBtn">🎲 重新抽题</button>
        </div>
        <div class="actions-right">
            <button class="btn btn-primary" id="submitBtn">✅ 提交判分</button>
            <button class="btn btn-secondary" id="viewErrorsBtn" style="display:none;">❌ 查看错题</button>
            <button class="btn btn-secondary" id="viewBankBtn">📖 题库</button>
        </div>
    </div>

    <div class="result-panel" id="resultPanel">
        <div class="result-stats">
            <div class="result-score" id="resultScore">0%</div>
            <div class="result-detail">
                正确 <strong id="resultCorrect">0</strong> 题，
                错误 <strong id="resultWrong">0</strong> 题，
                未答 <strong id="resultSkipped">0</strong> 题
            </div>
        </div>
        <div class="result-advice" id="resultAdvice">💡 继续加油！</div>
        <div id="errorListContainer" style="display:none;">
            <div class="error-list" id="errorList"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="bankModal">
    <div class="modal-box">
        <h2>
            📚 完整题库
            <button class="close-btn" id="closeBankBtn">✕ 关闭</button>
        </h2>
        <div id="bankContent"></div>
    </div>
</div>

<script>
    // ============================================================
    //  1. 全部 100 道题（40 选择 + 30 填空 + 30 改错）
    // ============================================================
    const ALL_QUESTIONS = [];

    // ---------- 选择题 40 道 ----------
    const choiceData = [
        { q: '______ of the land in this area is covered with trees.', opts: ['A. Two third', 'B. Two thirds',
                'C. Second three', 'D. Two three'
            ], ans: 1, exp: '分数表达：分子用基数词，分母用序数词，分子＞1 分母加 s。' },
        { q: 'The old man is in his ______, but he still looks energetic.', opts: ['A. seventy', 'B. seventies',
                'C. seventieth', "D. seventy's"
            ], ans: 1, exp: 'in one\'s + 整十复数 表示“在某人几十多岁时”。' },
        { q: 'This famous bridge was built in ______.', opts: ['A. 1980s', 'B. the 1980s', "C. 1980's",
                'D. the 1980'
            ], ans: 1, exp: '表示“在……年代”用 in the + 基数词复数。' },
        { q: 'You should drink water every ______ while running.', opts: ['A. few minutes', 'B. few minute',
                'C. a few minutes', 'D. few-minutes'
            ], ans: 0, exp: 'every + 基数词 + 名词复数，few minutes 表示“每隔几分钟”。' },
        { q: 'We need a ______ rest after the long journey.', opts: ['A. ten-minutes', 'B. ten minute',
                'C. ten-minute', 'D. ten minutes'
            ], ans: 2, exp: '连字符连接数词和名词作定语，名词用单数。' },
        { q: '______ birds are flying to the south for winter.', opts: ['A. Thousand of', 'B. Thousands of',
                'C. Two thousands', 'D. Thousand'
            ], ans: 1, exp: '不确定数字用 thousands of，确数不加 s。' },
        { q: 'The meeting will be held in ______.', opts: ['A. the 2020', 'B. the 2020s', 'C. 2020s',
                "D. 2020's"
            ], ans: 1, exp: '年代前加定冠词 the，且用复数形式。' },
        { q: 'My grandmother is in her ______, but she is very healthy.', opts: ['A. eighties', 'B. eighty',
                'C. eightieth', 'D. eightys'
            ], ans: 0, exp: 'in one\'s eighties 表示“在她八十多岁时”。' },
        { q: 'The teacher gives a prize to every ______ student in the competition.', opts: ['A. five', 'B. fifth',
                'C. fives', 'D. fifths'
            ], ans: 1, exp: 'every + 序数词 + 名词单数，表示“每第……个”。' },
        { q: 'He was the ______ to arrive at the station.', opts: ['A. one', 'B. first', 'C. firstly', 'D. once'],
            ans: 1, exp: '序数词前加 the 表示顺序。' },
        { q: 'December is the ______ month of the year.', opts: ['A. twelve', 'B. twelfth', 'C. twelveth',
                'D. twelve-th'
            ], ans: 1, exp: 'twelve 的序数词为 twelfth，注意拼写。' },
        { q: 'Three ______ of the water in the lake is polluted.', opts: ['A. fourth', 'B. fourths', 'C. four',
                'D. for'
            ], ans: 1, exp: '分子 three ＞1，分母 fourth 加 s。' },
        { q: 'About ______ of the employees are from the north.', opts: ['A. two-third', 'B. two-thirds',
                'C. two threes', 'D. second-thirds'
            ], ans: 1, exp: '分子＞1 分母加 s。' },
        { q: 'The price has increased by ______.', opts: ['A. 20 percents', 'B. 20 percent', 'C. 20-percent',
                'D. 20th percent'
            ], ans: 1, exp: 'percent 无复数形式。' },
        { q: 'She is ______ honest girl and never tells lies.', opts: ['A. a', 'B. an', 'C. the', 'D. /'], ans: 1,
            exp: 'honest 以元音音素 /ɒ/ 开头，用 an。' },
        { q: 'There is ______ “u” in the word “umbrella”.', opts: ['A. a', 'B. an', 'C. the', 'D. /'], ans: 0,
            exp: '字母 u 发音 /juː/，辅音音素开头，用 a。' },
        { q: 'He likes playing ______ guitar in his free time.', opts: ['A. a', 'B. an', 'C. the', 'D. /'], ans: 2,
            exp: '乐器名词前用定冠词 the。' },
        { q: 'The Whites are going to have ______ dinner at a restaurant.', opts: ['A. a', 'B. an', 'C. the',
                'D. /'
            ], ans: 3, exp: '三餐名词前一般不加冠词。' },
        { q: 'We often play ______ basketball after school.', opts: ['A. a', 'B. an', 'C. the', 'D. /'], ans: 3,

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function pickRandomQuestions(n) {
        const shuffled = shuffleArray([...ALL_QUESTIONS]);
        return shuffled.slice(0, n);
    }

    function initQuestions() {
        currentQuestions = pickRandomQuestions(TOTAL_SELECT);
        userAnswers = currentQuestions.map(q => {
            if (q.type === 'choice') return { selected: null };
            else if (q.type === 'fill') return { value: '' };
            else if (q.type === 'correct') return { wrongVal: '', correctVal: '' };
            return {};
        });
        currentIndex = 0;
        submitted = false;
        results = null;
        viewErrorsBtn.style.display = 'none';
        resultPanel.classList.remove('show');
        errorListContainer.style.display = 'none';
        renderQuestion();
        updateProgressAndStats();
        updateHistoryBadge();
    }

    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        if (!q) return;
        const idx = currentIndex + 1;
        const total = currentQuestions.length;
        qNumberLabel.textContent = `第 ${idx} / ${total} 题`;

        if (q.type === 'choice') {
            qTypeLabel.textContent = '选择题';
            qTypeLabel.className = 'q-type choice';
        } else if (q.type === 'fill') {
            qTypeLabel.textContent = '语法填空';
            qTypeLabel.className = 'q-type fill';
        } else if (q.type === 'correct') {
            qTypeLabel.textContent = '改错题';
            qTypeLabel.className = 'q-type correct';
        }

        // 显示题文：去掉括号提示，保留 ______ 并替换为带下划线占位符（无额外边框）
        let displayText = q.q;
        displayText = displayText.replace(/\([^)]*\)/g, '');
        displayText = displayText.replace(/______/g, '<span class="blank-indicator">______</span>');
        qText.innerHTML = displayText;

        renderInteraction(q);
        if (submitted) {
            showReveal();
        }
        updateProgressAndStats();
    }

    function renderInteraction(q) {
        const container = qInteraction;
        container.innerHTML = '';
        const ans = userAnswers[currentIndex];

        if (q.type === 'choice') {
            const grid = document.createElement('div');
            grid.className = 'options-grid';
            const labels = ['A', 'B', 'C', 'D'];
            q.opts.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (ans.selected === i) btn.classList.add('selected');
                btn.innerHTML = `<span class="opt-label">${labels[i]}.</span> ${opt.substring(3)}`;
                btn.dataset.idx = i;
                btn.addEventListener('click', () => {
                    if (submitted) return;
                    userAnswers[currentIndex].selected = i;
                    renderQuestion();
                });
                grid.appendChild(btn);
            });
            container.appendChild(grid);
        } else if (q.type === 'fill') {
            const area = document.createElement('div');
            area.className = 'input-area';
            const group = document.createElement('div');
            group.className = 'input-group';
            const label = document.createElement('label');
            label.textContent = '答案：';
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = '输入答案...';
            input.value = ans.value || '';
            input.addEventListener('input', (e) => {
                if (submitted) return;
                userAnswers[currentIndex].value = e.target.value.trim();
            });
            group.appendChild(label);
            group.appendChild(input);
            area.appendChild(group);
            container.appendChild(area);
        } else if (q.type === 'correct') {
            const area = document.createElement('div');
            area.className = 'input-area';
            const g1 = document.createElement('div');
            g1.className = 'input-group';
            const l1 = document.createElement('label');
            l1.textContent = '❌ 错误：';
            const inp1 = document.createElement('input');
            inp1.type = 'text';
            inp1.placeholder = '填写错误部分...';
            inp1.value = ans.wrongVal || '';
            inp1.addEventListener('input', (e) => {
                if (submitted) return;
                userAnswers[currentIndex].wrongVal = e.target.value.trim();
            });
            g1.appendChild(l1);
            g1.appendChild(inp1);
            const g2 = document.createElement('div');
            g2.className = 'input-group';
            const l2 = document.createElement('label');
            l2.textContent = '✅ 正确：';
            const inp2 = document.createElement('input');
            inp2.type = 'text';
            inp2.placeholder = '填写正确部分...';
            inp2.value = ans.correctVal || '';
            inp2.addEventListener('input', (e) => {
                if (submitted) return;
                userAnswers[currentIndex].correctVal = e.target.value.trim();
            });
            g2.appendChild(l2);
            g2.appendChild(inp2);
            area.appendChild(g1);
            area.appendChild(g2);
            container.appendChild(area);
        }
    }

    function showReveal() {
        const q = currentQuestions[currentIndex];
        const ans = userAnswers[currentIndex];
        if (!q || !results) return;
        if (q.type === 'choice') {
            const btns = qInteraction.querySelectorAll('.option-btn');
            const correctIdx = q.ans;
            const userIdx = ans.selected;
            btns.forEach((btn, i) => {
                btn.classList.remove('selected', 'correct-reveal', 'wrong-reveal');
                if (i === correctIdx) btn.classList.add('correct-reveal');
                if (userIdx !== null && i === userIdx && i !== correctIdx) btn.classList.add('wrong-reveal');
                if (userIdx !== null && i === userIdx) btn.classList.add('selected');
            });
        } else if (q.type === 'fill') {
            const inputs = qInteraction.querySelectorAll('input');
            if (inputs.length) {
                const correctAns = q.ans;
                const userVal = ans.value || '';
                inputs[0].classList.remove('correct-input', 'wrong-input');
                if (userVal.toLowerCase() === correctAns.toLowerCase()) {
                    inputs[0].classList.add('correct-input');
                } else if (userVal !== '') {
                    inputs[0].classList.add('wrong-input');
                }
                inputs[0].placeholder = `正确答案：${correctAns}`;
            }
        } else if (q.type === 'correct') {
            const inputs = qInteraction.querySelectorAll('input');
            if (inputs.length >= 2) {
                const correctWrong = q.wrong;
                const correctCorrect = q.correct;
                const userWrong = ans.wrongVal || '';
                const userCorrect = ans.correctVal || '';
                inputs[0].classList.remove('correct-input', 'wrong-input');
                inputs[1].classList.remove('correct-input', 'wrong-input');
                if (userWrong.toLowerCase() === correctWrong.toLowerCase()) {
                    inputs[0].classList.add('correct-input');
                } else if (userWrong !== '') {
                    inputs[0].classList.add('wrong-input');
                }
                if (userCorrect.toLowerCase() === correctCorrect.toLowerCase()) {
                    inputs[1].classList.add('correct-input');
                } else if (userCorrect !== '') {
                    inputs[1].classList.add('wrong-input');
                }
                inputs[0].placeholder = `应为：${correctWrong}`;
                inputs[1].placeholder = `应为：${correctCorrect}`;
            }
        }
    }

    function updateProgressAndStats() {
        const total = currentQuestions.length;
        const done = userAnswers.filter((a, i) => {
            const q = currentQuestions[i];
            if (q.type === 'choice') return a.selected !== null && a.selected !== undefined;
            else if (q.type === 'fill') return a.value && a.value.trim() !== '';
            else if (q.type === 'correct') return (a.wrongVal && a.wrongVal.trim() !== '') || (a.correctVal && a
                .correctVal.trim() !== '');
            return false;
        }).length;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;
        progressFill.style.width = `${pct}%`;
        progressText.textContent = `${done} / ${total}`;
        doneDisplay.textContent = done;
        if (submitted && results) {
            rateDisplay.textContent = `${results.rate}%`;
        } else {
            rateDisplay.textContent = '—';
        }
    }

    function updateHistoryBadge() {
        if (historyScore === null) {
            historyBadge.textContent = '📊 暂无历史';
            historyBadge.className = 'history-compare';
            return;
        }
        if (!submitted || results === null) {
            historyBadge.textContent = `📈 上次 ${historyScore}%`;
            historyBadge.className = 'history-compare';
            return;
        }
        const current = results.rate;
        if (current > historyScore) {
            historyBadge.textContent = `📈 上升 +${(current - historyScore).toFixed(1)}% (上次 ${historyScore}%)`;
            historyBadge.className = 'history-compare up';
        } else if (current < historyScore) {
            historyBadge.textContent = `📉 下降 ${(historyScore - current).toFixed(1)}% (上次 ${historyScore}%)`;
            historyBadge.className = 'history-compare down';
        } else {
            historyBadge.textContent = `➖ 持平 (上次 ${historyScore}%)`;
            historyBadge.className = 'history-compare same';
        }
    }

    // ============================================================
    //  4. 提交判分
    // ============================================================
    function submitAndGrade() {
        let correct = 0,
            wrong = 0,
            skipped = 0;
        const errors = [];

        currentQuestions.forEach((q, idx) => {
            const ans = userAnswers[idx];
            if (q.type === 'choice') {
                if (ans.selected === null || ans.selected === undefined) {
                    skipped++;
                    return;
                }
                if (ans.selected === q.ans) {
                    correct++;
                } else {
                    wrong++;
                    errors.push({ index: idx, q: q, userAns: ans.selected, correctAns: q.ans, type: 'choice' });
                }
            } else if (q.type === 'fill') {
                const val = (ans.value || '').trim();
                if (val === '') {
                    skipped++;
                    return;
                }
                if (val.toLowerCase() === q.ans.toLowerCase()) {
                    correct++;
                } else {
                    wrong++;
                    errors.push({ index: idx, q: q, userAns: val, correctAns: q.ans, type: 'fill' });
                }
            } else if (q.type === 'correct') {
                const w = (ans.wrongVal || '').trim();
                const c = (ans.correctVal || '').trim();
                if (w === '' && c === '') {
                    skipped++;
                    return;
                }
                if (w.toLowerCase() === q.wrong.toLowerCase() && c.toLowerCase() === q.correct.toLowerCase()) {
                    correct++;
                } else {
                    wrong++;
                    errors.push({ index: idx, q: q, userAns: `${w} → ${c}`, correctAns: `${q.wrong} → ${q.correct}`,
                        type: 'correct' });
                }
            }
        });

        const total = currentQuestions.length;
        const rate = total > 0 ? Math.round((correct / total) * 100) : 0;
        results = { correct, wrong, skipped, rate, errors };

        historyScore = rate;
        localStorage.setItem('engNumHistoryScore', String(rate));

        submitted = true;
        viewErrorsBtn.style.display = errors.length > 0 ? 'inline-flex' : 'none';

        resultPanel.classList.add('show');
        resultScore.textContent = `${rate}%`;
        resultCorrect.textContent = correct;
        resultWrong.textContent = wrong;
        resultSkipped.textContent = skipped;

        let advice = '';
        if (rate === 100) advice = '🎉 完美！你对数词和冠词的掌握非常扎实！继续保持！';
        else if (rate >= 80) advice = '🌟 优秀！你已掌握大部分知识点，再巩固一下细节就更棒了！';
        else if (rate >= 60) advice = '📖 不错！建议重点复习冠词用法和分数表达，多做练习。';
        else if (rate >= 40) advice = '💪 加油！建议系统复习数词和冠词的基本规则，从基础题开始。';
        else advice = '📚 别灰心！建议重新学习数词和冠词章节，结合例句理解记忆。';
        resultAdvice.innerHTML = `<span class="emoji">📌</span> ${advice}`;

        if (errors.length > 0) {
            errorListContainer.style.display = 'block';
            errorList.innerHTML = '';
            errors.forEach((e, i) => {
                const div = document.createElement('div');
                div.className = 'error-item';
                let detail = '';
                if (e.type === 'choice') {
                    const opts = e.q.opts;
                    const userLabel = e.userAns !== null ? opts[e.userAns] : '未选';
                    const correctLabel = opts[e.correctAns];
                    detail = `你的答案：${userLabel}  →  正确答案：${correctLabel}`;
                } else if (e.type === 'fill') {
                    detail = `你的答案：${e.userAns || '未填'}  →  正确答案：${e.correctAns}`;
                } else if (e.type === 'correct') {
                    detail = `你的答案：${e.userAns}  →  正确答案：${e.correctAns}`;
                }
                div.innerHTML = `
                    <span class="e-num">#${i+1}</span>
                    <span class="e-q">${e.q.q.length > 60 ? e.q.q.substring(0,60)+'…' : e.q.q}</span>
                    <span class="e-wrong">${detail}</span>
                `;
                errorList.appendChild(div);
            });
        } else {
            errorListContainer.style.display = 'none';
        }

        renderQuestion();
        updateProgressAndStats();
        updateHistoryBadge();
        rateDisplay.textContent = `${rate}%`;
    }

    // ============================================================
    //  5. 查看错题、题库等
    // ============================================================
    function showErrors() {
        if (!results || results.errors.length === 0) return;
        const firstErr = results.errors[0];
        currentIndex = firstErr.index;
        renderQuestion();
        document.getElementById('questionCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function renderBank() {
        bankContent.innerHTML = '';
        const types = [
            { key: 'choice', label: '📝 选择题 (40)' },
            { key: 'fill', label: '✏️ 语法填空 (30)' },
            { key: 'correct', label: '🔧 改错题 (30)' }
        ];
        const grouped = {};
        ALL_QUESTIONS.forEach(q => {
            if (!grouped[q.type]) grouped[q.type] = [];
            grouped[q.type].push(q);
        });
        types.forEach(t => {
            const items = grouped[t.key] || [];
            const title = document.createElement('h3');
            title.style.cssText =
                'margin: 18px 0 10px; font-size: 20px; color: #b45f2b; border-bottom: 2px solid #f0dcc8; padding-bottom: 6px;';
            title.textContent = t.label;
            bankContent.appendChild(title);
            items.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'modal-question';
                let ansText = '';
                if (q.type === 'choice') {
                    ansText = q.opts[q.ans];
                } else if (q.type === 'fill') {
                    ansText = q.ans || '(零冠词)';
                } else if (q.type === 'correct') {
                    ansText = `${q.wrong} → ${q.correct}`;
                }
                div.innerHTML = `
                    <span class="mq-num">#${q.id}</span>
                    <span class="mq-text">${q.q.length > 50 ? q.q.substring(0,50)+'…' : q.q}</span>
                    <span class="mq-answer">✅ ${ansText}</span>
                    <span class="mq-type">${q.type === 'choice' ? '选择' : q.type === 'fill' ? '填空' : '改错'}</span>
                `;
                bankContent.appendChild(div);
            });
        });
    }

    // ===== 事件绑定 =====
    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    });
    nextBtn.addEventListener('click', () => {
        if (currentIndex < currentQuestions.length - 1) { currentIndex++; renderQuestion(); }
    });
    randomBtn.addEventListener('click', () => {
        if (confirm('重新抽题将清空当前进度，确定吗？')) {
            initQuestions();
            resultPanel.classList.remove('show');
            viewErrorsBtn.style.display = 'none';
            errorListContainer.style.display = 'none';
            rateDisplay.textContent = '—';
        }
    });
    submitBtn.addEventListener('click', submitAndGrade);
    viewErrorsBtn.addEventListener('click', showErrors);
    viewBankBtn.addEventListener('click', () => {
        renderBank();
        bankModal.classList.add('open');
    });
    closeBankBtn.addEventListener('click', () => {
        bankModal.classList.remove('open');
    });
    bankModal.addEventListener('click', (e) => {
        if (e.target === bankModal) bankModal.classList.remove('open');
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && !bankModal.classList.contains('open')) prevBtn.click();
        if (e.key === 'ArrowRight' && !bankModal.classList.contains('open')) nextBtn.click();
        if (e.key === 'Enter' && !bankModal.classList.contains('open')) {
            if (e.target.tagName !== 'INPUT') submitBtn.click();
        }
        if (e.key === 'Escape') bankModal.classList.remove('open');
    });

    // ===== 启动 =====
    initQuestions();
    renderBank();
    console.log('✅ 下划线占位符已移除额外边框，仅保留字符自身下划线。');
</script>
</body>
