<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📝 专升本专项测试 · 合集</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #f0f7ff 0%, #e6f0fa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            color: #1a2639;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 专升本主题装饰 ===== */
        body::before {
            content: '📚 ✨ 🎯 📖 ✏️ 🏆';
            position: fixed;
            top: -5%;
            right: -2%;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 14vw;
            color: rgba(30, 80, 180, 0.04);
            pointer-events: none;
            transform: rotate(4deg);
            letter-spacing: 20px;
            white-space: nowrap;
            z-index: 0;
            line-height: 1;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -15%;
            left: -5%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(30, 80, 180, 0.05), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* 网格装饰（笔记本线条） */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(30, 80, 180, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 80, 180, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1a4b8c 0%, #2a6bb0 40%, #4a8fd4 70%, #7bb3e6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            display: inline-block;
            position: relative;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #2a6bb0, #4a8fd4, #7bb3e6, transparent);
            border-radius: 4px;
        }

        .header .subtitle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .header .subtitle span {
            font-size: 1.05rem;
            color: rgba(26, 38, 57, 0.45);
            letter-spacing: 4px;
            font-weight: 400;
            text-transform: uppercase;
        }

        .header .subtitle .highlight {
            color: #1a4b8c;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            background: rgba(26, 75, 140, 0.08);
            padding: 2px 16px;
            border-radius: 30px;
            letter-spacing: 1px;
            font-size: 0.95rem;
            border: 1px solid rgba(26, 75, 140, 0.10);
        }

        .header .subtitle .badge-new {
            background: linear-gradient(135deg, #f5a623, #f7c948);
            color: #1a2639;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 2px 12px rgba(245, 166, 35, 0.20);
        }

        /* ===== 卡片网格 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(26, 75, 140, 0.08);
            border-radius: 28px;
            padding: 36px 28px 32px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow:
                0 4px 24px rgba(26, 75, 140, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: radial-gradient(circle at 30% 40%, rgba(26, 75, 140, 0.05), transparent 60%);
            pointer-events: none;
            transition: 0.6s;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #2a6bb0, #4a8fd4, #7bb3e6, transparent);
            opacity: 0;
            transition: 0.4s;
            border-radius: 28px 28px 0 0;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(26, 75, 140, 0.18);
            box-shadow:
                0 20px 60px rgba(26, 75, 140, 0.08),
                0 8px 28px rgba(0, 0, 0, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.98);
            background: rgba(255, 255, 255, 0.96);
        }

        .card:hover::after {
            opacity: 1;
        }

        .card:hover::before {
            transform: scale(1.3);
        }

        /* 卡片编号标签 */
        .card .card-number {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(26, 75, 140, 0.12);
            letter-spacing: 1px;
            font-family: 'Inter', sans-serif;
        }

        /* 卡片图标 */
        .card .icon {
            font-size: 3.8rem;
            margin-bottom: 14px;
            display: inline-block;
            filter: drop-shadow(0 2px 8px rgba(26, 75, 140, 0.06));
            transition: 0.3s;
        }

        .card:hover .icon {
            transform: scale(1.04) rotate(-2deg);
        }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #1a2639;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .card .badge {
            display: inline-block;
            background: rgba(26, 75, 140, 0.06);
            border: 1px solid rgba(26, 75, 140, 0.08);
            border-radius: 40px;
            padding: 4px 18px;
            font-size: 0.72rem;
            color: #1a4b8c;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .card .badge .num {
            color: #f5a623;
            font-weight: 800;
        }

        .card .desc {
            font-size: 0.95rem;
            color: rgba(26, 38, 57, 0.50);
            line-height: 1.7;
            font-weight: 400;
        }

        .card .desc strong {
            color: #1a2639;
            font-weight: 600;
        }

        .card .desc .level-tag {
            display: inline-block;
            background: linear-gradient(135deg, #f5a623, #f7c948);
            color: #1a2639;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 30px;
            margin-top: 4px;
        }

        .card .enter-btn {
            margin-top: 20px;
            padding: 10px 34px;
            border-radius: 50px;
            background: linear-gradient(135deg, #1a4b8c, #2a6bb0);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border: none;
            transition: all 0.35s ease;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(26, 75, 140, 0.15);
            display: inline-block;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .card .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: 0.5s;
        }

        .card:hover .enter-btn {
            background: linear-gradient(135deg, #f5a623, #f7c948);
            color: #1a2639;
            box-shadow: 0 8px 32px rgba(245, 166, 35, 0.25);
            transform: scale(1.04);
        }

        .card:hover .enter-btn::before {
            left: 100%;
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 28px;
            border-top: 1px solid rgba(26, 75, 140, 0.06);
            color: rgba(26, 38, 57, 0.20);
            font-size: 0.75rem;
            letter-spacing: 4px;
            font-family: 'Inter', sans-serif;
        }

        .footer .footer-highlight {
            color: #1a4b8c;
            font-weight: 600;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .header h1 {
                font-size: 2.6rem;
            }
            .header h1::after {
                width: 60px;
            }
            .header .subtitle span {
                font-size: 0.85rem;
                letter-spacing: 2px;
            }
            .card-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .card {
                padding: 28px 20px;
            }
            body::before {
                font-size: 20vw;
                top: -4%;
                right: -6%;
                letter-spacing: 12px;
            }
            .footer {
                font-size: 0.65rem;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }
            .header .subtitle span {
                font-size: 0.75rem;
                letter-spacing: 1px;
            }
            .header .subtitle .highlight {
                font-size: 0.8rem;
                padding: 2px 12px;
            }
            .card .icon {
                font-size: 3rem;
            }
            .card h2 {
                font-size: 1.4rem;
            }
            .card .card-number {
                font-size: 0.55rem;
                top: 12px;
                right: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 网格背景 -->
    <div class="grid-bg"></div>

    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>✦ 专升本测试 · 合集 ✦</h1>
            <div class="subtitle">

            </div>
        </header>

        <!-- 卡片网格 -->
        <div class="card-grid">

            <a href="Core-vocabulary/Core-vocabulary.html" class="card" target="_blank">
                <span class="card-number">#01</span>
                <div class="icon">📝</div>
                <h2>核心词汇听写</h2>
                <div class="badge"><span class="num">150</span> 道题 · 随机 <span class="num">20</span></div>
                <div class="desc">
                    <strong>基础专项</strong><br />
                    常用词语 · 拼写训练

                </div>
                <span class="enter-btn">🚀 进入练习</span>
            </a>

            <a href="English/English-test.html" class="card" target="_blank">
                <span class="card-number">#02</span>
                <div class="icon">📝</div>
                <h2>英语语法专项</h2>
                <div class="badge"><span class="num">120</span> 道题 · 随机 <span class="num">15</span></div>
                <div class="desc">
                    <strong>基础专项</strong><br />
                    常用语法 · 训练
                    <div class="level-tag">⭐ 进阶</div>
                </div>
                <span class="enter-btn">🚀 进入练习</span>
            </a>

            <a href="Math/Math-test.html" class="card" target="_blank">
                <span class="card-number">#03</span>
                <div class="icon">📝</div>
                <h2>高数专项</h2>
                <div class="badge"><span class="num">150</span> 道题 · 随机 <span class="num">20</span></div>
                <div class="desc">
                    <strong>高数专项</strong><br />
                    常见题型 · 训练
                    <div class="level-tag">⭐ 强化</div>
                </div>
                <span class="enter-btn">🚀 进入练习</span>
            </a>


            <a href="Basic-Vocabulary/Basic-Vocabulary.html" class="card" target="_blank">
                <span class="card-number">#01</span>
                <div class="icon">📝</div>
                <h2>基础词汇听写</h2>
                <div class="badge"><span class="num">150</span> 道题 · 随机 <span class="num">20</span></div>
                <div class="desc">
                    <strong>基础专项</strong><br />
                    常用词语 · 拼写训练
                    <div class="level-tag">⭐ 入门</div>
                </div>
                <span class="enter-btn">🚀 进入练习</span>
            </a>
        </div>

        <!-- 底部 -->
        <div class="footer">
            <span style="display:inline-block; margin:0 12px;">·</span>
            <span class="footer-highlight">专升本 · 上岸必备</span>
        </div>
    </div>
</body>
</html>
