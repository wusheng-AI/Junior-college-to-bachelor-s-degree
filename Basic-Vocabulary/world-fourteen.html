<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语听写 · 汉译英</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,#eef4ff 0%,#fdf2f8 45%,#ecfeff 100%);
    background-attachment:fixed;
    color:#1e293b;
    display:flex;flex-direction:column;align-items:center;
    padding:26px 16px 52px;
    overflow-x:hidden;
  }
  /* ===== 背景装饰字母 ===== */
  .bg-letters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bg-letters span{
    position:absolute;font-family:Georgia,"Times New Roman",serif;
    font-weight:800;color:#4f46e5;user-select:none;
    animation:drift ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1);}
    50%{transform:translateY(-30px) rotate(10deg) scale(1.08);}
  }

  .app{position:relative;z-index:1;width:100%;max-width:700px;}

  /* ===== 顶栏 ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{
    width:54px;height:54px;border-radius:17px;flex:0 0 auto;
    background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#ec4899);
    color:#fff;font-size:27px;font-weight:800;font-family:Georgia,serif;
    display:grid;place-items:center;
    box-shadow:0 12px 26px -8px rgba(99,102,241,.75);
  }
  .brand h1{font-size:19px;margin:0;letter-spacing:.5px;color:#1e293b;}
  .brand p{margin:3px 0 0;font-size:11.5px;color:#8b93a7;letter-spacing:.9px;text-transform:uppercase;}
  .top-stats{display:flex;gap:10px;}
  .stat{
    background:rgba(255,255,255,.9);border:1px solid #e6ebf5;border-radius:15px;
    padding:8px 14px;text-align:center;min-width:80px;
    box-shadow:0 6px 18px -8px rgba(79,70,229,.35);
  }
  .stat-num{display:block;font-size:17px;font-weight:800;color:#4f46e5;line-height:1.2;}
  .stat-label{display:block;font-size:10.5px;color:#9aa4b8;margin-top:3px;letter-spacing:.5px;}

  /* ===== 主卡片 ===== */
  .card{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:28px;
    padding:26px 26px 22px;
    box-shadow:0 30px 70px -26px rgba(79,70,229,.55), 0 8px 22px rgba(15,23,42,.06);
  }

  .progress-track{height:9px;border-radius:99px;background:#eef1fb;overflow:hidden;margin-bottom:18px;}
  .progress-fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#6366f1,#a855f7 55%,#ec4899);
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  .qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .qindex{font-size:12.5px;font-weight:800;color:#7c83f5;letter-spacing:.8px;}
  .qpos{
    font-size:11.5px;font-weight:800;color:#b45309;background:#fef3c7;
    border:1px solid #fde68a;padding:4px 11px;border-radius:99px;letter-spacing:.3px;
  }

  .prompt{
    font-size:36px;font-weight:900;line-height:1.32;letter-spacing:1.5px;
    text-align:center;margin:20px 0 4px;min-height:76px;
    display:flex;align-items:center;justify-content:center;word-break:break-word;
    background:linear-gradient(135deg,#312e81,#7c3aed 55%,#db2777);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .input-wrap{position:relative;margin:16px 0 4px;}
  #answerInput{
    width:100%;font-size:23px;font-weight:700;font-family:inherit;
    padding:16px 20px;border-radius:18px;border:2px solid #e3e9f4;
    background:#fff;outline:none;color:#1e293b;letter-spacing:.6px;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  #answerInput::placeholder{color:#b6c0d4;font-weight:600;font-size:17px;}
  #answerInput:focus{border-color:#818cf8;box-shadow:0 0 0 5px rgba(129,140,248,.16);}
  #answerInput.correct{border-color:#34d399;background:#f0fdf4;color:#15803d;}
  #answerInput.wrong{border-color:#fb7185;background:#fff1f2;color:#be123c;}
  #answerInput:disabled{cursor:default;}

  .feedback{font-size:14px;font-weight:800;min-height:22px;margin:8px 0 2px;text-align:center;letter-spacing:.3px;}
  .feedback.ok{color:#16a34a;}
  .feedback.bad{color:#e11d48;}

  .nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:12px;}

  .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0 2px;}
  .dot{
    width:23px;height:23px;border-radius:8px;font-size:10.5px;font-weight:800;
    display:grid;place-items:center;cursor:pointer;
    border:1px solid #e6ebf5;background:#f8fafc;color:#9aa4b8;
    transition:.18s;font-family:inherit;
  }
  .dot:hover{transform:translateY(-2px);border-color:#c7d2fe;}
  .dot.answered{background:#e0e7ff;border-color:#c7d2fe;color:#4f46e5;}
  .dot.correct{background:#dcfce7;border-color:#86efac;color:#15803d;}
  .dot.wrong{background:#ffe4e6;border-color:#fda4af;color:#be123c;}
  .dot.current{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:#6366f1;color:#fff;
    box-shadow:0 6px 14px -4px rgba(99,102,241,.9);transform:translateY(-2px) scale(1.06);
  }

  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;
    padding-top:18px;border-top:1px dashed #e6ebf5;}

  .btn{
    font-family:inherit;font-size:13.5px;font-weight:800;letter-spacing:.3px;
    padding:11px 18px;border-radius:14px;border:1.5px solid #e6ebf5;
    background:#fff;color:#5b6579;cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .btn:hover{transform:translateY(-2px);border-color:#c7d2fe;color:#4f46e5;
    box-shadow:0 10px 22px -10px rgba(79,70,229,.7);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
  .btn.primary{
    background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7);
    color:#fff;border:none;
    box-shadow:0 14px 28px -12px rgba(99,102,241,1);
  }
  .btn.primary:hover{color:#fff;box-shadow:0 18px 32px -12px rgba(99,102,241,1);}
  .btn.primary.done{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 14px 28px -12px rgba(34,197,94,.9);}

  .hint{margin:14px 0 0;text-align:center;font-size:11.5px;color:#a9b2c4;letter-spacing:.4px;}

  /* ===== 弹窗 ===== */
  .modal-overlay{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;padding:18px;
    background:rgba(51,65,85,.34);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:26px;width:100%;max-width:640px;
    max-height:86vh;overflow-y:auto;padding:24px 24px 26px;
    box-shadow:0 40px 90px -30px rgba(30,41,59,.7);
    animation:pop .3s cubic-bezier(.2,.9,.3,1.35);
  }
  @keyframes pop{from{transform:scale(.93) translateY(14px);opacity:0;}to{transform:none;opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:18px;letter-spacing:.5px;color:#1e293b;}
  .modal-close{
    width:36px;height:36px;border-radius:12px;border:1.5px solid #e6ebf5;background:#f8fafc;
    font-size:20px;line-height:1;color:#8791a5;cursor:pointer;transition:.2s;font-family:inherit;
  }
  .modal-close:hover{background:#fee2e2;border-color:#fecaca;color:#dc2626;transform:rotate(90deg);}

  /* 结果 */
  .result-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .score-ring{
    width:134px;height:134px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--ring) calc(var(--pct) * 1%), #eef2f9 0);
    display:grid;place-items:center;
    box-shadow:0 16px 34px -16px rgba(30,41,59,.6);
    animation:ringIn .6s ease;
  }
  @keyframes ringIn{from{transform:scale(.8);opacity:.3;}to{transform:none;opacity:1;}}
  .score-inner{
    width:108px;height:108px;border-radius:50%;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .score-num{font-size:37px;font-weight:900;color:#312e81;line-height:1;}
  .score-unit{font-size:11.5px;color:#9aa4b8;font-weight:700;margin-top:5px;}
  .result-info{flex:1;min-width:210px;}
  .result-info h2{margin:0 0 9px;font-size:19px;color:#1e293b;}
  .result-line{margin:0 0 4px;font-size:14.5px;color:#5b6579;}
  .result-line b{color:#4f46e5;font-size:17px;}
  .compare{
    font-size:13px;font-weight:800;margin:10px 0 6px;padding:9px 13px;
    border-radius:13px;display:inline-block;line-height:1.5;
  }
  .compare.up{background:#dcfce7;color:#15803d;}
  .compare.down{background:#ffe4e6;color:#be123c;}
  .compare.flat{background:#e0e7ff;color:#4338ca;}
  .best-line{font-size:12.5px;color:#8b93a7;margin:4px 0 0;}

  .advice{
    display:flex;gap:11px;align-items:flex-start;
    background:linear-gradient(135deg,#fffbeb,#fef3c7);
    border:1.5px solid #fde68a;border-radius:17px;padding:14px 16px;margin-bottom:18px;
  }
  .advice span{font-size:19px;line-height:1.4;}
  .advice p{margin:0;font-size:13.5px;color:#92400e;line-height:1.65;font-weight:600;}

  .result-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  /* 错题 */
  .wrong-item{
    border:1.5px solid #fecdd3;background:#fff5f6;border-radius:17px;
    padding:14px 16px;margin-bottom:12px;
  }
  .wrong-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .wrong-en{font-size:20px;font-weight:900;color:#be123c;letter-spacing:.7px;}
  .wrong-pos{
    font-size:10.5px;font-weight:800;background:#ffe4e6;color:#be123c;
    border:1px solid #fda4af;padding:2px 9px;border-radius:99px;
  }
  .wrong-zh{font-size:13.5px;color:#5b6579;margin:7px 0 10px;font-weight:600;}
  .wrong-ans{display:flex;flex-wrap:wrap;gap:9px;font-size:12.5px;font-weight:700;}
  .ua{color:#be123c;background:#fff;border:1.5px dashed #fda4af;padding:5px 11px;border-radius:11px;}
  .ca{color:#15803d;background:#f0fdf4;border:1.5px solid #86efac;padding:5px 11px;border-radius:11px;}

  /* 题库 */
  .bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .bank-item{
    display:flex;gap:9px;align-items:flex-start;
    background:#f8fafc;border:1.5px solid #edf1f9;border-radius:13px;padding:10px 12px;
  }
  .bank-idx{
    font-size:10px;font-weight:900;color:#fff;flex:0 0 auto;
    background:linear-gradient(135deg,#a5b4fc,#818cf8);
    border-radius:7px;padding:3px 6px;margin-top:2px;
  }
  .bank-en{font-weight:900;color:#1e293b;font-size:14.5px;letter-spacing:.4px;}
  .bank-pos{
    font-size:9.5px;font-weight:800;color:#7c3aed;background:#ede9fe;
    border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle;
  }
  .bank-zh{font-size:12.5px;color:#7c869a;margin-top:3px;font-weight:600;}

  /* 历史 */
  .hist-row{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;
    background:#f8fafc;border:1.5px solid #edf1f9;margin-bottom:8px;font-size:13.5px;
  }
  .hist-row.best{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fcd34d;}
  .hist-idx{font-weight:900;color:#a9b2c4;font-size:11.5px;width:34px;flex:0 0 auto;}
  .hist-time{color:#7c869a;font-size:12.5px;flex:1;font-weight:600;}
  .hist-correct{color:#7c869a;font-size:12.5px;font-weight:700;}
  .hist-score{font-size:19px;font-weight:900;color:#4f46e5;}
  .hist-score small{font-size:10.5px;color:#9aa4b8;font-weight:700;margin-left:2px;}

  .empty{
    text-align:center;padding:36px 16px;color:#9aa4b8;font-size:14.5px;
    font-weight:700;line-height:1.9;
  }

  @media (max-width:560px){
    body{padding:16px 12px 40px;}
    .card{padding:20px 16px 18px;border-radius:22px;}
    .prompt{font-size:27px;min-height:64px;letter-spacing:1px;}
    #answerInput{font-size:19px;padding:14px 16px;}
    .brand h1{font-size:16px;}
    .logo{width:46px;height:46px;font-size:22px;border-radius:14px;}
    .stat{min-width:66px;padding:7px 10px;}
    .stat-num{font-size:15px;}
    .bank-grid{grid-template-columns:1fr;}
    .score-ring{width:112px;height:112px;}
    .score-inner{width:90px;height:90px;}
    .score-num{font-size:31px;}
    .dots{gap:5px;}
    .dot{width:20px;height:20px;font-size:9.5px;border-radius:7px;}
    .btn{font-size:12.5px;padding:10px 14px;}
  }
</style>
</head>
<body>

<div class="bg-letters" id="bgLetters"></div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <h1>英语听写 · 汉译英</h1>
        <p>English Dictation · CN → EN</p>
      </div>
    </div>
    <div class="top-stats">
      <div class="stat"><span class="stat-num" id="bestScore">—</span><span class="stat-label">最高分</span></div>
      <div class="stat"><span class="stat-num" id="progressNum">0/30</span><span class="stat-label">已答</span></div>
    </div>
  </div>

  <div class="card">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="qmeta">
      <span class="qindex" id="qIndex">第 1 题 · 共 30 题</span>
      <span class="qpos" id="qPos">n.</span>
    </div>

    <div class="prompt" id="qPrompt">加载中…</div>

    <div class="input-wrap">
      <input id="answerInput" type="text" placeholder="请输入对应的英文单词…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="feedback" id="feedback"></div>

    <div class="nav-row">
      <button class="btn" id="prevBtn">← 上一题</button>
      <button class="btn" id="nextBtn">下一题 →</button>
    </div>

    <div class="dots" id="dots"></div>

    <div class="actions">
      <button class="btn primary" id="submitBtn">提交答卷</button>
      <button class="btn" id="reshuffleBtn">重新随机</button>
      <button class="btn" id="wrongBtn">查看错题</button>
      <button class="btn" id="bankBtn">查看题库</button>
      <button class="btn" id="historyBtn">历史分数</button>
    </div>

    <p class="hint">共 60 词，每组随机抽取 30 题 · 大小写不敏感 · 随时可提交</p>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="modal-overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   题库（60 词）
   ========================================================= */
const WORDS = [
  { en:'a',          pos:'art.',        zh:'一（个）' },
  { en:'according',  pos:'adv.',        zh:'根据（与 to 连用）' },
  { en:'active',     pos:'adj.',        zh:'积极的；活跃的' },
  { en:'actually',   pos:'adv.',        zh:'实际上；事实上' },
  { en:'adult',      pos:'n./adj.',     zh:'成年人；成年的' },
  { en:'alarm',      pos:'n./v.',       zh:'警报；闹钟；使惊恐' },
  { en:'aloud',      pos:'adv.',        zh:'出声地；大声地' },
  { en:'among',      pos:'prep.',       zh:'在……之中' },
  { en:'amusement',  pos:'n.',          zh:'娱乐；消遣' },
  { en:'ancient',    pos:'adj.',        zh:'古代的；古老的' },
  { en:'anymore',    pos:'adv.',        zh:'不再' },
  { en:'apart',      pos:'adv.',        zh:'分开地；相隔' },
  { en:'area',       pos:'n.',          zh:'区域；面积' },
  { en:'argue',      pos:'v.',          zh:'争论；辩论' },
  { en:'artwork',    pos:'n.',          zh:'艺术品；插图' },
  { en:'as',         pos:'prep./conj.', zh:'作为；当……时' },
  { en:'Asia',       pos:'n.',          zh:'亚洲' },
  { en:'at',         pos:'prep.',       zh:'在；向' },
  { en:'awake',      pos:'adj./v.',     zh:'醒着的；唤醒' },
  { en:'bamboo',     pos:'n.',          zh:'竹子' },
  { en:'band',       pos:'n.',          zh:'乐队；带子' },
  { en:'be',         pos:'v.',          zh:'是；存在' },
  { en:'bear',       pos:'n./v.',       zh:'熊；忍受；承受' },
  { en:'bedroom',    pos:'n.',          zh:'卧室' },
  { en:'begin',      pos:'v.',          zh:'开始' },
  { en:'belong',     pos:'v.',          zh:'属于' },
  { en:'big',        pos:'adj.',        zh:'大的' },
  { en:'birth',      pos:'n.',          zh:'出生；诞生' },
  { en:'bit',        pos:'n.',          zh:'一点；小块' },
  { en:'board',      pos:'n./v.',       zh:'板；董事会；登机' },
  { en:'born',       pos:'v./adj.',     zh:'出生；天生的' },
  { en:'brain',      pos:'n.',          zh:'大脑' },
  { en:'bread',      pos:'n.',          zh:'面包' },
  { en:'camera',     pos:'n.',          zh:'相机' },
  { en:'cannibal',   pos:'n.',          zh:'食人族' },
  { en:'cent',       pos:'n.',          zh:'分（货币单位）' },
  { en:'certain',    pos:'adj.',        zh:'确定的；某些' },
  { en:'challenge',  pos:'n./v.',       zh:'挑战' },
  { en:'check',      pos:'v./n.',       zh:'检查；核对' },
  { en:'chemistry',  pos:'n.',          zh:'化学' },
  { en:'childhood',  pos:'n.',          zh:'童年' },
  { en:'classic',    pos:'adj./n.',     zh:'经典的；经典作品' },
  { en:'close',      pos:'v./adj.',     zh:'关闭；近的' },
  { en:'cloud',      pos:'n.',          zh:'云' },
  { en:'condition',  pos:'n.',          zh:'条件；状况' },
  { en:'connect',    pos:'v.',          zh:'连接' },
  { en:'consider',   pos:'v.',          zh:'考虑' },
  { en:'copy',       pos:'n./v.',       zh:'副本；复制' },
  { en:'count',      pos:'v./n.',       zh:'数数；计数' },
  { en:'country',    pos:'n.',          zh:'国家；乡村' },
  { en:'couple',     pos:'n.',          zh:'一对；夫妻' },
  { en:'crazy',      pos:'adj.',        zh:'疯狂的' },
  { en:'cut',        pos:'v.',          zh:'切；剪' },
  { en:'deal',       pos:'v./n.',       zh:'处理；交易' },
  { en:'deep',       pos:'adj.',        zh:'深的' },
  { en:'desert',     pos:'n.',          zh:'沙漠' },
  { en:'dessert',    pos:'n.',          zh:'甜点' },
  { en:'die',        pos:'v.',          zh:'死' },
  { en:'drop',       pos:'v./n.',       zh:'掉落；滴' },
  { en:'dynasty',    pos:'n.',          zh:'王朝' }
];

const QUIZ_SIZE   = 30;
const HISTORY_KEY = 'eng_dictation_history_v1';

/* =========================================================
   DOM
   ========================================================= */
const el = id => document.getElementById(id);
const els = {
  qIndex:      el('qIndex'),
  qPos:        el('qPos'),
  qPrompt:     el('qPrompt'),
  answerInput: el('answerInput'),
  feedback:    el('feedback'),
  progressFill:el('progressFill'),
  progressNum: el('progressNum'),
  bestScore:   el('bestScore'),
  dots:        el('dots'),
  prevBtn:     el('prevBtn'),
  nextBtn:     el('nextBtn'),
  submitBtn:   el('submitBtn'),
  reshuffleBtn:el('reshuffleBtn'),
  wrongBtn:    el('wrongBtn'),
  bankBtn:     el('bankBtn'),
  historyBtn:  el('historyBtn'),
  overlay:     el('overlay'),
  modalTitle:  el('modalTitle'),
  modalBody:   el('modalBody'),
  modalClose:  el('modalClose')
};

/* =========================================================
   状态
   ========================================================= */
let quiz      = [];   // 当前 30 题
let answers   = [];   // 用户作答
let current   = 0;    // 当前题号
let submitted = false;
let wrongList = [];

/* =========================================================
   工具函数
   ========================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function norm(s){
  return (s || '').trim().toLowerCase().replace(/[\s.。，,、；;]+$/g, '');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function getHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveHistory(arr){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); }catch(e){}
}
function getBest(){
  const h = getHistory();
  return h.length ? Math.max(...h.map(x => x.score)) : null;
}
function updateBestDisplay(){
  const best = getBest();
  els.bestScore.textContent = (best === null) ? '—' : best;
}

/* =========================================================
   背景字母
   ========================================================= */
function buildBgLetters(){
  const box = el('bgLetters');
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  let html = '';
  for(let i = 0; i < 28; i++){
    const ch    = chars[Math.floor(Math.random() * chars.length)];
    const left  = (Math.random() * 96).toFixed(2);
    const top   = (Math.random() * 96).toFixed(2);
    const size  = (18 + Math.random() * 66).toFixed(0);
    const dur   = (6 + Math.random() * 9).toFixed(1);
    const delay = (Math.random() * 8).toFixed(1);
    const op    = (0.05 + Math.random() * 0.08).toFixed(3);
    html += `<span style="left:${left}%;top:${top}%;font-size:${size}px;
             animation-duration:${dur}s;animation-delay:-${delay}s;opacity:${op}">${ch}</span>`;
  }
  box.innerHTML = html;
}

/* =========================================================
   弹窗
   ========================================================= */
function openModal(title, html){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = html;
  els.overlay.classList.add('show');
}
function closeModal(){
  els.overlay.classList.remove('show');
}
els.modalClose.addEventListener('click', closeModal);
els.overlay.addEventListener('click', e => {
  if(e.target === els.overlay) closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

/* =========================================================
   开始 / 重置
   ========================================================= */
function startNewQuiz(){
  quiz      = shuffle(WORDS).slice(0, Math.min(QUIZ_SIZE, WORDS.length));
  answers   = quiz.map(() => '');
  current   = 0;
  submitted = false;
  wrongList = [];

  els.submitBtn.disabled  = false;
  els.submitBtn.textContent = '提交答卷';
  els.submitBtn.classList.remove('done');
  els.answerInput.disabled = false;

  renderQuestion();
  renderDots();
  updateProgress();
  updateBestDisplay();
}

function resetQuiz(){
  closeModal();
  startNewQuiz();
}

/* =========================================================
   渲染
   ========================================================= */
function renderQuestion(){
  const w = quiz[current];
  if(!w) return;

  els.qIndex.textContent = `第 ${current + 1} 题 · 共 ${quiz.length} 题`;
  els.qPos.textContent   = w.pos;
  els.qPrompt.textContent = w.zh;

  // 重放动画
  els.qPrompt.style.animation = 'none';
  void els.qPrompt.offsetWidth;
  els.qPrompt.style.animation = '';

  els.answerInput.value = answers[current];
  els.answerInput.disabled = submitted;
  els.answerInput.classList.remove('correct', 'wrong');
  els.feedback.textContent = '';
  els.feedback.className = 'feedback';

  if(submitted){
    const ok = norm(answers[current]) === norm(w.en);
    els.answerInput.classList.add(ok ? 'correct' : 'wrong');
    if(ok){
      els.feedback.textContent = '✅ 正确';
      els.feedback.classList.add('ok');
    }else{
      els.feedback.innerHTML = `❌ 正确答案：<b>${escapeHtml(w.en)}</b>`;
      els.feedback.classList.add('bad');
    }
  }

  els.prevBtn.disabled = (current === 0);
  els.nextBtn.disabled = (current === quiz.length - 1);

  renderDots();
  updateProgress();

  if(!submitted){
    setTimeout(() => els.answerInput.focus(), 30);
  }
}

function renderDots(){
  els.dots.innerHTML = '';
  quiz.forEach((w, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = i + 1;

    if(submitted){
      d.classList.add(norm(answers[i]) === norm(w.en) ? 'correct' : 'wrong');
    }else if(answers[i] && answers[i].trim()){
      d.classList.add('answered');
    }
    if(i === current) d.classList.add('current');

    d.addEventListener('click', () => {
      current = i;
      renderQuestion();
    });
    els.dots.appendChild(d);
  });
}

function updateProgress(){
  const answered = answers.filter(a => a && a.trim()).length;
  const pct = quiz.length ? (answered / quiz.length) * 100 : 0;
  els.progressFill.style.width = pct + '%';
  els.progressNum.textContent = `${answered}/${quiz.length}`;
}

/* =========================================================
   输入交互
   ========================================================= */
els.answerInput.addEventListener('input', e => {
  if(submitted) return;
  answers[current] = e.target.value;

  const dot = els.dots.children[current];
  if(dot) dot.classList.toggle('answered', !!e.target.value.trim());

  updateProgress();
});

els.answerInput.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || submitted) return;
  e.preventDefault();
  if(current < quiz.length - 1){
    current++;
    renderQuestion();
  }else{
    els.answerInput.blur();
  }
});

els.prevBtn.addEventListener('click', () => {
  if(current > 0){ current--; renderQuestion(); }
});
els.nextBtn.addEventListener('click', () => {
  if(current < quiz.length - 1){ current++; renderQuestion(); }
});

/* =========================================================
   提交判分
   ========================================================= */
els.submitBtn.addEventListener('click', submitQuiz);

function submitQuiz(){
  if(submitted) return;
  submitted = true;

  let correctCount = 0;
  wrongList = [];

  quiz.forEach((w, i) => {
    if(norm(answers[i]) === norm(w.en)){
      correctCount++;
    }else{
      wrongList.push({ ...w, user: (answers[i] || '').trim() });
    }
  });

  const total = quiz.length;
  const score = Math.round(correctCount / total * 100);

  const prevBest = getBest();          // 必须在保存之前取
  const history  = getHistory();
  history.push({
    score,
    correct: correctCount,
    total,
    date: Date.now()
  });
  saveHistory(history);

  updateBestDisplay();

  els.submitBtn.disabled = true;
  els.submitBtn.textContent = '✓ 已提交';
  els.submitBtn.classList.add('done');

  renderQuestion();                    // 立即显示对错标记
  showResult({ score, correctCount, total, prevBest });
}

/* =========================================================
   结果弹窗
   ========================================================= */
function getAdvice(score){
  if(score >= 95) return '太棒了！词汇掌握极其扎实，几乎满分。可以尝试默写音标，或用这些词各造一个句子来进阶。';
  if(score >= 85) return '表现优秀！整体记忆牢固，只差个别拼写细节。把错词单独抄写 3 遍，明天再测一次基本就是满分。';
  if(score >= 70) return '基础不错，但还有明显漏洞。建议把错词按“拼写 + 词性 + 中文”做成小卡片，早晚各复习一次。';
  if(score >= 60) return '刚过及格线，错词偏多。建议先分类记忆（名词 / 动词 / 形容词），再配合朗读加深印象，最后重测巩固。';
  return '需要重点加强哦！建议先挑出本次错词，逐个抄写并大声朗读 5 遍，隔天再重测一次，进步会非常明显。';
}

function showResult({ score, correctCount, total, prevBest }){
  const wrongCount = total - correctCount;
  const newBest = Math.max(prevBest === null ? 0 : prevBest, score);

  let compareHtml;
  if(prevBest === null || prevBest === undefined){
    compareHtml = `<p class="compare up">🎉 这是你的第一次记录，已保存为历史最高分！</p>`;
  }else if(score > prevBest){
    compareHtml = `<p class="compare up">📈 相比历史最高分 ${prevBest} 分，上升了 ${score - prevBest} 分！</p>`;
  }else if(score < prevBest){
    compareHtml = `<p class="compare down">📉 相比历史最高分 ${prevBest} 分，下降了 ${prevBest - score} 分，继续加油！</p>`;
  }else{
    compareHtml = `<p class="compare flat">➖ 与历史最高分 ${prevBest} 分持平，很稳！</p>`;
  }

  const ringColor = score >= 85 ? '#22c55e' : (score >= 60 ? '#f59e0b' : '#f43f5e');

  const html = `
    <div class="result-head">
      <div class="score-ring" style="--ring:${ringColor};--pct:${score}">
        <div class="score-inner">
          <span class="score-num">${score}</span>
          <span class="score-unit">分</span>
        </div>
      </div>
      <div class="result-info">
        <h2>本组测验结果</h2>
        <p class="result-line">答对 <b>${correctCount}</b> / ${total} 题 &nbsp;·&nbsp; 错 <b>${wrongCount}</b> 题</p>
        ${compareHtml}
        <p class="best-line">当前历史最高分：<b>${newBest}</b> 分</p>
      </div>
    </div>

    <div class="advice">
      <span>💡</span>
      <p>${getAdvice(score)}</p>
    </div>

    <div class="result-actions">
      <button class="btn primary" id="resWrong">查看错题 (${wrongCount})</button>
      <button class="btn" id="resRetry">再来一组</button>
      <button class="btn" id="resHistory">历史分数</button>
      <button class="btn" id="resClose">关闭</button>
    </div>
  `;

  openModal('📊 测验结果', html);

  el('resWrong').onclick   = () => { closeModal(); showWrong(); };
  el('resRetry').onclick   = () => resetQuiz();
  el('resHistory').onclick = () => showHistory();
  el('resClose').onclick   = closeModal;
}

/* =========================================================
   错题本
   ========================================================= */
els.wrongBtn.addEventListener('click', showWrong);

function showWrong(){
  if(!submitted){
    openModal('❌ 错题本',
      `<div class="empty">还没有提交答卷哦～<br>先完成并提交本次测验，才能查看错题。</div>`);
    return;
  }
  if(!wrongList.length){
    openModal('❌ 错题本', `<div class="empty">🎉 本次全部答对，没有错题！<br>继续保持这个状态吧～</div>`);
    return;
  }

  const html = wrongList.map(w => `
    <div class="wrong-item">
      <div class="wrong-top">
        <span class="wrong-en">${escapeHtml(w.en)}</span>
        <span class="wrong-pos">${escapeHtml(w.pos)}</span>
      </div>
      <div class="wrong-zh">${escapeHtml(w.zh)}</div>
      <div class="wrong-ans">
        <span class="ua">你的答案：${w.user ? escapeHtml(w.user) : '<i>未作答</i>'}</span>
        <span class="ca">正确答案：<b>${escapeHtml(w.en)}</b></span>
      </div>
    </div>
  `).join('');

  openModal(`❌ 错题本（${wrongList.length} 题）`, html);
}

/* =========================================================
   题库
   ========================================================= */
els.bankBtn.addEventListener('click', () => {
  const html = `
    <div class="bank-grid">
      ${WORDS.map((w, i) => `
        <div class="bank-item">
          <span class="bank-idx">${i + 1}</span>
          <div>
            <div class="bank-en">${escapeHtml(w.en)}<span class="bank-pos">${escapeHtml(w.pos)}</span></div>
            <div class="bank-zh">${escapeHtml(w.zh)}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  openModal(`📚 完整题库（共 ${WORDS.length} 词）`, html);
});

/* =========================================================
   历史分数
   ========================================================= */
els.historyBtn.addEventListener('click', showHistory);

function showHistory(){
  const hist = getHistory();

  if(!hist.length){
    openModal('🕘 历史分数',
      `<div class="empty">还没有任何记录～<br>先完成一次测验，成绩会自动保存到这里。</div>`);
    return;
  }

  const best = Math.max(...hist.map(h => h.score));

  const rows = hist.slice().reverse().map((h, i) => {
    const idx  = hist.length - i;
    const d    = new Date(h.date);
    const time = `${d.getMonth() + 1}/${d.getDate()} ` +
                 `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const isBest = (h.score === best);
    return `
      <div class="hist-row ${isBest ? 'best' : ''}">
        <span class="hist-idx">#${idx}</span>
        <span class="hist-time">${time}</span>
        <span class="hist-correct">${h.correct}/${h.total}</span>
        <span class="hist-score">${h.score}<small>分</small></span>
        ${isBest ? '<span title="历史最高分">👑</span>' : ''}
      </div>
    `;
  }).join('');

  const html = `
    <div style="text-align:center;margin-bottom:14px;font-size:14px;color:#5b6579;font-weight:700;">
      共 ${hist.length} 次记录 &nbsp;·&nbsp; 历史最高分
      <span style="color:#4f46e5;font-size:20px;">${best}</span> 分
    </div>
    <div class="hist-list">${rows}</div>
    <div style="text-align:center;margin-top:18px;">
      <button class="btn" id="clearHist" style="color:#e11d48;border-color:#fecaca;">清空历史记录</button>
    </div>
  `;

  openModal('🕘 历史分数', html);

  el('clearHist').onclick = () => {
    if(confirm('确定要清空全部历史成绩吗？此操作不可恢复。')){
      saveHistory([]);
      updateBestDisplay();
      closeModal();
    }
  };
}

/* =========================================================
   重新随机
   ========================================================= */
els.reshuffleBtn.addEventListener('click', () => {
  if(submitted || answers.some(a => a && a.trim())){
    if(!confirm('重新随机将清空当前作答，确定继续吗？')) return;
  }
  resetQuiz();
});

/* =========================================================
   启动
   ========================================================= */
buildBgLetters();
startNewQuiz();
</script>
</body>
</html>
