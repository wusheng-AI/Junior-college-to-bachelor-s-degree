<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 英语听写 · 华丽练习</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #f7f9fc 0%, #e3edfa 100%);
            min-height: 100vh;
            padding: 24px 16px;
            color: #1a2639;
        }

        /* ===== 华丽容器 ===== */
        .app {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 32px 28px 40px;
            box-shadow: 0 30px 60px -20px rgba(26, 38, 57, 0.25),
                0 8px 24px rgba(0, 20, 50, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        /* ===== 顶部导航 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(74, 144, 217, 0.15);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 700;
            color: #1a3a5c;
            letter-spacing: -0.5px;
        }
        .logo span {
            background: linear-gradient(135deg, #2b7be4, #6a4c9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo .icon {
            font-size: 32px;
            -webkit-text-fill-color: initial;
        }

        .nav-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            color: #1a3a5c;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-btn:hover {
            background: white;
            box-shadow: 0 8px 20px rgba(43, 123, 228, 0.15);
            transform: translateY(-2px);
            border-color: #2b7be4;
        }
        .nav-btn.primary {
            background: linear-gradient(135deg, #2b7be4, #4f6ef7);
            color: white;
            border: none;
            box-shadow: 0 6px 16px rgba(43, 123, 228, 0.30);
        }
        .nav-btn.primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 28px rgba(43, 123, 228, 0.40);
        }
        .nav-btn.gold {
            background: linear-gradient(135deg, #f5b042, #f7a81b);
            color: white;
            border: none;
            box-shadow: 0 6px 16px rgba(245, 176, 66, 0.35);
        }
        .nav-btn.gold:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 28px rgba(245, 176, 66, 0.45);
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            animation: fadeSlide 0.45s ease forwards;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 欢迎页 ===== */
        .welcome-hero {
            text-align: center;
            padding: 40px 20px 30px;
        }
        .welcome-hero .big-icon {
            font-size: 80px;
            margin-bottom: 12px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }
        .welcome-hero h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #1a3a5c, #4f6ef7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        .welcome-hero p {
            font-size: 18px;
            color: #3d5670;
            max-width: 480px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }
        .welcome-hero .sub {
            font-size: 15px;
            color: #6f8aa8;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 20px;
            border-radius: 40px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .welcome-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 28px;
        }
        .welcome-actions .nav-btn {
            font-size: 18px;
            padding: 14px 40px;
            border-radius: 60px;
        }

        /* ===== 练习页 ===== */
        .practice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .practice-header .info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 600;
            font-size: 16px;
            color: #1a3a5c;
        }
        .practice-header .info .badge {
            background: linear-gradient(135deg, #2b7be4, #4f6ef7);
            color: white;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 14px;
        }
        .practice-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .question-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 20px 0 24px;
            max-height: 560px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .question-grid::-webkit-scrollbar {
            width: 6px;
        }
        .question-grid::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 10px;
        }
        .question-grid::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #2b7be4, #4f6ef7);
            border-radius: 10px;
        }

        .q-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(4px);
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: 0.2s;
        }
        .q-item:hover {
            background: white;
            box-shadow: 0 4px 16px rgba(43, 123, 228, 0.08);
            border-color: rgba(43, 123, 228, 0.15);
        }
        .q-index {
            font-weight: 700;
            color: #2b7be4;
            font-size: 15px;
            min-width: 38px;
            text-align: center;
        }
        .q-chinese {
            font-size: 18px;
            font-weight: 600;
            color: #1a2a44;
            min-width: 80px;
            flex: 1;
        }
        .q-input {
            flex: 1;
            min-width: 140px;
            padding: 10px 16px;
            border: 2px solid rgba(43, 123, 228, 0.15);
            border-radius: 16px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.7);
            transition: 0.2s;
            outline: none;
            color: #1a2639;
        }
        .q-input:focus {
            border-color: #2b7be4;
            box-shadow: 0 0 0 4px rgba(43, 123, 228, 0.10);
            background: white;
        }
        .q-input.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.06);
        }
        .q-input.wrong {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.06);
        }
        .q-input:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .q-status {
            font-size: 22px;
            min-width: 32px;
            text-align: center;
        }

        /* ===== 结果页 ===== */
        .result-summary {
            background: linear-gradient(135deg, #f0f7ff, #e8f0fe);
            border-radius: 32px;
            padding: 28px 32px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .result-score {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .result-score .number {
            font-size: 52px;
            font-weight: 700;
            background: linear-gradient(135deg, #1a3a5c, #4f6ef7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .result-score .label {
            font-size: 18px;
            color: #3d5670;
        }
        .result-suggestion {
            font-size: 18px;
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .result-suggestion.good {
            color: #27ae60;
        }
        .result-suggestion.ok {
            color: #f39c12;
        }
        .result-suggestion.poor {
            color: #e74c3c;
        }

        .result-compare {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 16px;
            color: #1a3a5c;
            background: rgba(255, 255, 255, 0.5);
            padding: 6px 20px 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .result-compare .arrow-up {
            color: #27ae60;
            font-weight: 700;
        }
        .result-compare .arrow-down {
            color: #e74c3c;
            font-weight: 700;
        }
        .result-compare .arrow-eq {
            color: #f39c12;
            font-weight: 700;
        }

        .error-fix-area {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: rgba(231, 76, 60, 0.04);
            padding: 10px 14px;
            border-radius: 16px;
            border-left: 4px solid #e74c3c;
        }
        .error-fix-area .wrong-display {
            background: rgba(231, 76, 60, 0.10);
            padding: 6px 14px;
            border-radius: 12px;
            color: #c0392b;
            font-weight: 600;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .error-fix-area .wrong-display::before {
            content: "✖";
            color: #e74c3c;
        }
        .error-fix-area .fix-input {
            flex: 1;
            min-width: 120px;
            padding: 8px 16px;
            border: 2px solid rgba(46, 204, 113, 0.25);
            border-radius: 14px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: white;
            transition: 0.2s;
            outline: none;
        }
        .error-fix-area .fix-input:focus {
            border-color: #2ecc71;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.10);
        }
        .error-fix-area .fix-input.fixed-correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.06);
        }
        .error-fix-area .fix-input.fixed-wrong {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.06);
        }
        .error-fix-area .fix-status {
            font-size: 20px;
            min-width: 28px;
        }

        .result-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 2px solid rgba(74, 144, 217, 0.10);
        }

        /* ===== 题库页 ===== */
        .library-search {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .library-search input {
            flex: 1;
            min-width: 180px;
            padding: 12px 20px;
            border: 2px solid rgba(43, 123, 228, 0.12);
            border-radius: 40px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.6);
            outline: none;
            transition: 0.2s;
        }
        .library-search input:focus {
            border-color: #2b7be4;
            box-shadow: 0 0 0 4px rgba(43, 123, 228, 0.08);
            background: white;
        }
        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .library-grid::-webkit-scrollbar {
            width: 5px;
        }
        .library-grid::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #2b7be4, #4f6ef7);
            border-radius: 10px;
        }
        .lib-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: 0.15s;
            font-size: 15px;
        }
        .lib-item:hover {
            background: white;
            border-color: rgba(43, 123, 228, 0.15);
            transform: scale(1.01);
        }
        .lib-item .en {
            font-weight: 600;
            color: #1a3a5c;
        }
        .lib-item .zh {
            color: #4f6a88;
            font-size: 14px;
        }

        /* ===== 通用 ===== */
        .hidden {
            display: none !important;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .text-center {
            text-align: center;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-8 {
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .btn-sm:hover {
            background: white;
            transform: translateY(-1px);
        }
        .btn-sm.primary {
            background: linear-gradient(135deg, #2b7be4, #4f6ef7);
            color: white;
            border: none;
        }
        .btn-sm.primary:hover {
            box-shadow: 0 6px 16px rgba(43, 123, 228, 0.30);
        }
        .btn-sm.gold {
            background: linear-gradient(135deg, #f5b042, #f7a81b);
            color: white;
            border: none;
        }
        .btn-sm.gold:hover {
            box-shadow: 0 6px 16px rgba(245, 176, 66, 0.35);
        }
        .btn-sm.danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
        }
        .btn-sm.danger:hover {
            box-shadow: 0 6px 16px rgba(231, 76, 60, 0.30);
        }
        .btn-sm.success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
        }
        .btn-sm.success:hover {
            box-shadow: 0 6px 16px rgba(46, 204, 113, 0.30);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6f8aa8;
            font-size: 16px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .app {
                padding: 20px 14px;
                border-radius: 32px;
            }
            .logo {
                font-size: 20px;
            }
            .welcome-hero h1 {
                font-size: 30px;
            }
            .welcome-hero .big-icon {
                font-size: 56px;
            }
            .q-item {
                flex-wrap: wrap;
                gap: 8px 12px;
                padding: 12px 14px;
            }
            .q-chinese {
                min-width: 60px;
                font-size: 16px;
                flex: 0 0 auto;
            }
            .q-input {
                min-width: 100px;
                flex: 1 1 120px;
            }
            .q-index {
                min-width: 28px;
                font-size: 13px;
            }
            .result-summary {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
                padding: 20px;
            }
            .result-score .number {
                font-size: 38px;
            }
            .result-compare {
                justify-content: center;
            }
            .library-grid {
                grid-template-columns: 1fr 1fr;
            }
            .nav-btn {
                font-size: 13px;
                padding: 6px 14px;
            }
            .welcome-actions .nav-btn {
                font-size: 16px;
                padding: 12px 28px;
            }
            .error-fix-area {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 450px) {
            .library-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .nav-btns {
                justify-content: center;
            }
            .practice-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .practice-actions {
                justify-content: center;
            }
            .q-item {
                padding: 10px 12px;
            }
            .q-chinese {
                font-size: 15px;
                min-width: 50px;
            }
            .q-input {
                font-size: 15px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <span class="icon">📚</span>
                <span>听写·<span>Spark</span></span>
            </div>
            <div class="nav-btns">
                <button class="nav-btn" data-page="welcome" onclick="showPage('welcome')">🏠 首页</button>
                <button class="nav-btn primary" data-page="practice" onclick="startPractice()">✍️ 练习</button>
                <button class="nav-btn" data-page="library" onclick="showPage('library'); renderLibrary();">📖 题库</button>
                <button class="nav-btn gold" onclick="showHistory()">📊 历史</button>
            </div>
        </header>

        <!-- ===== WELCOME ===== -->
        <div class="page active" id="page-welcome">
            <div class="welcome-hero">
                <span class="big-icon">🌟</span>
                <h1>英语听写 · 华丽挑战</h1>
                <p>从 58 个核心词汇中随机抽取 30 个，检验你的拼写实力！<br>提交后智能改错，追踪进步轨迹。</p>
                <div class="sub">🎯 每次随机 · 不重复 · 实时反馈</div>
                <div class="welcome-actions">
                    <button class="nav-btn primary" onclick="startPractice()" style="font-size:20px;padding:16px 48px;">
                        🚀 开始练习
                    </button>
                    <button class="nav-btn" onclick="showPage('library'); renderLibrary();" style="font-size:18px;padding:16px 36px;">
                        📖 浏览题库
                    </button>
                </div>
                <div style="margin-top:32px;font-size:14px;color:#6f8aa8;">
                    💡 共 <strong>58</strong> 个单词 · 每次随机 <strong>30</strong> 题
                </div>
            </div>
        </div>

        <!-- ===== PRACTICE ===== -->
        <div class="page" id="page-practice">
            <div class="practice-header">
                <div class="info">
                    <span>📝 听写练习</span>
                    <span class="badge" id="progressBadge">0 / 30</span>
                </div>
                <div class="practice-actions">
                    <button class="btn-sm gold" onclick="reshuffle()">🔄 重新随机</button>
                    <button class="btn-sm primary" onclick="submitAnswers()" id="submitBtn">✅ 提交答案</button>
                </div>
            </div>
            <div class="question-grid" id="questionGrid">
                <!-- 动态渲染 -->
            </div>
            <div style="text-align:center;padding-top:8px;font-size:14px;color:#6f8aa8;">
                ✏️ 输入英文单词，全部填完后点击「提交答案」
            </div>
        </div>

        <!-- ===== RESULT ===== -->
        <div class="page" id="page-result">
            <div class="result-summary" id="resultSummary">
                <!-- 动态 -->
            </div>
            <div class="question-grid" id="resultGrid" style="max-height:500px;">
                <!-- 动态 -->
            </div>
            <div class="result-actions">
                <button class="btn-sm gold" onclick="reshuffle()">🔄 重新随机</button>
                <button class="btn-sm success" onclick="submitFixes()" id="fixSubmitBtn">📝 提交改错</button>
                <button class="btn-sm primary" onclick="startPractice()">🏁 新的一轮</button>
                <button class="btn-sm" onclick="showPage('welcome')">🏠 首页</button>
            </div>
        </div>

        <!-- ===== LIBRARY ===== -->
        <div class="page" id="page-library">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
                <h2 style="font-size:24px;color:#1a3a5c;">📖 完整题库</h2>
                <span style="font-size:14px;color:#6f8aa8;">共 <strong id="libCount">58</strong> 个词汇</span>
            </div>
            <div class="library-search">
                <input type="text" id="libSearch" placeholder="🔍 搜索中文或英文..." oninput="renderLibrary()">
                <button class="btn-sm" onclick="document.getElementById('libSearch').value='';renderLibrary();">✕ 清除</button>
            </div>
            <div class="library-grid" id="libraryGrid">
                <!-- 动态 -->
            </div>
        </div>

        <!-- ===== HISTORY (modal-like) ===== -->
        <div class="page" id="page-history">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                <h2 style="font-size:24px;color:#1a3a5c;">📊 历史成绩</h2>
                <button class="btn-sm" onclick="showPage('welcome')">🏠 返回</button>
            </div>
            <div id="historyContent">
                <!-- 动态 -->
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  数据
        // ============================================================
        const WORDS = [
            { en: "end", zh: "结束；末端" },
            { en: "real", zh: "真实的" },
            { en: "jeans", zh: "牛仔裤" },
            { en: "noodle", zh: "面条" },
            { en: "mutton", zh: "羊肉" },
            { en: "beef", zh: "牛肉" },
            { en: "cabbage", zh: "卷心菜" },
            { en: "potato", zh: "土豆" },
            { en: "would", zh: "将；会" },
            { en: "yet", zh: "还；仍然" },
            { en: "eye", zh: "眼睛" },
            { en: "singer", zh: "歌手" },
            { en: "artist", zh: "艺术家" },
            { en: "put", zh: "放置" },
            { en: "each", zh: "每个" },
            { en: "way", zh: "方式；道路" },
            { en: "another", zh: "另一个" },
            { en: "a", zh: "一（个）" },
            { en: "cinema", zh: "电影院" },
            { en: "glasses", zh: "眼镜；玻璃杯" },
            { en: "later", zh: "后来" },
            { en: "handsome", zh: "英俊的" },
            { en: "actor", zh: "男演员" },
            { en: "actress", zh: "女演员" },
            { en: "person", zh: "人" },
            { en: "nose", zh: "鼻子" },
            { en: "blonde", zh: "金发的" },
            { en: "mouth", zh: "嘴" },
            { en: "round", zh: "圆的" },
            { en: "face", zh: "脸" },
            { en: "often", zh: "经常" },
            { en: "air", zh: "空气" },
            { en: "sunshine", zh: "阳光" },
            { en: "curly", zh: "卷曲的" },
            { en: "straight", zh: "直的" },
            { en: "tall", zh: "高的" },
            { en: "medium", zh: "中等的" },
            { en: "height", zh: "高度" },
            { en: "thin", zh: "瘦的；薄的" },
            { en: "heavy", zh: "重的" },
            { en: "build", zh: "体格；建造" },
            { en: "tonight", zh: "今晚" },
            { en: "little", zh: "小的；少量的" },
            { en: "town", zh: "城镇" },
            { en: "around", zh: "在周围；大约" },
            { en: "north", zh: "北方" },
            { en: "along", zh: "沿着" },
            { en: "go", zh: "去" },
            { en: "turn", zh: "转向" },
            { en: "right", zh: "正确的；右边的" },
            { en: "left", zh: "左边的" },
            { en: "crossing", zh: "十字路口" },
            { en: "neighborhood", zh: "街区" },
            { en: "spend", zh: "花费" },
            { en: "climb", zh: "爬" },
            { en: "road", zh: "道路" },
            { en: "juice", zh: "果汁" },
            { en: "soon", zh: "不久" }
        ];

        // ============================================================
        //  状态
        // ============================================================
        let currentQuestions = []; // [{en, zh, index}]
        let userAnswers = {}; // index -> string
        let results = {}; // index -> { correct: bool, userAns: string }
        let fixes = {}; // index -> string (用户改错填写的答案)
        let fixResults = {}; // index -> { correct: bool }
        let submitted = false;
        let historyData = []; // 从 localStorage 读取

        const STORAGE_KEY = 'spark_dictation_history';

        // ============================================================
        //  工具
        // ============================================================
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function pickRandom(arr, n) {
            const shuffled = shuffle(arr);
            return shuffled.slice(0, n);
        }

        function normalize(s) {
            return s.trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function getWordByIndex(idx) {
            return WORDS[idx];
        }

        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) historyData = JSON.parse(raw);
                else historyData = [];
            } catch { historyData = []; }
            if (!Array.isArray(historyData)) historyData = [];
        }

        function saveHistory(entry) {
            loadHistory();
            historyData.push(entry);
            // 保留最近50条
            if (historyData.length > 50) historyData = historyData.slice(-50);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(historyData));
        }

        function getLatestScore() {
            loadHistory();
            if (historyData.length === 0) return null;
            return historyData[historyData.length - 1].score;
        }

        // ============================================================
        //  页面切换
        // ============================================================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('page-' + pageId);
            if (target) target.classList.add('active');
            // 如果切换到题库，渲染
            if (pageId === 'library') renderLibrary();
            if (pageId === 'history') renderHistory();
        }

        // ============================================================
        //  练习
        // ============================================================
        function generateQuestions() {
            const picked = pickRandom(WORDS, 30);
            currentQuestions = picked.map((w, i) => ({ ...w, index: WORDS.indexOf(w) }));
            // 重置状态
            userAnswers = {};
            results = {};
            fixes = {};
            fixResults = {};
            submitted = false;
            // 渲染
            renderPractice();
            document.getElementById('progressBadge').textContent = `0 / 30`;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').textContent = '✅ 提交答案';
        }

        function startPractice() {
            showPage('practice');
            generateQuestions();
        }

        function reshuffle() {
            if (document.getElementById('page-practice').classList.contains('active')) {
                generateQuestions();
            } else {
                // 从结果页重新随机 -> 回到练习页
                startPractice();
            }
        }

        function renderPractice() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = '';
            currentQuestions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'q-item';
                div.dataset.idx = q.index;
                div.innerHTML = `
                    <span class="q-index">${idx + 1}</span>
                    <span class="q-chinese">${q.zh}</span>
                    <input class="q-input" type="text" id="input-${q.index}" 
                           placeholder="输入英文..." 
                           autocomplete="off"
                           data-idx="${q.index}"
                           oninput="onInputChange(${q.index}, this.value)">
                    <span class="q-status" id="status-${q.index}"></span>
                `;
                grid.appendChild(div);
                // 如果已有答案，回填
                if (userAnswers[q.index] !== undefined) {
                    const inp = document.getElementById(`input-${q.index}`);
                    if (inp) inp.value = userAnswers[q.index];
                }
            });
            updateProgress();
        }

        function onInputChange(idx, val) {
            userAnswers[idx] = val;
            updateProgress();
            // 清除之前的状态样式
            const inp = document.getElementById(`input-${idx}`);
            if (inp) {
                inp.classList.remove('correct', 'wrong');
            }
            const status = document.getElementById(`status-${idx}`);
            if (status) status.textContent = '';
        }

        function updateProgress() {
            const filled = currentQuestions.filter(q => userAnswers[q.index] && userAnswers[q.index].trim() !== '')
                .length;
            document.getElementById('progressBadge').textContent = `${filled} / 30`;
        }

        // ============================================================
        //  提交答案
        // ============================================================
        function submitAnswers() {
            if (submitted) return;
            // 检查是否全部填写
            const allFilled = currentQuestions.every(q => {
                const val = userAnswers[q.index] || '';
                return val.trim() !== '';
            });
            if (!allFilled) {
                alert('📢 还有题目没有填写，请完成所有空格再提交！');
                return;
            }

            submitted = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = '⏳ 批改中...';

            // 判断对错
            let correctCount = 0;
            currentQuestions.forEach(q => {
                const userAns = (userAnswers[q.index] || '').trim();
                const isCorrect = normalize(userAns) === normalize(q.en);
                results[q.index] = { correct: isCorrect, userAns: userAns };
                if (isCorrect) correctCount++;
                // 显示状态
                const inp = document.getElementById(`input-${q.index}`);
                const status = document.getElementById(`status-${q.index}`);
                if (inp) {
                    inp.classList.add(isCorrect ? 'correct' : 'wrong');
                    inp.disabled = true;
                }
                if (status) {
                    status.textContent = isCorrect ? '✅' : '❌';
                }
            });

            const score = Math.round((correctCount / 30) * 100);
            document.getElementById('submitBtn').textContent = `📊 正确率 ${score}%`;

            // 显示结果页
            showResultPage(score);
        }

        // ============================================================
        //  结果页
        // ============================================================
        function showResultPage(score) {
            showPage('result');
            renderResult(score);
            // 保存分数（暂存，等改错提交后再最终保存）
            window._pendingScore = score;
            window._pendingCorrectCount = currentQuestions.filter(q => results[q.index] && results[q.index].correct).length;
        }

        function renderResult(score) {
            // summary
            const summary = document.getElementById('resultSummary');
            const correctCount = currentQuestions.filter(q => results[q.index] && results[q.index].correct).length;
            const total = currentQuestions.length;

            let suggestionText = '';
            let suggestionClass = '';
            if (score >= 90) { suggestionText = '🌟 卓越！继续保持！';
                suggestionClass = 'good'; } else if (score >= 70) { suggestionText = '💪 不错！加强易错词复习。';
                suggestionClass = 'ok'; } else if (score >= 50) { suggestionText = '📖 需要多背记，加油！';
                suggestionClass = 'ok'; } else { suggestionText = '🔥 别灰心，从错题开始突破！';
                suggestionClass = 'poor'; }

            // 历史对比
            const latest = getLatestScore();
            let compareHTML = '';
            if (latest !== null) {
                const diff = score - latest;
                let arrow = '➡️';
                let cls = 'arrow-eq';
                let text = '与上次持平';
                if (diff > 0) { arrow = '📈';
                    cls = 'arrow-up';
                    text = `上升 ${diff} 分`; } else if (diff < 0) { arrow = '📉';
                    cls = 'arrow-down';
                    text = `下降 ${Math.abs(diff)} 分`; }
                compareHTML = `
                    <div class="result-compare">
                        <span>📊 上次 ${latest}%</span>
                        <span class="${cls}">${arrow} ${text}</span>
                    </div>
                `;
            } else {
                compareHTML = `<div class="result-compare">📊 首次练习，继续加油！</div>`;
            }

            summary.innerHTML = `
                <div class="result-score">
                    <span class="number">${score}%</span>
                    <span class="label">正确率 (${correctCount}/${total})</span>
                </div>
                <div class="result-suggestion ${suggestionClass}">${suggestionText}</div>
                ${compareHTML}
            `;

            // 题目列表
            const grid = document.getElementById('resultGrid');
            grid.innerHTML = '';
            currentQuestions.forEach((q, idx) => {
                const res = results[q.index];
                const isCorrect = res && res.correct;
                const userAns = res ? res.userAns : '';

                const div = document.createElement('div');
                div.className = 'q-item';
                div.style.borderLeft = isCorrect ? '4px solid #2ecc71' : '4px solid #e74c3c';

                let errorFixHTML = '';
                if (!isCorrect) {
                    // 两个填空：展示错误答案 + 填写正确答案
                    errorFixHTML = `
                        <div class="error-fix-area">
                            <span class="wrong-display">${userAns || '(未填)'}</span>
                            <input class="fix-input" type="text" id="fix-${q.index}" 
                                   placeholder="填写正确单词..." 
                                   data-idx="${q.index}"
                                   oninput="onFixInput(${q.index}, this.value)">
                            <span class="fix-status" id="fix-status-${q.index}"></span>
                        </div>
                    `;
                } else {
                    errorFixHTML = `<div style="font-size:14px;color:#27ae60;padding:4px 0;">✅ 拼写正确</div>`;
                }

                div.innerHTML = `
                    <span class="q-index">${idx + 1}</span>
                    <span class="q-chinese">${q.zh}</span>
                    <span style="font-weight:600;color:#1a3a5c;font-size:15px;flex:1;">${q.en}</span>
                    <span style="font-size:20px;">${isCorrect ? '✅' : '❌'}</span>
                    ${errorFixHTML}
                `;
                grid.appendChild(div);

                // 如果有之前填写的改错值，回填
                if (fixes[q.index] !== undefined) {
                    const inp = document.getElementById(`fix-${q.index}`);
                    if (inp) inp.value = fixes[q.index];
                }
            });

            // 改错按钮状态
            const hasErrors = currentQuestions.some(q => results[q.index] && !results[q.index].correct);
            document.getElementById('fixSubmitBtn').disabled = !hasErrors;
            document.getElementById('fixSubmitBtn').textContent = hasErrors ? '📝 提交改错' : '🎉 全部正确！';
        }

        // ============================================================
        //  改错
        // ============================================================
        function onFixInput(idx, val) {
            fixes[idx] = val;
            const status = document.getElementById(`fix-status-${idx}`);
            if (status) status.textContent = '';
            const inp = document.getElementById(`fix-${idx}`);
            if (inp) {
                inp.classList.remove('fixed-correct', 'fixed-wrong');
            }
        }

        function submitFixes() {
            const errorItems = currentQuestions.filter(q => results[q.index] && !results[q.index].correct);
            if (errorItems.length === 0) {
                alert('🎉 全部正确，无需改错！');
                return;
            }

            // 检查是否所有错题都填写了改错
            const allFixed = errorItems.every(q => {
                const val = fixes[q.index] || '';
                return val.trim() !== '';
            });
            if (!allFixed) {
                alert('📢 还有错题未填写正确答案，请完成所有改错！');
                return;
            }

            // 判断改错是否正确
            let fixCorrectCount = 0;
            errorItems.forEach(q => {
                const userFix = (fixes[q.index] || '').trim();
                const isCorrect = normalize(userFix) === normalize(q.en);
                fixResults[q.index] = { correct: isCorrect };
                if (isCorrect) fixCorrectCount++;

                const inp = document.getElementById(`fix-${q.index}`);
                const status = document.getElementById(`fix-status-${q.index}`);
                if (inp) {
                    inp.classList.add(isCorrect ? 'fixed-correct' : 'fixed-wrong');
                    inp.disabled = true;
                }
                if (status) {
                    status.textContent = isCorrect ? '✅' : '❌';
                }
            });

            // 重新计算正确率（原始正确 + 改错正确）
            const originalCorrect = currentQuestions.filter(q => results[q.index] && results[q.index].correct).length;
            const totalCorrect = originalCorrect + fixCorrectCount;
            const newScore = Math.round((totalCorrect / 30) * 100);

            // 更新显示
            const summary = document.getElementById('resultSummary');
            const suggestionText = newScore >= 90 ? '🌟 卓越！继续保持！' :
                newScore >= 70 ? '💪 不错！加强易错词复习。' :
                newScore >= 50 ? '📖 需要多背记，加油！' : '🔥 别灰心，从错题开始突破！';
            let suggestionClass = newScore >= 90 ? 'good' : newScore >= 70 ? 'ok' : 'poor';

            const latest = getLatestScore();
            let compareHTML = '';
            if (latest !== null) {
                const diff = newScore - latest;
                let arrow = '➡️';
                let cls = 'arrow-eq';
                let text = '与上次持平';
                if (diff > 0) { arrow = '📈';
                    cls = 'arrow-up';
                    text = `上升 ${diff} 分`; } else if (diff < 0) { arrow = '📉';
                    cls = 'arrow-down';
                    text = `下降 ${Math.abs(diff)} 分`; }
                compareHTML = `
                    <div class="result-compare">
                        <span>📊 上次 ${latest}%</span>
                        <span class="${cls}">${arrow} ${text}</span>
                    </div>
                `;
            } else {
                compareHTML = `<div class="result-compare">📊 首次练习，继续加油！</div>`;
            }

            summary.innerHTML = `
                <div class="result-score">
                    <span class="number">${newScore}%</span>
                    <span class="label">正确率 (${totalCorrect}/${30})</span>
                </div>
                <div class="result-suggestion ${suggestionClass}">${suggestionText}</div>
                ${compareHTML}
            `;

            // 禁用改错提交按钮
            document.getElementById('fixSubmitBtn').disabled = true;
            document.getElementById('fixSubmitBtn').textContent = '✅ 改错完成';

            // 保存分数到历史
            saveHistory({
                score: newScore,
                correct: totalCorrect,
                total: 30,
                timestamp: new Date().toISOString(),
                originalCorrect: originalCorrect,
                fixCorrect: fixCorrectCount
            });

            // 更新历史对比（重新读取最新）
            setTimeout(() => {
                // 刷新历史对比显示
                const latest2 = getLatestScore();
                if (latest2 !== null) {
                    const diff2 = newScore - latest2;
                    let arrow2 = '➡️';
                    let cls2 = 'arrow-eq';
                    let text2 = '与上次持平';
                    if (diff2 > 0) { arrow2 = '📈';
                        cls2 = 'arrow-up';
                        text2 = `上升 ${diff2} 分`; } else if (diff2 < 0) { arrow2 = '📉';
                        cls2 = 'arrow-down';
                        text2 = `下降 ${Math.abs(diff2)} 分`; }
                    const summary2 = document.getElementById('resultSummary');
                    const compareEl = summary2.querySelector('.result-compare');
                    if (compareEl) {
                        compareEl.innerHTML = `
                            <span>📊 上次 ${latest2}%</span>
                            <span class="${cls2}">${arrow2} ${text2}</span>
                        `;
                    }
                }
            }, 100);

            // 更新错题状态
            errorItems.forEach(q => {
                const status = document.getElementById(`fix-status-${q.index}`);
                if (status) {
                    const isCorrect = fixResults[q.index] && fixResults[q.index].correct;
                    status.textContent = isCorrect ? '✅' : '❌';
                }
            });
        }

        // ============================================================
        //  题库
        // ============================================================
        function renderLibrary() {
            const search = document.getElementById('libSearch').value.trim().toLowerCase();
            const grid = document.getElementById('libraryGrid');
            let filtered = WORDS;
            if (search) {
                filtered = WORDS.filter(w =>
                    w.zh.includes(search) ||
                    w.en.toLowerCase().includes(search)
                );
            }
            document.getElementById('libCount').textContent = filtered.length;
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">🔍 没有找到匹配的单词</div>`;
                return;
            }
            grid.innerHTML = filtered.map(w => `
                <div class="lib-item">
                    <span class="en">${w.en}</span>
                    <span class="zh">${w.zh}</span>
                </div>
            `).join('');
        }

        // ============================================================
        //  历史
        // ============================================================
        function showHistory() {
            showPage('history');
            renderHistory();
        }

        function renderHistory() {
            loadHistory();
            const container = document.getElementById('historyContent');
            if (historyData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:60px 20px;">
                        📭 还没有练习记录，快去开始听写吧！
                    </div>
                `;
                return;
            }
            // 倒序显示
            const reversed = [...historyData].reverse();
            let html = `
                <div style="display:flex;flex-direction:column;gap:12px;max-height:460px;overflow-y:auto;padding-right:4px;">
            `;
            reversed.forEach((entry, idx) => {
                const date = new Date(entry.timestamp);
                const dateStr = date.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit',
                    minute: '2-digit' });
                const isLatest = idx === 0;
                html += `
                    <div style="background:${isLatest ? 'rgba(43,123,228,0.06)' : 'rgba(255,255,255,0.5)'};
                                padding:14px 20px;border-radius:20px;
                                border:${isLatest ? '2px solid #2b7be4' : '1px solid rgba(255,255,255,0.5)'};
                                display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                        <span style="font-weight:600;color:#1a3a5c;">${entry.score}%</span>
                        <span style="color:#3d5670;">${entry.correct}/${entry.total} 正确</span>
                        <span style="color:#6f8aa8;font-size:14px;">${dateStr}</span>
                        ${isLatest ? '<span style="background:#2b7be4;color:white;padding:2px 14px;border-radius:40px;font-size:12px;font-weight:600;">最新</span>' : ''}
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // ============================================================
        //  初始化
        // ============================================================
        loadHistory();
        // 默认显示欢迎页
        showPage('welcome');

        // 键盘快捷键：Enter 提交
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                const activePage = document.querySelector('.page.active');
                if (activePage && activePage.id === 'page-practice') {
                    e.preventDefault();
                    submitAnswers();
                } else if (activePage && activePage.id === 'page-result') {
                    e.preventDefault();
                    submitFixes();
                }
            }
        });

        console.log('🌟 英语听写 · Spark 已加载！');
        console.log(`📚 共 ${WORDS.length} 个词汇，每次随机 30 题。`);
    </script>

</body>
