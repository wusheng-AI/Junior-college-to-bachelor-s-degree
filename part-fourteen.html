<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语听写 · 核心词汇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f0f8ff 0%, #d4e9ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            box-shadow: 0 20px 60px rgba(0, 20, 80, 0.20), 0 8px 24px rgba(0, 0, 0, 0.05);
            padding: 40px 35px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            transition: all 0.2s;
        }

        /* 英伦装饰 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px double #c0d4e8;
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a3e6f;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
        }

        .header h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #4a6a8a;
            margin-left: 10px;
        }

        .flag-icon {
            font-size: 32px;
            line-height: 1;
        }

        .progress-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eaf3fc;
            border-radius: 40px;
            padding: 6px 16px 6px 20px;
            margin-bottom: 24px;
            border: 1px solid #b7d0e8;
        }

        .progress-text {
            font-size: 18px;
            font-weight: 600;
            color: #1f4a7a;
        }

        .progress-bar-bg {
            flex: 1;
            height: 8px;
            background: #c5d9ec;
            border-radius: 12px;
            margin: 0 16px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f7d44a, #f0b34b);
            border-radius: 12px;
            transition: width 0.35s ease;
        }

        .progress-count {
            font-size: 16px;
            font-weight: 600;
            color: #2a4f7a;
            min-width: 70px;
            text-align: right;
        }

        .question-card {
            background: #ffffffd9;
            border-radius: 32px;
            padding: 28px 24px 30px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02), 0 6px 18px rgba(30, 60, 120, 0.08);
            border: 1px solid #e3eef9;
            margin-bottom: 18px;
        }

        .chinese-hint {
            font-size: 38px;
            font-weight: 700;
            color: #0b2b4a;
            text-align: center;
            letter-spacing: 1px;
            padding: 10px 0 6px;
            word-break: break-word;
        }

        .word-detail {
            text-align: center;
            font-size: 17px;
            color: #4f6f8f;
            margin-top: 4px;
            min-height: 28px;
        }
        .word-detail span {
            background: #eef6fc;
            padding: 2px 14px;
            border-radius: 20px;
            display: inline-block;
        }

        .input-area {
            margin: 28px 0 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-area input {
            padding: 16px 22px;
            font-size: 22px;
            border: 2px solid #c7dcee;
            border-radius: 60px;
            outline: none;
            background: #f8fcff;
            transition: all 0.25s;
            letter-spacing: 0.5px;
            font-family: 'Georgia', serif;
            color: #1a3a5a;
        }

        .input-area input:focus {
            border-color: #f7b731;
            box-shadow: 0 0 0 4px rgba(247, 183, 49, 0.25);
            background: #ffffff;
        }

        .input-area input::placeholder {
            color: #a0bcd6;
            font-size: 18px;
            font-style: italic;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 6px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            background: white;
            color: #1a3a5a;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 20, 50, 0.08);
            transition: all 0.15s ease;
            border: 1.5px solid #b7d0e8;
            flex: 1 1 auto;
            min-width: 100px;
            letter-spacing: 0.5px;
            background: linear-gradient(0deg, #f5faff, #ffffff);
        }

        .btn-primary {
            background: #1a4f8a;
            border-color: #1a4f8a;
            color: white;
            box-shadow: 0 6px 16px rgba(26, 79, 138, 0.30);
        }
        .btn-primary:hover {
            background: #0f3d6b;
            transform: scale(1.02);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-success {
            background: #2a7a4a;
            border-color: #2a7a4a;
            color: white;
            box-shadow: 0 6px 16px rgba(42, 122, 74, 0.25);
        }
        .btn-success:hover {
            background: #1d5f38;
        }

        .btn-warning {
            background: #e8a72b;
            border-color: #d99a1f;
            color: #1a2a3a;
        }
        .btn-warning:hover {
            background: #d6961b;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #8eb0d0;
            color: #1f4a7a;
        }
        .btn-outline:hover {
            background: #e3effa;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .feedback {
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            background: #f2f8ff;
            border: 2px solid #cfe0ef;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .feedback.correct {
            background: #e3f5e3;
            border-color: #7bc47f;
            color: #1d6b2a;
        }
        .feedback.wrong {
            background: #ffe8e8;
            border-color: #f7a8a8;
            color: #a13030;
        }

        .stats-panel {
            margin-top: 20px;
            background: #f0f7fe;
            border-radius: 28px;
            padding: 18px 20px;
            border: 1px solid #cfe0ef;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            font-size: 17px;
            color: #1d3d5d;
        }
        .stats-row strong {
            color: #0b2b4a;
        }

        .extra-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
        }

        .extra-buttons .btn {
            font-size: 15px;
            padding: 10px 18px;
            min-width: 90px;
            flex: 0 1 auto;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 20, 40, 0.5);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            border-radius: 48px;
            padding: 30px 30px 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            overflow-y: auto;
            border: 2px solid #f7d44a;
        }

        .modal-box h2 {
            font-size: 26px;
            color: #1a3e6f;
            border-bottom: 2px solid #dce8f2;
            padding-bottom: 12px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-box h2 button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #6a8aaa;
            padding: 0 10px;
        }
        .modal-box h2 button:hover {
            color: #c0392b;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 16px;
        }
        .word-item {
            display: flex;
            flex-wrap: wrap;
            padding: 6px 12px;
            background: #f5faff;
            border-radius: 30px;
            align-items: baseline;
            border: 1px solid #e3eef9;
        }
        .word-item .en {
            font-weight: 700;
            color: #0b2b4a;
            min-width: 100px;
        }
        .word-item .pos {
            color: #4f6f8f;
            margin: 0 10px;
            font-style: italic;
        }
        .word-item .zh {
            color: #1f4a7a;
        }
        .word-item .phon {
            color: #6f8faf;
            margin-right: 10px;
            font-size: 14px;
        }

        .close-btn {
            margin-top: 18px;
            text-align: center;
        }

        @media (max-width: 520px) {
            .container { padding: 20px 18px; }
            .chinese-hint { font-size: 28px; }
            .input-area input { font-size: 18px; padding: 14px 16px; }
            .btn { font-size: 15px; padding: 10px 16px; min-width: 70px; }
            .header h1 { font-size: 22px; }
            .progress-text { font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header">
        <h1>📖 听写 <small>核心词汇</small></h1>
        <div class="flag-icon">🇬🇧</div>
    </div>

    <div class="progress-area">
        <span class="progress-text">📌 进度</span>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-count" id="progressCount">0 / 30</span>
    </div>

    <div class="question-card">
        <div class="chinese-hint" id="chineseHint">加载中…</div>
        <div class="word-detail" id="wordDetail"><span>📘 输入英文</span></div>

        <div class="input-area">
            <input type="text" id="answerInput" placeholder="请输入英文单词…" autocomplete="off" />
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="submitBtn">✔ 提交</button>
            <button class="btn btn-warning" id="nextBtn" disabled>➡ 下一题</button>
            <button class="btn btn-outline" id="reshuffleBtn">🔄 重新随机</button>
        </div>

        <div class="feedback" id="feedback">✏️ 输入答案后点击提交</div>
    </div>

    <!-- 统计与额外功能 -->
    <div class="stats-panel" id="statsPanel">
        <div class="stats-row">
            <span>✅ 正确：<strong id="correctCount">0</strong></span>
            <span>❌ 错误：<strong id="wrongCount">0</strong></span>
            <span>📊 正确率：<strong id="rateDisplay">0%</strong></span>
        </div>
        <div class="stats-row" style="margin-top:6px; font-size:15px; color:#4a6a8a;">
            <span>🏆 历史最高：<strong id="highestDisplay">—</strong></span>
            <span>📈 本次对比：<strong id="compareDisplay">—</strong></span>
        </div>
        <div class="extra-buttons">
            <button class="btn btn-outline" id="showWrongBtn">📕 查看错题</button>
            <button class="btn btn-outline" id="showHistoryBtn">📜 历史分数</button>
            <button class="btn btn-outline" id="showBankBtn">📚 题库</button>
        </div>
    </div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h2><span id="modalTitle">标题</span><button id="modalCloseBtn">✕</button></h2>
        <div id="modalContent" class="word-list"></div>
        <div class="close-btn"><button class="btn btn-primary" id="modalCloseBtn2">关闭</button></div>
    </div>
</div>

<script>
    // ---------- 题库（58词） ----------
    const FULL_WORDS = [
        { en: "define", phon: "/dɪˈfaɪn/", pos: "v.", zh: "定义；明确" },
        { en: "definite", phon: "/ˈdefɪnət/", pos: "adj.", zh: "明确的；肯定的" },
        { en: "definition", phon: "/ˌdefɪˈnɪʃn/", pos: "n.", zh: "定义；清晰度" },
        { en: "infinite", phon: "/ˈɪnfɪnət/", pos: "adj.", zh: "无限的；无穷的" },
        { en: "finance", phon: "/ˈfaɪnæns; faɪˈnæns/", pos: "n./v.", zh: "财政，金融；资助" },
        { en: "financial", phon: "/faɪˈnænʃl/", pos: "adj.", zh: "金融的；财政的" },
        { en: "influence", phon: "/ˈɪnfluəns/", pos: "n./v.", zh: "影响；势力" },
        { en: "inherit", phon: "/ɪnˈherɪt/", pos: "v.", zh: "继承" },
        { en: "result", phon: "/rɪˈzʌlt/", pos: "n./v.", zh: "结果；导致" },
        { en: "cope", phon: "/kəʊp/", pos: "v.", zh: "应付；处理" },
        { en: "emergent", phon: "/iˈmɜːdʒənt/", pos: "adj.", zh: "紧急的；新兴的" },
        { en: "emergency", phon: "/iˈmɜːdʒənsi/", pos: "n.", zh: "紧急情况" },
        { en: "emphasis", phon: "/ˈemfəsɪs/", pos: "n.", zh: "强调；重点" },
        { en: "emphasize", phon: "/ˈemfəsaɪz/", pos: "v.", zh: "强调" },
        { en: "sweet", phon: "/swiːt/", pos: "adj.", zh: "甜的；可爱的" },
        { en: "brief", phon: "/briːf/", pos: "adj./n./v.", zh: "简短的；摘要；向…介绍情况" },
        { en: "in", phon: "/ɪn/", pos: "prep./adv./adj.", zh: "在…里；进入；流行的" },
        { en: "bright", phon: "/braɪt/", pos: "adj.", zh: "明亮的；聪明的" },
        { en: "brilliant", phon: "/ˈbrɪliənt/", pos: "adj.", zh: "灿烂的；杰出的" },
        { en: "bring", phon: "/brɪŋ/", pos: "v.", zh: "带来；导致" },
        { en: "final", phon: "/ˈfaɪnl/", pos: "adj./n.", zh: "最终的；决赛" },
        { en: "flexible", phon: "/ˈfleksəbl/", pos: "adj.", zh: "灵活的；柔韧的" },
        { en: "reflect", phon: "/rɪˈflekt/", pos: "v.", zh: "反射；反映；思考" },
        { en: "reflection", phon: "/rɪˈflekʃn/", pos: "n.", zh: "反射；反映；思考" },
        { en: "flight", phon: "/flaɪt/", pos: "n.", zh: "飞行；航班" },
        { en: "flood", phon: "/flʌd/", pos: "n./v.", zh: "洪水；淹没" },
        { en: "trick", phon: "/trɪk/", pos: "n./v.", zh: "把戏；欺骗" },
        { en: "play", phon: "/pleɪ/", pos: "v./n.", zh: "玩；演奏；戏剧" },
        { en: "trip", phon: "/trɪp/", pos: "n./v.", zh: "旅行；绊倒" },
        { en: "estimate", phon: "/ˈestɪmət; ˈestɪmeɪt/", pos: "n./v.", zh: "估计" },
        { en: "force", phon: "/fɔːs/", pos: "n./v.", zh: "力量；强迫" },
        { en: "frank", phon: "/fræŋk/", pos: "adj.", zh: "坦白的；直率的" },
        { en: "free", phon: "/friː/", pos: "adj./v./adv.", zh: "自由的；释放；免费地" },
        { en: "emerge", phon: "/iˈmɜːdʒ/", pos: "v.", zh: "出现；浮现" },
        { en: "healthy", phon: "/ˈhelθi/", pos: "adj.", zh: "健康的；有益健康的" },
        { en: "disturb", phon: "/dɪˈstɜːb/", pos: "v.", zh: "打扰；扰乱" },
        { en: "scarce", phon: "/skeəs/", pos: "adj.", zh: "稀少的；缺乏的" },
        { en: "scarcely", phon: "/ˈskeəsli/", pos: "adv.", zh: "几乎不；刚刚" },
        { en: "rarely", phon: "/ˈreəli/", pos: "adv.", zh: "很少；难得" },
        { en: "hard", phon: "/hɑːd/", pos: "adj./adv.", zh: "坚硬的；困难的；努力地" },
        { en: "hardly", phon: "/ˈhɑːdli/", pos: "adv.", zh: "几乎不" },
        { en: "merely", phon: "/ˈmɪəli/", pos: "adv.", zh: "仅仅；只不过" },
        { en: "nearly", phon: "/ˈnɪəli/", pos: "adv.", zh: "几乎；差不多" },
        { en: "trend", phon: "/trend/", pos: "n.", zh: "趋势；倾向" },
        { en: "trust", phon: "/trʌst/", pos: "n./v.", zh: "信任；相信" },
        { en: "truth", phon: "/truːθ/", pos: "n.", zh: "真理；事实" },
        { en: "flat", phon: "/flæt/", pos: "adj./n./adv.", zh: "平的；公寓；平直地" },
        { en: "try", phon: "/traɪ/", pos: "v./n.", zh: "尝试；努力" },
        { en: "calm", phon: "/kɑːm/", pos: "adj./v./n.", zh: "冷静的；使平静；平静" },
        { en: "several", phon: "/ˈsevrəl/", pos: "adj./pron.", zh: "几个；若干" },
        { en: "severe", phon: "/sɪˈvɪə(r)/", pos: "adj.", zh: "严重的；严厉的" },
        { en: "focus", phon: "/ˈfəʊkəs/", pos: "n./v.", zh: "焦点；集中" },
        { en: "follow", phon: "/ˈfɒləʊ/", pos: "v.", zh: "跟随；遵循；理解" },
        { en: "following", phon: "/ˈfɒləʊɪŋ/", pos: "prep./adj./n.", zh: "在…之后；接着的；追随者" },
        { en: "fellow", phon: "/ˈfeləʊ/", pos: "n./adj.", zh: "家伙；同伴的" },
        { en: "altogether", phon: "/ˌɔːltəˈɡeðə(r)/", pos: "adv.", zh: "总共；完全；总之" },
        { en: "fond", phon: "/fɒnd/", pos: "adj.", zh: "喜欢的；深情的" },
        { en: "health", phon: "/helθ/", pos: "n.", zh: "健康；健康状况" }
    ];

    // ---------- 状态 ----------
    let currentQuestions = [];          // 当前30题（对象数组）
    let currentIndex = 0;             // 当前题目索引（0~29）
    let results = [];                // 每道题的结果 true/false (长度30)
    let answered = false;            // 当前题目是否已提交
    let totalCorrect = 0;
    let totalWrong = 0;
    let isFinished = false;          // 是否已完成全部30题

    // DOM 引用
    const chineseHint = document.getElementById('chineseHint');
    const wordDetail = document.getElementById('wordDetail');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const reshuffleBtn = document.getElementById('reshuffleBtn');
    const feedback = document.getElementById('feedback');
    const progressFill = document.getElementById('progressFill');
    const progressCount = document.getElementById('progressCount');
    const correctCountEl = document.getElementById('correctCount');
    const wrongCountEl = document.getElementById('wrongCount');
    const rateDisplay = document.getElementById('rateDisplay');
    const highestDisplay = document.getElementById('highestDisplay');
    const compareDisplay = document.getElementById('compareDisplay');

    // 模态框
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalCloseBtn2 = document.getElementById('modalCloseBtn2');

    // ---------- 辅助函数 ----------
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 从全题库中随机选30个（不重复）
    function pickRandomQuestions(count = 30) {
        const shuffled = shuffleArray([...FULL_WORDS]);
        return shuffled.slice(0, count);
    }

    // 更新进度条
    function updateProgress() {
        const total = currentQuestions.length;
        const done = Math.min(currentIndex, total); // 已提交题数
        const pct = total > 0 ? (done / total) * 100 : 0;
        progressFill.style.width = pct + '%';
        progressCount.textContent = `${done} / ${total}`;
    }

    // 更新统计显示
    function updateStats() {
        const total = results.length;
        const correct = results.filter(r => r === true).length;
        const wrong = total - correct;
        totalCorrect = correct;
        totalWrong = wrong;
        correctCountEl.textContent = correct;
        wrongCountEl.textContent = wrong;
        const rate = total > 0 ? Math.round((correct / total) * 100) : 0;
        rateDisplay.textContent = rate + '%';

        // 更新最高分显示（从localStorage）
        const highest = getHighestScore();
        highestDisplay.textContent = highest !== null ? highest + '%' : '—';

        // 若已完成，则比较
        if (isFinished) {
            const currentRate = rate;
            if (highest !== null) {
                if (currentRate > highest) {
                    compareDisplay.textContent = '🎉 上升！新纪录！';
                    compareDisplay.style.color = '#1d6b2a';
                } else if (currentRate < highest) {
                    compareDisplay.textContent = '📉 下降，继续加油';
                    compareDisplay.style.color = '#a13030';
                } else {
                    compareDisplay.textContent = '➖ 持平';
                    compareDisplay.style.color = '#4f6f8f';
                }
            } else {
                compareDisplay.textContent = '🌟 首次完成';
                compareDisplay.style.color = '#1f4a7a';
            }
        } else {
            compareDisplay.textContent = '—';
            compareDisplay.style.color = '#4a6a8a';
        }
    }

    // ---------- localStorage 操作 ----------
    function getHistoryScores() {
        try {
            const data = localStorage.getItem('wordQuiz_history');
            return data ? JSON.parse(data) : [];
        } catch { return []; }
    }

    function saveHistoryScore(score) {
        const history = getHistoryScores();
        history.push(score); // score 为百分比整数
        localStorage.setItem('wordQuiz_history', JSON.stringify(history));
    }

    function getHighestScore() {
        const history = getHistoryScores();
        if (history.length === 0) return null;
        return Math.max(...history);
    }

    // 保存错题（每次错误时记录完整词条）
    function saveWrongWord(wordObj) {
        let wrongs = [];
        try {
            const data = localStorage.getItem('wordQuiz_wrongs');
            wrongs = data ? JSON.parse(data) : [];
        } catch { wrongs = []; }
        wrongs.push({ ...wordObj, timestamp: Date.now() });
        localStorage.setItem('wordQuiz_wrongs', JSON.stringify(wrongs));
    }

    function getWrongWords() {
        try {
            const data = localStorage.getItem('wordQuiz_wrongs');
            return data ? JSON.parse(data) : [];
        } catch { return []; }
    }

    // ---------- 渲染当前题目 ----------
    function renderQuestion() {
        if (currentIndex >= currentQuestions.length) {
            // 已完成所有题目
            finishQuiz();
            return;
        }

        const q = currentQuestions[currentIndex];
        chineseHint.textContent = q.zh;
        wordDetail.innerHTML = `<span>${q.pos} · ${q.phon}</span>`;
        answerInput.value = '';
        answerInput.disabled = false;
        answerInput.focus();
        feedback.className = 'feedback';
        feedback.textContent = '✏️ 输入答案后点击提交';
        answered = false;
        submitBtn.disabled = false;
        nextBtn.disabled = true;
        // 更新进度（已提交数 = currentIndex）
        updateProgress();
        updateStats();
        // 滚动到顶部
        document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ---------- 提交答案 ----------
    function handleSubmit() {
        if (answered) {
            feedback.textContent = '⏳ 本题已作答，请点击“下一题”继续';
            feedback.className = 'feedback';
            return;
        }
        if (currentIndex >= currentQuestions.length) {
            feedback.textContent = '🎯 所有题目已完成！';
            return;
        }

        const userInput = answerInput.value.trim();
        const q = currentQuestions[currentIndex];
        const correctAnswer = q.en;
        const isCorrect = userInput.toLowerCase() === correctAnswer.toLowerCase();

        // 记录结果
        results[currentIndex] = isCorrect;
        if (isCorrect) {
            feedback.className = 'feedback correct';
            feedback.textContent = `✅ 正确！ 答案：${correctAnswer}`;
        } else {
            feedback.className = 'feedback wrong';
            feedback.textContent = `❌ 错误。 正确答案：${correctAnswer}，你的答案：${userInput || '(空)'}`;
            // 保存错题
            saveWrongWord(q);
        }

        answered = true;
        submitBtn.disabled = true;
        nextBtn.disabled = false;
        answerInput.disabled = true;

        // 更新统计（当前完成数 = currentIndex + 1）
        updateProgress();
        updateStats();
    }

    // ---------- 下一题 ----------
    function handleNext() {
        if (!answered) {
            feedback.textContent = '⚠️ 请先提交本题答案';
            feedback.className = 'feedback';
            return;
        }
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    // ---------- 完成全部题目 ----------
    function finishQuiz() {
        isFinished = true;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        nextBtn.disabled = true;
        chineseHint.textContent = '🎉 完成！';
        wordDetail.innerHTML = '<span>所有题目已作答</span>';
        feedback.className = 'feedback';
        const rate = results.length > 0 ? Math.round((results.filter(r=>r).length / results.length) * 100) : 0;
        feedback.textContent = `🏁 听写结束！正确率 ${rate}%`;

        // 保存分数
        saveHistoryScore(rate);

        // 更新进度
        updateProgress();
        updateStats();

        // 显示错题提示
        const wrongs = results.map((r, idx) => r ? null : currentQuestions[idx]).filter(w => w !== null);
        if (wrongs.length > 0) {
            feedback.textContent += ` 有 ${wrongs.length} 个错题，点击“查看错题”复习。`;
        }

        // 比较说明已在updateStats中处理
    }

    // ---------- 重新随机 ----------
    function reshuffle() {
        if (isFinished) {
            // 重置状态
        }
        // 重置所有
        currentQuestions = pickRandomQuestions(30);
        currentIndex = 0;
        results = new Array(30).fill(null);
        answered = false;
        isFinished = false;
        totalCorrect = 0;
        totalWrong = 0;

        // 清空反馈
        feedback.className = 'feedback';
        feedback.textContent = '🔄 已重新随机，开始作答！';
        renderQuestion();
        // 更新统计
        updateStats();
    }

    // ---------- 显示模态框 ----------
    function showModal(title, contentHTML) {
        modalTitle.textContent = title;
        modalContent.innerHTML = contentHTML;
        modalOverlay.classList.add('active');
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
    }

    // ---------- 查看错题（历史所有错题） ----------
    function showWrongWords() {
        const wrongs = getWrongWords();
        if (wrongs.length === 0) {
            showModal('📕 错题本', '<p style="text-align:center; font-size:18px; color:#4f6f8f;">🎉 暂无错题记录，继续保持！</p>');
            return;
        }
        // 按时间倒序
        const sorted = [...wrongs].reverse();
        let html = '';
        sorted.forEach((w, i) => {
            html += `<div class="word-item">
                <span class="en">${w.en}</span>
                <span class="phon">${w.phon || ''}</span>
                <span class="pos">${w.pos || ''}</span>
                <span class="zh">${w.zh}</span>
            </div>`;
        });
        showModal(`📕 错题本 (共${wrongs.length}条)`, html);
    }

    // ---------- 查看历史分数 ----------
    function showHistory() {
        const history = getHistoryScores();
        if (history.length === 0) {
            showModal('📜 历史分数', '<p style="text-align:center; font-size:18px; color:#4f6f8f;">暂无历史记录</p>');
            return;
        }
        let html = '<div style="font-size:16px; margin-bottom:10px;">历次正确率 (%):</div>';
        history.forEach((score, idx) => {
            html += `<div style="display:flex; justify-content:space-between; padding:6px 12px; background:#f5faff; border-radius:20px; margin-bottom:4px;">
                <span>第 ${idx+1} 次</span>
                <span><strong>${score}%</strong></span>
            </div>`;
        });
        const highest = getHighestScore();
        if (highest !== null) {
            html += `<div style="margin-top:12px; font-weight:700; color:#1a4f8a;">🏆 最高分：${highest}%</div>`;
        }
        showModal('📜 历史分数', html);
    }

    // ---------- 显示题库 ----------
    function showBank() {
        let html = '';
        FULL_WORDS.forEach(w => {
            html += `<div class="word-item">
                <span class="en">${w.en}</span>
                <span class="phon">${w.phon}</span>
                <span class="pos">${w.pos}</span>
                <span class="zh">${w.zh}</span>
            </div>`;
        });
        showModal(`📚 完整题库 (${FULL_WORDS.length}词)`, html);
    }

    // ---------- 初始化 ----------
    function init() {
        // 首次加载，随机选30题
        currentQuestions = pickRandomQuestions(30);
        results = new Array(30).fill(null);
        currentIndex = 0;
        isFinished = false;
        answered = false;
        renderQuestion();
        updateStats();

        // 绑定事件
        submitBtn.addEventListener('click', handleSubmit);
        nextBtn.addEventListener('click', handleNext);
        reshuffleBtn.addEventListener('click', reshuffle);
        document.getElementById('showWrongBtn').addEventListener('click', showWrongWords);
        document.getElementById('showHistoryBtn').addEventListener('click', showHistory);
        document.getElementById('showBankBtn').addEventListener('click', showBank);
        modalCloseBtn.addEventListener('click', closeModal);
        modalCloseBtn2.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // 回车键提交
        answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!submitBtn.disabled) {
                    handleSubmit();
                } else if (!nextBtn.disabled) {
                    handleNext();
                }
            }
        });
    }

    // 启动
    init();
</script>
</body>
</html>
