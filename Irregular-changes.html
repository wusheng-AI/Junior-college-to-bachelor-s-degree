<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 动词不规则变化 · 交互式测试</title>
    <style>
        :root {
            --bg-grad-1: #eaf4fc;
            --bg-grad-2: #d4e8f7;
            --bg-grad-3: #fef9e7;
            --card-bg: #ffffff;
            --primary: #1a5276;
            --primary-light: #2980b9;
            --accent: #e67e22;
            --accent-light: #f39c12;
            --gold: #f7dc6f;
            --gold-dark: #d4ac0d;
            --success: #27ae60;
            --success-bg: #eafaf1;
            --danger: #e74c3c;
            --danger-bg: #fdedec;
            --text-dark: #2c3e50;
            --text-medium: #5d6d7e;
            --text-light: #aab7b8;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
            --shadow-glow: 0 0 40px rgba(41, 128, 185, 0.15);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-main: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --font-deco: 'Georgia', 'Times New Roman', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 40%, var(--bg-grad-3) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(231, 76, 60, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(41, 128, 185, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            width: 100%;
            max-width: 580px;
            position: relative;
            z-index: 1;
        }

        /* ========== 顶部标题栏 ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-badge {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(26, 82, 118, 0.3);
            animation: pulse-badge 2.5s ease-in-out infinite;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                box-shadow: 0 4px 15px rgba(26, 82, 118, 0.3);
            }
            50% {
                box-shadow: 0 4px 25px rgba(41, 128, 185, 0.5);
            }
        }
        .title-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .title-group .subtitle {
            font-size: 0.75rem;
            color: var(--text-medium);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 2px solid rgba(26, 82, 118, 0.2);
            background: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        .btn-icon:hover {
            border-color: var(--primary-light);
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }
        .btn-icon:active {
            transform: translateY(0) scale(0.95);
        }

        /* ========== 统计栏 ========== */
        .stats-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .stat-chip {
            flex: 1;
            min-width: 80px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px 12px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: var(--transition);
        }
        .stat-chip:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .stat-chip .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .stat-chip .stat-label {
            font-size: 0.65rem;
            color: var(--text-medium);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .stat-chip.best .stat-value {
            color: var(--gold-dark);
        }
        .stat-chip.history .stat-value {
            color: var(--accent);
        }

        /* ========== 题目卡片 ========== */
        .quiz-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            padding: 28px 24px;
            position: relative;
            overflow: hidden;
            transition: all var(--transition);
            border: 2px solid rgba(255, 255, 255, 0.7);
            min-height: 360px;
            display: flex;
            flex-direction: column;
        }
        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-light), var(--accent-light), var(--gold), var(--accent-light), var(--primary-light));
            background-size: 200% 100%;
            animation: shimmer-bar 4s linear infinite;
        }
        @keyframes shimmer-bar {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }

        .quiz-card .card-decoration {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 28px;
            opacity: 0.12;
            pointer-events: none;
            animation: float-deco 4s ease-in-out infinite;
        }
        @keyframes float-deco {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(8deg);
            }
        }

        .progress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            gap: 12px;
        }
        .progress-indicator {
            font-size: 0.8rem;
            color: var(--text-medium);
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .progress-bar-track {
            flex: 1;
            height: 6px;
            background: #ecf0f1;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-light), var(--accent-light));
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .question-type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .question-type-badge.type-2 {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
        }
        .question-type-badge.type-3 {
            background: linear-gradient(135deg, #8e44ad, #a569bd);
        }
        .question-type-badge.type-4 {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }

        .question-prompt {
            font-size: 1.05rem;
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.5;
        }
        .question-word {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-family: var(--font-deco);
            text-shadow: 0 2px 4px rgba(26, 82, 118, 0.1);
            word-break: break-word;
        }
        .question-word .meaning-hint {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-medium);
            margin-left: 10px;
            font-family: var(--font-main);
            letter-spacing: 0;
            text-shadow: none;
        }
        .question-sub {
            font-size: 0.85rem;
            color: var(--text-medium);
            margin-bottom: 20px;
            font-style: italic;
        }

        .answer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
        }
        .answer-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .answer-input-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-medium);
            min-width: 70px;
            text-align: right;
            letter-spacing: 0.5px;
        }
        .answer-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid #dce4ec;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            background: #fafcfd;
            transition: all var(--transition);
            outline: none;
            font-family: var(--font-main);
            letter-spacing: 0.5px;
            min-width: 0;
        }
        .answer-input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(41, 128, 185, 0.12);
            background: #fff;
        }
        .answer-input::placeholder {
            color: var(--text-light);
            font-weight: 400;
            font-size: 0.9rem;
            letter-spacing: 0;
        }
        .answer-input.correct {
            border-color: var(--success);
            background: var(--success-bg);
        }
        .answer-input.incorrect {
            border-color: var(--danger);
            background: var(--danger-bg);
        }

        .multi-input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .multi-input-row .answer-input-group {
            flex: 1;
            min-width: 130px;
        }
        .multi-input-row .answer-input-group label {
            min-width: auto;
            text-align: left;
            font-size: 0.7rem;
        }

        /* ========== 按钮 ========== */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.5px;
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1;
            min-width: 120px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(26, 82, 118, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(26, 82, 118, 0.4);
            transform: translateY(-2px);
        }
        .btn-accent {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }
        .btn-accent:hover {
            box-shadow: 0 8px 25px rgba(230, 126, 34, 0.4);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid rgba(26, 82, 118, 0.25);
            box-shadow: var(--shadow-sm);
        }
        .btn-outline:hover {
            border-color: var(--primary-light);
            background: #f8fbfe;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4);
            transform: translateY(-2px);
        }
        .btn-danger-outline {
            background: #fff;
            color: var(--danger);
            border: 2px solid rgba(231, 76, 60, 0.3);
        }
        .btn-danger-outline:hover {
            background: var(--danger-bg);
            border-color: var(--danger);
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ========== 结果面板 ========== */
        .result-panel {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 24px;
            margin-top: 16px;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-score {
            text-align: center;
            padding: 16px 0;
        }
        .result-score .big-score {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
        }
        .result-score .score-label {
            font-size: 0.9rem;
            color: var(--text-medium);
            margin-top: 4px;
        }
        .result-percent {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 6px;
        }
        .result-message {
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-medium);
            padding: 12px;
            background: #f8fbfe;
            border-radius: 12px;
            margin-top: 10px;
            line-height: 1.6;
        }
        .result-compare {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .result-compare.up {
            color: var(--success);
        }
        .result-compare.down {
            color: var(--danger);
        }
        .result-compare.same {
            color: var(--text-medium);
        }

        /* ========== 错题列表 ========== */
        .wrong-list {
            margin-top: 14px;
            max-height: 280px;
            overflow-y: auto;
            border-radius: 12px;
            background: #fafcfd;
        }
        .wrong-item {
            padding: 12px 14px;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-size: 0.82rem;
        }
        .wrong-item:last-child {
            border-bottom: none;
        }
        .wrong-item .wi-word {
            font-weight: 800;
            color: var(--primary);
            font-size: 1rem;
        }
        .wrong-item .wi-meaning {
            color: var(--text-medium);
            font-size: 0.75rem;
        }
        .wrong-item .wi-answers {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
            width: 100%;
        }
        .wrong-item .wi-user {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .wrong-item .wi-correct {
            background: var(--success-bg);
            color: var(--success);
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .wrong-item .wi-label {
            font-size: 0.7rem;
            color: var(--text-light);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.25s ease;
            padding: 16px;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
            animation: slideUp 0.3s ease;
            position: relative;
        }
        .modal-content h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f0f4f8;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* ========== 题库表格 ========== */
        .verb-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }
        .verb-table th {
            background: var(--primary);
            color: #fff;
            padding: 8px 10px;
            text-align: left;
            font-weight: 700;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 2;
            font-size: 0.72rem;
            text-transform: uppercase;
        }
        .verb-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #ecf0f1;
            color: var(--text-dark);
            font-weight: 500;
        }
        .verb-table tr:hover td {
            background: #f0f8ff;
        }
        .verb-table .vt-base {
            font-weight: 700;
            color: var(--primary);
        }
        .verb-table .vt-meaning {
            color: var(--text-medium);
            font-size: 0.72rem;
        }

        /* ========== 历史分数列表 ========== */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #f8fbfe;
            border-radius: 10px;
            border-left: 4px solid var(--primary-light);
            font-size: 0.85rem;
        }
        .history-item .hi-score {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
        }
        .history-item .hi-date {
            color: var(--text-medium);
            font-size: 0.72rem;
        }
        .history-item .hi-percent {
            font-weight: 700;
            color: var(--accent);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-medium);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0.6;
        }
        .empty-state p {
            font-size: 0.9rem;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .quiz-card {
                padding: 20px 16px;
                min-height: 320px;
            }
            .question-word {
                font-size: 1.8rem;
            }
            .question-word .meaning-hint {
                font-size: 0.85rem;
                display: block;
                margin-left: 0;
                margin-top: 4px;
            }
            .btn {
                padding: 10px 14px;
                font-size: 0.8rem;
            }
            .answer-input {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
            .multi-input-row {
                flex-direction: column;
                gap: 8px;
            }
            .header h1 {
                font-size: 1rem;
            }
            .modal-content {
                padding: 16px;
                max-height: 85vh;
            }
            .stat-chip .stat-value {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- 顶部标题 -->
        <div class="header">
            <div class="header-left">
                <div class="logo-badge">📖</div>
                <div class="title-group">
                    <h1>动词不规则变化</h1>
                    <div class="subtitle">Irregular Verbs Challenge</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="showHistory()" title="查看历史分数">📊</button>
                <button class="btn-icon" onclick="showVerbs()" title="显示题库">📚</button>
                <button class="btn-icon" onclick="showWrongList()" title="查看错题" id="btnWrong" style="display:none;">❌</button>
            </div>
        </div>

        <!-- 统计栏 -->
        <div class="stats-bar">
            <div class="stat-chip best">
                <div class="stat-value" id="statBest">--</div>
                <div class="stat-label">🏆 最高分</div>
            </div>

        // ==================== 工具函数 ====================
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function normalizeStr(s) {
            return s.trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function isAnswerCorrect(userInput, acceptedForms) {
            const normalized = normalizeStr(userInput);
            if (!normalized) return false;
            return acceptedForms.some(f => normalizeStr(f) === normalized);
        }

        function getSavedHistory() {
            try {
                return JSON.parse(localStorage.getItem('verbQuizHistory') || '[]');
            } catch { return []; }
        }

        function saveHistoryEntry(score, total, correctCount) {
            const history = getSavedHistory();
            const entry = {
                score: score,
                total: total,
                correct: correctCount,
                percent: Math.round((correctCount / total) * 100),
                date: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit',
                    minute: '2-digit' }),
                timestamp: Date.now()
            };
            history.push(entry);
            localStorage.setItem('verbQuizHistory', JSON.stringify(history));
            return history;
        }

        function getBestScore() {
            const history = getSavedHistory();
            if (history.length === 0) return null;
            return Math.max(...history.map(h => h.score));
        }

        function getHighestPercent() {
            const history = getSavedHistory();
            if (history.length === 0) return null;
            return Math.max(...history.map(h => h.percent));
        }

        function updateStatsBar() {
            const best = getBestScore();
            const history = getSavedHistory();
            const bestPercent = getHighestPercent();
            document.getElementById('statBest').textContent = best !== null ? best + '分' : '--';
            document.getElementById('statCount').textContent = history.length;
            document.getElementById('statAccuracy').textContent = bestPercent !== null ? bestPercent + '%' : '--';
        }

        // ==================== 生成题目 ====================
        function generateQuestions() {
            const allQuestions = [];
            VERBS.forEach(verb => {
                // 题型1：根据原形写过去式
                allQuestions.push({
                    type: 1,
                    verb: verb,
                    questionText: '请写出该动词的过去式 (Past Tense)',
                    prompt: '根据原形写过去式',
                    displayWord: verb.baseAlt || verb.base,
                    displayMeaning: verb.meaning,
                    inputs: [{ key: 'past', label: '过去式', placeholder: '输入过去式' }],
                    check: function(answers) {
                        return isAnswerCorrect(answers['past'] || '', verb.past);
                    },
                    correctAnswerText: verb.past.join(' / '),
                    userAnswerText: function(answers) { return answers['past'] || '未填写'; }
                });
                // 题型2：根据原形写过去分词
                allQuestions.push({
                    type: 2,
                    verb: verb,
                    questionText: '请写出该动词的过去分词 (Past Participle)',
                    prompt: '根据原形写过去分词',
                    displayWord: verb.baseAlt || verb.base,
                    displayMeaning: verb.meaning,
                    inputs: [{ key: 'pp', label: '过去分词', placeholder: '输入过去分词' }],
                    check: function(answers) {
                        return isAnswerCorrect(answers['pp'] || '', verb.pp);
                    },
                    correctAnswerText: verb.pp.join(' / '),
                    userAnswerText: function(answers) { return answers['pp'] || '未填写'; }
                });
                // 题型3：根据过去式和过去分词写原形
                allQuestions.push({
                    type: 3,
                    verb: verb,
                    questionText: '请写出该动词的原形 (Base Form)',
                    prompt: '根据过去式和过去分词写原形',
                    displayWord: verb.past.join(' / ') + ' / ' + verb.pp.join(' / '),
                    displayMeaning: verb.meaning,
                    inputs: [{ key: 'base', label: '原形', placeholder: '输入原形' }],
                    check: function(answers) {
                        return isAnswerCorrect(answers['base'] || '', [verb.base, verb.baseAlt].filter(Boolean));
                    },
                    correctAnswerText: verb.baseAlt || verb.base,
                    userAnswerText: function(answers) { return answers['base'] || '未填写'; }
                });
                // 题型4：根据汉语意思写原形、过去式、过去分词
                allQuestions.push({
                    type: 4,
                    verb: verb,
                    questionText: '请写出该动词的原形、过去式和过去分词',
                    prompt: '根据汉语意思写完整形式',
                    displayWord: verb.meaning,
                    displayMeaning: '',
                    inputs: [
                        { key: 'base', label: '原形', placeholder: '原形' },
                        { key: 'past', label: '过去式', placeholder: '过去式' },
                        { key: 'pp', label: '过去分词', placeholder: '过去分词' },
                    ],
                    check: function(answers) {
                        const baseOk = isAnswerCorrect(answers['base'] || '', [verb.base, verb.baseAlt].filter(
                            Boolean));
                        const pastOk = isAnswerCorrect(answers['past'] || '', verb.past);
                        const ppOk = isAnswerCorrect(answers['pp'] || '', verb.pp);
                        return baseOk && pastOk && ppOk;
                    },
                    correctAnswerText: (verb.baseAlt || verb.base) + ' / ' + verb.past.join(' / ') + ' / ' + verb
                        .pp.join(' / '),
                    userAnswerText: function(answers) {
                        return (answers['base'] || '未填写') + ' / ' + (answers['past'] || '未填写') + ' / ' + (
                            answers['pp'] || '未填写');
                    }
                });
            });
            return shuffleArray(allQuestions).slice(0, TOTAL_QUESTIONS);
        }

            document.getElementById('resultPanel').innerHTML = '';
            renderQuestion();

            if (isQuizActive) {
                if (!confirm('重新随机将丢弃当前所有答案，确定继续吗？')) return;
            }
            startQuiz();

        function renderQuestion() {
            if (!isQuizActive || currentIndex >= questions.length) {
                submitQuiz();
                return;
            }
            const q = questions[currentIndex];
            const content = document.getElementById('quizContent');
            const actions = document.getElementById('quizActions');
            const progressText = document.getElementById('progressText');
            const progressFill = document.getElementById('progressFill');
            const deco = document.getElementById('cardDeco');

            // 更新进度
            progressText.textContent = `第 ${currentIndex + 1} 题 / 共 ${TOTAL_QUESTIONS} 题`;
            progressFill.style.width = `${(currentIndex / TOTAL_QUESTIONS) * 100}%`;

            // 装饰图标
            const decoMap = { 1: '✏️', 2: '📝', 3: '🔍', 4: '📖' };
            deco.textContent = decoMap[q.type] || '✏️';

            const badgeTypeClass = 'type-' + q.type;
            const badgeTextMap = { 1: '过去式', 2: '过去分词', 3: '原形', 4: '综合' };

            let html = `
                <span class="question-type-badge ${badgeTypeClass}">${badgeTextMap[q.type]} · ${q.prompt}</span>
                <div class="question-prompt">${q.questionText}</div>
                <div class="question-word">${q.displayWord}${q.displayMeaning ? '<span class="meaning-hint">' + q.displayMeaning + '</span>' : ''}</div>
                ${q.type === 4 ? '<div class="question-sub">请依次填写三个形式，用三个输入框分别作答</div>' : ''}
                <div class="answer-area" id="answerArea">
            `;

            if (q.type === 4) {
                html += `<div class="multi-input-row">`;
                q.inputs.forEach((input, idx) => {
                    html += `
                        <div class="answer-input-group">
                            <label>${input.label}</label>
                            <input class="answer-input" id="answer_${input.key}" placeholder="${input.placeholder}" autocomplete="off" spellcheck="false" />
                        </div>
                    `;
                });
                html += `</div>`;
            } else {
                const input = q.inputs[0];
                html += `
                    <div class="answer-input-group">
                        <label>${input.label}</label>
                        <input class="answer-input" id="answer_${input.key}" placeholder="${input.placeholder}" autocomplete="off" spellcheck="false" />
                    </div>
                `;
            }
            html += `</div>`;

            content.innerHTML = html;

            // 按钮
            const isLast = currentIndex === questions.length - 1;
            const isFirst = currentIndex === 0;
            actions.innerHTML = `
                <button class="btn btn-outline" onclick="prevQuestion()" ${isFirst ? 'disabled' : ''}>← 上一题</button>
                <button class="btn btn-outline" onclick="rerollQuiz()" title="重新随机选题">🔄 重新随机</button>
                <button class="btn ${isLast ? 'btn-success' : 'btn-primary'}" onclick="nextQuestion()">${isLast ? '✅ 完成' : '下一题 →'}</button>
                <button class="btn btn-danger-outline" onclick="submitQuiz()" style="flex:0.5;min-width:80px;">提交</button>
            `;

            // 恢复已保存的答案
            if (userAnswers[currentIndex]) {
                q.inputs.forEach(input => {
                    const el = document.getElementById(`answer_${input.key}`);
                    if (el && userAnswers[currentIndex][input.key]) {
                        el.value = userAnswers[currentIndex][input.key];
                    }
                });
            }

            // 自动聚焦
            setTimeout(() => {
                const firstInput = content.querySelector('.answer-input');
                if (firstInput) firstInput.focus();
            }, 100);
        }

        function getCurrentAnswers() {
            const q = questions[currentIndex];
            const answers = {};
            q.inputs.forEach(input => {
                const el = document.getElementById(`answer_${input.key}`);
                if (el) answers[input.key] = el.value;
            });
            return answers;
        }

        function saveCurrentAnswers() {
            userAnswers[currentIndex] = getCurrentAnswers();
        }

        function nextQuestion() {
            saveCurrentAnswers();
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                submitQuiz();
            }
        }

        function prevQuestion() {
            saveCurrentAnswers();
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        // ==================== 提交与判分 ====================
        function submitQuiz() {
            if (!isQuizActive) return;
            saveCurrentAnswers();
            isQuizActive = false;

            let correctCount = 0;
            wrongQuestions = [];

            questions.forEach((q, idx) => {
                const answers = userAnswers[idx] || {};
                const isCorrect = q.check(answers);
                if (isCorrect) {
                    correctCount++;
                } else {
                    wrongQuestions.push({
                        index: idx,
                        verb: q.verb,
                        type: q.type,
                        prompt: q.prompt,
                        userAnswer: q.userAnswerText(answers),
                        correctAnswer: q.correctAnswerText,
                        displayWord: q.displayWord,
                        meaning: q.verb.meaning,
                    });
                }
            });

            const score = correctCount;
            const percent = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
            const history = saveHistoryEntry(score, TOTAL_QUESTIONS, correctCount);
            const best = Math.max(...history.map(h => h.score));
            const isNewBest = score >= best && history.length > 1;
            const prevBest = best === score && history.length > 1 ?
                Math.max(...history.slice(0, -1).map(h => h.score)) :
                best;
            const compareMsg = score > prevBest ? 'up' : (score < prevBest ? 'down' : 'same');

            // 显示结果
            displayResult(score, TOTAL_QUESTIONS, correctCount, percent, compareMsg, isNewBest, prevBest);
            updateStatsBar();
            document.getElementById('btnWrong').style.display = 'inline-flex';
            document.getElementById('quizContent').innerHTML =
                '<div class="empty-state"><div class="empty-icon">🎉</div><p>测试完成！查看下方结果</p></div>';
            document.getElementById('quizActions').innerHTML = `
                <button class="btn btn-primary" onclick="startQuiz()">🎯 再测一次</button>
                <button class="btn btn-accent" onclick="rerollQuiz()">🔄 重新随机</button>
            `;
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressText').textContent = '已完成';
            document.getElementById('cardDeco').textContent = '🏆';
        }

        function displayResult(score, total, correctCount, percent, compareMsg, isNewBest, prevBest) {
            const panel = document.getElementById('resultPanel');
            panel.style.display = 'block';

            let compareHtml = '';
            if (compareMsg === 'up') {
                compareHtml = `<div class="result-compare up">📈 比历史最高分上升了 ${score - prevBest} 分！</div>`;
            } else if (compareMsg === 'down') {
                compareHtml = `<div class="result-compare down">📉 比历史最高分下降了 ${prevBest - score} 分</div>`;
            } else {
                compareHtml = `<div class="result-compare same">➖ 与历史最高分持平</div>`;
            }

            let message = '';
            if (percent >= 90) message = '🌟 太棒了！你对不规则动词掌握得非常扎实！继续保持！';
            else if (percent >= 75) message = '👍 表现不错！再巩固一下错题就能更上一层楼！';
            else if (percent >= 60) message = '📖 基础还可以，建议重点复习错题中的动词。';
            else if (percent >= 40) message = '💪 需要多加练习，建议先浏览题库后再测试。';
            else message = '📚 别灰心！先认真学习题库中的动词变化规律，再来挑战吧！';

            panel.innerHTML = `
                <div class="result-score">
                    <div class="big-score">${score}<span style="font-size:1.5rem;">/${total}</span></div>
                    <div class="score-label">正确题数 · 满分 ${total} 题</div>
                    <div class="result-percent">正确率：${percent}%</div>
                </div>
                ${compareHtml}
                <div class="result-message">${message}</div>
                ${wrongQuestions.length > 0 ? `
                    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-danger-outline" style="flex:1;" onclick="showWrongList()">❌ 查看错题 (${wrongQuestions.length}题)</button>
                        <button class="btn btn-outline" style="flex:1;" onclick="showVerbs()">📚 查看题库</button>
                    </div>
                ` : `
                    <div class="empty-state" style="padding:16px;">
                        <div class="empty-icon">🏆</div>
                        <p>全部答对！完美！</p>
                    </div>
                `}
            `;
        }

        // ==================== 错题展示 ====================
        function showWrongList() {
            if (wrongQuestions.length === 0) return;
            const modal = document.getElementById('wrongModal');
            const container = document.getElementById('wrongModalContent');
            let html = `<div class="wrong-list">`;
            wrongQuestions.forEach(wq => {
                html += `
                    <div class="wrong-item">
                        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                            <span class="wi-word">${wq.verb.baseAlt || wq.verb.base}</span>
                            <span class="wi-meaning">(${wq.verb.meaning})</span>
                            <span class="wi-label">[${wq.prompt}]</span>
                        </div>
                        <div class="wi-answers">
                            <span class="wi-label">你的答案：</span>
                            <span class="wi-user">${wq.userAnswer}</span>
                        </div>
                        <div class="wi-answers">
                            <span class="wi-label">正确答案：</span>
                            <span class="wi-correct">${wq.correctAnswer}</span>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
            modal.style.display = 'flex';
        }

        // ==================== 题库展示 ====================
        function showVerbs() {
            const modal = document.getElementById('verbsModal');
            const container = document.getElementById('verbsTableContainer');
            let html = `
                <table class="verb-table">
                    <thead>
                        <tr>
                            <th>原形</th>
                            <th>过去式</th>
                            <th>过去分词</th>
                            <th>汉语</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            VERBS.forEach(v => {
                html += `
                    <tr>
                        <td class="vt-base">${v.baseAlt || v.base}</td>
                        <td>${v.past.join(' / ')}</td>
                        <td>${v.pp.join(' / ')}</td>
                        <td class="vt-meaning">${v.meaning}</td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
            modal.style.display = 'flex';
        }

        // ==================== 历史分数展示 ====================
        function showHistory() {
            const modal = document.getElementById('historyModal');
            const container = document.getElementById('historyContent');
            const history = getSavedHistory();
            if (history.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><p>暂无历史分数记录</p></div>`;
            } else {
                const sorted = [...history].reverse();
                let html = `<div class="history-list">`;
                sorted.forEach((h, i) => {
                    const isBest = h.score === Math.max(...history.map(x => x.score));
                    html += `
                        <div class="history-item" style="border-left-color:${isBest ? '#f39c12' : '#2980b9'};">
                            <div>
                                <span class="hi-score">${h.score}分</span>
                                <span class="hi-date">${h.date}${isBest ? ' 🏆' : ''}</span>
                            </div>
                            <span class="hi-percent">${h.percent}% (${h.correct}/${h.total})</span>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            }
            modal.style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // ==================== 键盘支持 ====================
        document.addEventListener('keydown', function(e) {
            if (!isQuizActive) return;
            if (e.key === 'Enter') {
                e.preventDefault();
                const activeEl = document.activeElement;
                if (activeEl && activeEl.classList.contains('answer-input')) {
                    const inputs = document.querySelectorAll('.answer-input');
                    const idx = Array.from(inputs).indexOf(activeEl);
                    if (idx < inputs.length - 1) {
                        inputs[idx + 1].focus();
                    } else {
                        nextQuestion();
                    }
                } else {
                    nextQuestion();
                }
            }
            if (e.key === 'ArrowLeft' && e.ctrlKey) {
                e.preventDefault();
                prevQuestion();
            }
            if (e.key === 'ArrowRight' && e.ctrlKey) {
                e.preventDefault();
                nextQuestion();
            }
        });

        // ==================== 初始化 ====================
        updateStatsBar();
        document.getElementById('quizContent').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📝</div>
                <p>点击下方按钮开始测试</p>
                <p style="font-size:0.8rem;margin-top:4px;color:var(--text-light);">随机抽取30题 · 四种题型混合</p>
            </div>
        `;
        document.getElementById('quizActions').innerHTML = `
            <button class="btn btn-primary" onclick="startQuiz()">🎯 开始测试</button>
            <button class="btn btn-outline" onclick="showVerbs()">📚 查看题库</button>
        `;
    </script>
</body>
</html>
